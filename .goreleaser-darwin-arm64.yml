# GoReleaser configuration for macOS ARM builds
# Builds skywire binary from repo root (no hardware wallet)

version: 2

release:
  github:
    owner: skycoin
    name: skywire

before:
  hooks:
    - go mod tidy
    - go mod vendor

builds:
  - id: skywire
    binary: skywire
    goos:
      - darwin
    goarch:
      - arm64
    env:
      - CGO_ENABLED=0
    main: .
    ldflags: -s -w

archives:
  - id: archive
    format: tar.gz
    name_template: 'skywire-v{{ .Version }}-{{ .Os }}-{{ .Arch }}'
    builds:
      - skywire
    files:
      - none*

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
