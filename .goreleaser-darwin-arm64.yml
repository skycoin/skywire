# GoReleaser configuration for macOS ARM builds
# Builds skywire binary with hardware wallet utilities for macOS arm64

version: 2

release:
  github:
    owner: skycoin
    name: skywire

builds:
  - id: skywire
    binary: skywire
    goos:
      - darwin
    goarch:
      - arm64
    env:
      - CGO_ENABLED=1
      - CGO_CFLAGS=-I/opt/homebrew/include
      - CGO_LDFLAGS=-L/opt/homebrew/lib
    main: ./cmd/release/
    ldflags: -s -w -X github.com/skycoin/skywire/pkg/skywire-utilities/pkg/buildinfo.version=v{{.Version}} -X github.com/skycoin/skywire/pkg/skywire-utilities/pkg/buildinfo.commit={{.ShortCommit}} -X github.com/skycoin/skywire/pkg/skywire-utilities/pkg/buildinfo.date={{.Date}}

archives:
  - id: archive
    format: tar.gz
    name_template: 'skywire-v{{ .Version }}-{{ .Os }}-{{ .Arch }}'
    builds:
      - skywire
    files:
      - none*

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
