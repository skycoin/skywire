# GoReleaser configuration for Linux builds
# Documentation at http://goreleaser.com

version: 2

release:
  github:
    owner: skycoin
    name: skywire

before:
  hooks:
    - go mod tidy
    - sed -i '/go conn.handleCall(msg)/c\conn.handleCall(msg)' ./vendor/github.com/godbus/dbus/v5/conn.go
builds:

  - id: skywire-amd64
    binary: skywire
    goos:
      - linux
    goarch:
      - amd64
    flags:
      - -tags=cgo
    env:
      - CGO_ENABLED=1
      - CC=/home/runner/work/skywire/skywire/musl-data/x86_64-linux-musl-cross/bin/x86_64-linux-musl-gcc
    main: ./
    ldflags: -s -w -linkmode external -extldflags '-static' -buildid= -X github.com/skycoin/skywire/pkg/skywire-utilities/pkg/buildinfo.version=v{{.Version}} -X github.com/skycoin/skywire/pkg/skywire-utilities/pkg/buildinfo.commit={{.ShortCommit}} -X github.com/skycoin/skywire/pkg/skywire-utilities/pkg/buildinfo.date={{.Date}} -X github.com/skycoin/skywire/pkg/visor.BuildTag={{.Os}}_{{.Arch}}

  - id: skywire-386
    binary: skywire
    goos:
      - linux
    goarch:
      - 386
    flags:
      - -tags=cgo
    env:
      - CGO_ENABLED=1
      - CC=/home/runner/work/skywire/skywire/musl-data/i686-linux-musl-cross/bin/i686-linux-musl-gcc
    main: ./
    ldflags: -s -w -linkmode external -extldflags '-static' -buildid= -X github.com/skycoin/skywire/pkg/skywire-utilities/pkg/buildinfo.version=v{{.Version}} -X github.com/skycoin/skywire/pkg/skywire-utilities/pkg/buildinfo.commit={{.ShortCommit}} -X github.com/skycoin/skywire/pkg/skywire-utilities/pkg/buildinfo.date={{.Date}} -X github.com/skycoin/skywire/pkg/visor.BuildTag={{.Os}}_{{.Arch}}

  - id: skywire-arm64
    binary: skywire
    goos:
      - linux
    goarch:
      - arm64
    flags:
      - -tags=cgo
    env:
      - CGO_ENABLED=1
      - CC=/home/runner/work/skywire/skywire/musl-data/aarch64-linux-musl-cross/bin/aarch64-linux-musl-gcc
    main: ./
    ldflags: -s -w -linkmode external -extldflags '-static' -buildid= -X github.com/skycoin/skywire/pkg/skywire-utilities/pkg/buildinfo.version=v{{.Version}} -X github.com/skycoin/skywire/pkg/skywire-utilities/pkg/buildinfo.commit={{.ShortCommit}} -X github.com/skycoin/skywire/pkg/skywire-utilities/pkg/buildinfo.date={{.Date}} -X github.com/skycoin/skywire/pkg/visor.BuildTag={{.Os}}_{{.Arch}}

  - id: skywire-arm
    binary: skywire
    goos:
      - linux
    goarch:
      - arm
    goarm:
      - 6
    flags:
      - -tags=cgo
    env:
      - CGO_ENABLED=1
      - CC=/home/runner/work/skywire/skywire/musl-data/arm-linux-musleabi-cross/bin/arm-linux-musleabi-gcc
    main: ./
    ldflags: -s -w -linkmode external -extldflags '-static' -buildid= -X github.com/skycoin/skywire/pkg/skywire-utilities/pkg/buildinfo.version=v{{.Version}} -X github.com/skycoin/skywire/pkg/skywire-utilities/pkg/buildinfo.commit={{.ShortCommit}} -X github.com/skycoin/skywire/pkg/skywire-utilities/pkg/buildinfo.date={{.Date}} -X github.com/skycoin/skywire/pkg/visor.BuildTag={{.Os}}_{{.Arch}}

  - id: skywire-armhf
    binary: skywire
    goos:
      - linux
    goarch:
      - arm
    goarm:
      - 7
    flags:
      - -tags=cgo
    env:
      - CGO_ENABLED=1
      - CC=/home/runner/work/skywire/skywire/musl-data/arm-linux-musleabihf-cross/bin/arm-linux-musleabihf-gcc
    main: ./
    ldflags: -s -w -linkmode external -extldflags '-static' -buildid= -X github.com/skycoin/skywire/pkg/skywire-utilities/pkg/buildinfo.version=v{{.Version}} -X github.com/skycoin/skywire/pkg/skywire-utilities/pkg/buildinfo.commit={{.ShortCommit}} -X github.com/skycoin/skywire/pkg/skywire-utilities/pkg/buildinfo.date={{.Date}} -X github.com/skycoin/skywire/pkg/visor.BuildTag={{.Os}}_{{.Arch}}

  - id: skywire-riscv64
    binary: skywire
    goos:
      - linux
    goarch:
      - riscv64
    flags:
      - -tags=cgo
    env:
      - CGO_ENABLED=1
      - CC=/home/runner/work/skywire/skywire/musl-data/riscv64-linux-musl-cross/bin/riscv64-linux-musl-gcc
    main: ./
    ldflags: -s -w -linkmode external -extldflags '-static' -buildid= -X github.com/skycoin/skywire/pkg/skywire-utilities/pkg/buildinfo.version=v{{.Version}} -X github.com/skycoin/skywire/pkg/skywire-utilities/pkg/buildinfo.commit={{.ShortCommit}} -X github.com/skycoin/skywire/pkg/skywire-utilities/pkg/buildinfo.date={{.Date}} -X github.com/skycoin/skywire/pkg/visor.BuildTag={{.Os}}_{{.Arch}}

archives:
  - id: amd64
    formats:
      - tar.gz
    name_template: 'skywire-v{{ .Version }}-{{ .Os }}-{{ .Arch }}'
    ids:
      - skywire-amd64
    files:
      - none*

  - id: arm64
    formats:
      - tar.gz
    name_template: 'skywire-v{{ .Version }}-{{ .Os }}-{{ .Arch }}'
    ids:
      - skywire-arm64
    files:
      - none*

  - id: arm
    formats:
      - tar.gz
    name_template: 'skywire-v{{ .Version }}-{{ .Os }}-{{ .Arch }}'
    ids:
      - skywire-arm
    files:
      - none*

  - id: armhf
    formats:
      - tar.gz
    name_template: 'skywire-v{{ .Version }}-{{ .Os }}-{{ .Arch }}hf'
    ids:
      - skywire-armhf
    files:
      - none*

  - id: 386
    formats:
      - tar.gz
    name_template: 'skywire-v{{ .Version }}-{{ .Os }}-{{ .Arch }}'
    ids:
      - skywire-386
    files:
      - none*

  - id: riscv64
    formats:
      - tar.gz
    name_template: 'skywire-v{{ .Version }}-{{ .Os }}-{{ .Arch }}'
    ids:
      - skywire-riscv64
    files:
      - none*

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
