<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skywire Network</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a0a1e;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #eee;
        }

        #container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        #sidebar {
            width: 280px;
            min-width: 280px;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            border-right: 1px solid #0f3460;
            overflow-y: auto;
            padding: 12px;
            z-index: 10;
            flex-shrink: 0;
        }

        #canvas-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        #graph-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 100;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid #0f3460;
            border-top-color: #00d9a5;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        h1 {
            font-size: 1.1em;
            color: #e94560;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #0f3460;
        }

        .section {
            margin-bottom: 16px;
            border: 1px solid #0f3460;
            border-radius: 4px;
            overflow: hidden;
        }

        .section-header {
            background: #0f3460;
            padding: 8px 12px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-header:hover {
            background: #1a4a7a;
        }

        .section-title {
            font-weight: 600;
            font-size: 0.9em;
        }

        .section-content {
            padding: 12px;
            background: rgba(15, 52, 96, 0.3);
        }

        .section.collapsed .section-content {
            display: none;
        }

        .legend {
            margin-top: 8px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            padding: 4px 0;
            font-size: 0.8em;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .legend-line {
            width: 20px;
            height: 2px;
            margin-right: 8px;
        }

        .shortcut {
            display: flex;
            padding: 4px 0;
            font-size: 0.85em;
        }

        .shortcut-key {
            background: #0f3460;
            padding: 2px 8px;
            border-radius: 3px;
            margin-right: 8px;
            font-family: monospace;
            min-width: 24px;
            text-align: center;
        }

        #error {
            color: #e94560;
            font-size: 0.85em;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="sidebar">
            <h1>Skywire</h1>

            <!-- Legend Section -->
            <div class="section" id="section-legend">
                <div class="section-header" onclick="toggleSection('section-legend')">
                    <span class="section-title">Legend</span>
                    <span class="section-toggle">▼</span>
                </div>
                <div class="section-content">
                    <div class="legend">
                        <div class="legend-item">
                            <div class="legend-dot" style="background:#00d9a5"></div>
                            <span>Online</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-dot" style="background:#e94560"></div>
                            <span>Offline</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-dot" style="background:#ffd166"></div>
                            <span>Unknown / Local Visor</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-line" style="background:#00d9a5"></div>
                            <span>STCPR Transport</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-line" style="background:#e94560"></div>
                            <span>SUDPH Transport</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-line" style="background:#6495ed"></div>
                            <span>DMSG Transport</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Controls Section -->
            <div class="section" id="section-controls">
                <div class="section-header" onclick="toggleSection('section-controls')">
                    <span class="section-title">Keyboard Shortcuts</span>
                    <span class="section-toggle">▼</span>
                </div>
                <div class="section-content">
                    <div class="shortcut">
                        <span class="shortcut-key">F</span>
                        <span>Fit to screen</span>
                    </div>
                    <div class="shortcut">
                        <span class="shortcut-key">R</span>
                        <span>Refresh data</span>
                    </div>
                    <div class="shortcut">
                        <span class="shortcut-key">P</span>
                        <span>Toggle physics</span>
                    </div>
                    <div class="shortcut">
                        <span class="shortcut-key">L</span>
                        <span>Toggle labels</span>
                    </div>
                    <div class="shortcut">
                        <span class="shortcut-key">Scroll</span>
                        <span>Zoom in/out</span>
                    </div>
                    <div class="shortcut">
                        <span class="shortcut-key">Drag</span>
                        <span>Pan view</span>
                    </div>
                    <div class="shortcut">
                        <span class="shortcut-key">Click</span>
                        <span>Select node</span>
                    </div>
                </div>
            </div>

            <div id="error"></div>
        </div>

        <div id="canvas-container">
            <div id="loading">
                <div class="spinner"></div>
                <div>Loading Skywire Network...</div>
            </div>
            <canvas id="graph-canvas"></canvas>
        </div>
    </div>

    <script src="wasm_exec.js"></script>
    <script>
        // Section toggle
        function toggleSection(id) {
            document.getElementById(id).classList.toggle('collapsed');
        }

        // Resize canvas to match container
        function resizeCanvas() {
            const container = document.getElementById('canvas-container');
            const canvas = document.getElementById('graph-canvas');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }

        // Initialize
        async function init() {
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            const go = new Go();
            try {
                const result = await WebAssembly.instantiateStreaming(
                    fetch("main.wasm"),
                    go.importObject
                );

                // Run WASM
                go.run(result.instance);

                // Wait a moment for Go to initialize, then call initTpviz
                await new Promise(resolve => setTimeout(resolve, 100));

                // Hide loading
                document.getElementById('loading').style.display = 'none';

                // Initialize the app
                if (typeof initTpviz === 'function') {
                    initTpviz('graph-canvas');
                } else {
                    throw new Error('initTpviz not found');
                }

            } catch (err) {
                document.getElementById('loading').innerHTML =
                    '<div style="color:#e94560">Failed to load: ' + err.message + '</div>';
                console.error('WASM load error:', err);
            }
        }

        init();
    </script>
</body>
</html>
