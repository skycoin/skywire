<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skywire Transport Discovery Visualizer</title>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif; background: #1a1a2e; color: #eee; }
        #container { display: flex; height: 100vh; width: 100vw; overflow: hidden; }
        #sidebar { width: 320px; min-width: 320px; background: #16213e; padding: 20px; overflow-y: auto; border-right: 1px solid #0f3460; }
        #network { flex: 1; background: #1a1a2e; position: relative; overflow: hidden; min-width: 0; }
        h1 { font-size: 1.2em; margin-bottom: 20px; color: #e94560; }
        h2 { font-size: 1em; margin: 15px 0 10px; color: #0f9b8e; }
        .stat { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #0f3460; }
        .stat-label { color: #aaa; }
        .stat-value { font-weight: bold; }
        .legend { margin-top: 15px; }
        .legend-item { display: flex; align-items: center; margin: 8px 0; }
        .legend-color { width: 30px; height: 4px; margin-right: 10px; border-radius: 2px; }
        .stcpr { background: #00d9a5; }
        .sudph { background: #00b4d8; }
        .dmsg { background: #ffd166; }
        .controls { margin-top: 20px; }
        .control-group { margin: 10px 0; }
        label { display: block; margin-bottom: 5px; color: #aaa; font-size: 0.9em; }
        input[type="checkbox"] { margin-right: 8px; }
        input[type="text"] { width: 100%; padding: 8px; background: #0f3460; border: 1px solid #1a1a2e; color: #eee; border-radius: 4px; }
        input[type="text"]:focus { outline: none; border-color: #e94560; }
        button { width: 100%; padding: 10px; margin-top: 10px; background: #e94560; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 0.9em; }
        button:hover { background: #ff6b6b; }
        button:disabled { background: #555; cursor: not-allowed; }
        #selected-info { margin-top: 20px; padding: 15px; background: #0f3460; border-radius: 4px; display: none; }
        #selected-info.visible { display: block; }
        #selected-pk { font-family: monospace; font-size: 0.7em; word-break: break-all; color: #e94560; margin: 10px 0; }
        .conn-list { max-height: 200px; overflow-y: auto; font-size: 0.8em; }
        .conn-item { padding: 4px 0; border-bottom: 1px solid #1a1a2e; font-family: monospace; font-size: 0.85em; }
        .conn-type { display: inline-block; padding: 2px 6px; border-radius: 3px; font-size: 0.8em; margin-right: 5px; }
        .conn-type.stcpr { background: rgba(0, 217, 165, 0.3); color: #00d9a5; }
        .conn-type.sudph { background: rgba(0, 180, 216, 0.3); color: #00b4d8; }
        .conn-type.dmsg { background: rgba(255, 209, 102, 0.3); color: #ffd166; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
        .spinner { width: 50px; height: 50px; border: 3px solid #0f3460; border-top-color: #e94560; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #error { color: #e94560; padding: 20px; text-align: center; display: none; }
        #cache-info { margin-top: 10px; font-size: 0.8em; color: #888; }
        .service-badge { display: inline-block; padding: 2px 6px; border-radius: 3px; font-size: 0.7em; margin: 2px; }
        .service-badge.proxy { background: rgba(255, 165, 0, 0.3); color: #ffa500; }
        .service-badge.vpn { background: rgba(138, 43, 226, 0.3); color: #9f6efc; }
        .service-badge.visor { background: rgba(50, 205, 50, 0.3); color: #32cd32; }
        .status-legend { margin-top: 10px; padding: 10px; background: #0f3460; border-radius: 4px; font-size: 0.8em; }
        .status-item { display: flex; align-items: center; margin: 5px 0; }
        .status-dot { width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; }
        .status-online { background: #00d9a5; }
        .status-offline { background: #e94560; border: 2px solid #fff; }
        .status-unknown { background: #ffd166; }
        .selected-services { margin-top: 10px; }
        .selected-country { color: #888; font-size: 0.9em; margin-top: 5px; }
        .selected-version { color: #0f9b8e; font-size: 0.9em; margin-top: 5px; font-family: monospace; }
    </style>
</head>
<body>
    <div id="container">
        <div id="sidebar">
            <h1>Transport Discovery</h1>
            <h2>Statistics</h2>
            <div class="stat"><span class="stat-label">Total Transports</span><span class="stat-value" id="total-transports">-</span></div>
            <div class="stat"><span class="stat-label">Unique Visors</span><span class="stat-value" id="total-visors">-</span></div>
            <div class="stat"><span class="stat-label">Online</span><span class="stat-value" id="count-online" style="color:#00d9a5">-</span></div>
            <div class="stat"><span class="stat-label">Offline</span><span class="stat-value" id="count-offline" style="color:#e94560">-</span></div>
            <div class="stat"><span class="stat-label">Unknown</span><span class="stat-value" id="count-unknown" style="color:#ffd166">-</span></div>
            <div class="stat"><span class="stat-label">STCPR</span><span class="stat-value" id="count-stcpr">-</span></div>
            <div class="stat"><span class="stat-label">SUDPH</span><span class="stat-value" id="count-sudph">-</span></div>
            <div class="stat"><span class="stat-label">DMSG</span><span class="stat-value" id="count-dmsg">-</span></div>

            <h2>Legend</h2>
            <div class="legend">
                <div class="legend-item"><div class="legend-color stcpr"></div><span>STCPR (TCP)</span></div>
                <div class="legend-item"><div class="legend-color sudph"></div><span>SUDPH (UDP Hole Punch)</span></div>
                <div class="legend-item"><div class="legend-color dmsg"></div><span>DMSG</span></div>
            </div>
            <div class="status-legend">
                <div class="status-item"><div class="status-dot status-online"></div><span>Online (in UT)</span></div>
                <div class="status-item"><div class="status-dot status-offline"></div><span>Offline (in UT)</span></div>
                <div class="status-item"><div class="status-dot status-unknown"></div><span>Not in UT</span></div>
            </div>

            <h2>Filters</h2>
            <div class="controls">
                <div class="control-group">
                    <label><input type="checkbox" id="show-stcpr" checked> Show STCPR</label>
                    <label><input type="checkbox" id="show-sudph" checked> Show SUDPH</label>
                    <label><input type="checkbox" id="show-dmsg" checked> Show DMSG</label>
                </div>
                <div class="control-group">
                    <label><input type="checkbox" id="show-online" checked> Show Online</label>
                    <label><input type="checkbox" id="show-offline" checked> Show Offline</label>
                    <label><input type="checkbox" id="show-unknown" checked> Show Unknown (not in UT)</label>
                </div>
                <div class="control-group">
                    <label><input type="checkbox" id="show-services"> Highlight Services (proxy/VPN)</label>
                </div>
                <div class="control-group">
                    <label for="search">Search PK (first 8 chars)</label>
                    <input type="text" id="search" placeholder="e.g. 027087fe">
                </div>
                <button id="btn-fit">Fit to Screen</button>
                <div id="cache-info"></div>
            </div>

            <div id="selected-info">
                <h2>Selected Visor</h2>
                <div id="selected-pk"></div>
                <div id="selected-status"></div>
                <div id="selected-version" class="selected-version"></div>
                <div id="selected-country" class="selected-country"></div>
                <div id="selected-services" class="selected-services"></div>
                <div class="stat"><span class="stat-label">Connections</span><span class="stat-value" id="selected-conn-count">-</span></div>
                <h2>Connected To</h2>
                <div class="conn-list" id="conn-list"></div>
            </div>
        </div>
        <div id="network">
            <div id="loading"><div class="spinner"></div><div>Loading transport data...</div></div>
            <div id="error"></div>
        </div>
    </div>
    <script>
        // Use local API endpoint when served from Go server
        const API_BASE = window.location.hostname === '' || window.location.protocol === 'file:'
            ? 'https://tpd.skywire.skycoin.com'
            : '';

        let network = null, allData = null, uptimeData = null, servicesData = null;
        let nodesDataset = null, edgesDataset = null, visorConnections = {};
        let onlineVisors = new Set(), offlineVisors = new Set(), visorServices = {}, visorVersions = {};

        const colors = { stcpr: '#00d9a5', sudph: '#00b4d8', dmsg: '#ffd166' };

        async function fetchAllData() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('error').style.display = 'none';
            try {
                // Fetch all data in parallel
                const [tpResp, utResp, sdResp] = await Promise.all([
                    fetch(API_BASE + '/api/transports').catch(() => fetch('https://tpd.skywire.skycoin.com/all-transports')),
                    fetch(API_BASE + '/api/uptimes').catch(() => null),
                    fetch(API_BASE + '/api/services').catch(() => null)
                ]);

                if (!tpResp.ok) throw new Error('HTTP ' + tpResp.status);
                allData = await tpResp.json();

                // Parse uptime data
                if (utResp && utResp.ok) {
                    uptimeData = await utResp.json();
                    processUptimeData();
                }

                // Parse services data
                if (sdResp && sdResp.ok) {
                    servicesData = await sdResp.json();
                    processServicesData();
                }

                processData();
            } catch (err) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = 'Failed to load data: ' + err.message;
            }
        }

        function processUptimeData() {
            onlineVisors.clear();
            offlineVisors.clear();
            visorVersions = {};
            if (!uptimeData) return;

            uptimeData.forEach(entry => {
                if (entry.on) {
                    onlineVisors.add(entry.pk);
                } else {
                    offlineVisors.add(entry.pk);
                }
                if (entry.version) {
                    visorVersions[entry.pk] = entry.version;
                }
            });
        }

        function processServicesData() {
            visorServices = {};
            if (!servicesData) return;

            for (const [pk, info] of Object.entries(servicesData)) {
                visorServices[pk] = {
                    services: info.services || [],
                    country: info.country || ''
                };
            }
        }

        function getVisorStatus(pk) {
            if (onlineVisors.has(pk)) return 'online';
            if (offlineVisors.has(pk)) return 'offline';
            return 'unknown';
        }

        function getNodeColor(visor) {
            const status = getVisorStatus(visor.id);
            const hasService = visorServices[visor.id] && visorServices[visor.id].services.length > 0;
            const showServices = document.getElementById('show-services').checked;

            // Service highlighting takes priority
            if (showServices && hasService) {
                const services = visorServices[visor.id].services;
                if (services.includes('vpn')) {
                    return { background: '#9f6efc', border: '#7c3aed' };
                } else if (services.includes('proxy')) {
                    return { background: '#ffa500', border: '#cc8400' };
                }
            }

            // Status-based coloring
            if (status === 'online') {
                return { background: '#00d9a5', border: '#00b386' };
            } else if (status === 'offline') {
                return { background: '#e94560', border: '#fff' };
            } else {
                return { background: '#ffd166', border: '#ccaa52' };
            }
        }

        function processData() {
            const visors = new Map();
            visorConnections = {};
            let countStcpr = 0, countSudph = 0, countDmsg = 0;

            allData.forEach(transport => {
                const [pk1, pk2] = transport.edges;
                const type = transport.type;
                if (type === 'stcpr') countStcpr++;
                else if (type === 'sudph') countSudph++;
                else if (type === 'dmsg') countDmsg++;

                [pk1, pk2].forEach(pk => {
                    if (!visors.has(pk)) visors.set(pk, { id: pk, connections: 0, types: new Set() });
                    visors.get(pk).connections++;
                    visors.get(pk).types.add(type);
                });

                if (!visorConnections[pk1]) visorConnections[pk1] = [];
                if (!visorConnections[pk2]) visorConnections[pk2] = [];
                if (pk1 !== pk2) {
                    visorConnections[pk1].push({ pk: pk2, type });
                    visorConnections[pk2].push({ pk: pk1, type });
                }
            });

            // Count by status
            let countOnline = 0, countOffline = 0, countUnknown = 0;
            visors.forEach(v => {
                const status = getVisorStatus(v.id);
                if (status === 'online') countOnline++;
                else if (status === 'offline') countOffline++;
                else countUnknown++;
            });

            document.getElementById('total-transports').textContent = allData.length;
            document.getElementById('total-visors').textContent = visors.size;
            document.getElementById('count-online').textContent = countOnline;
            document.getElementById('count-offline').textContent = countOffline;
            document.getElementById('count-unknown').textContent = countUnknown;
            document.getElementById('count-stcpr').textContent = countStcpr;
            document.getElementById('count-sudph').textContent = countSudph;
            document.getElementById('count-dmsg').textContent = countDmsg;

            const maxConn = Math.max(...Array.from(visors.values()).map(v => v.connections));
            const nodes = Array.from(visors.values()).map(v => {
                const color = getNodeColor(v);
                const status = getVisorStatus(v.id);
                const svcInfo = visorServices[v.id];
                const version = visorVersions[v.id] || '';
                let title = v.id + '\nConnections: ' + v.connections + '\nStatus: ' + status;
                if (version) {
                    title += '\nVersion: ' + version;
                }
                if (svcInfo && svcInfo.services.length > 0) {
                    title += '\nServices: ' + svcInfo.services.join(', ');
                }
                if (svcInfo && svcInfo.country) {
                    title += '\nCountry: ' + svcInfo.country;
                }

                return {
                    id: v.id,
                    label: v.id.substring(0, 8),
                    title: title,
                    size: 5 + (v.connections / maxConn) * 25,
                    color: { background: color.background, border: color.border, highlight: { background: '#e94560', border: '#ff6b6b' } },
                    connections: v.connections,
                    status: status,
                    borderWidth: status === 'offline' ? 3 : 2
                };
            });

            const edges = allData.map((transport, idx) => ({
                id: idx, from: transport.edges[0], to: transport.edges[1],
                color: { color: colors[transport.type], opacity: 0.6 }, type: transport.type, width: 1, smooth: { type: 'continuous' }
            }));

            nodesDataset = new vis.DataSet(nodes);
            edgesDataset = new vis.DataSet(edges);
            createNetwork();
            document.getElementById('loading').style.display = 'none';
        }

        function createNetwork() {
            const container = document.getElementById('network');
            const data = { nodes: nodesDataset, edges: edgesDataset };
            const options = {
                nodes: { shape: 'dot', font: { size: 10, color: '#aaa' }, borderWidth: 2 },
                edges: { smooth: { type: 'continuous', roundness: 0.5 } },
                physics: { stabilization: { iterations: 100, fit: true }, barnesHut: { gravitationalConstant: -3000, springConstant: 0.001, springLength: 200 } },
                interaction: { hover: true, tooltipDelay: 100 }
            };
            network = new vis.Network(container, data, options);
            network.on('click', params => { if (params.nodes.length > 0) showNodeInfo(params.nodes[0]); else hideNodeInfo(); });
            network.on('stabilizationIterationsDone', () => network.fit());
        }

        function showNodeInfo(nodeId) {
            const info = document.getElementById('selected-info');
            const connections = visorConnections[nodeId] || [];
            const status = getVisorStatus(nodeId);
            const svcInfo = visorServices[nodeId];
            const version = visorVersions[nodeId];

            document.getElementById('selected-pk').textContent = nodeId;
            document.getElementById('selected-conn-count').textContent = connections.length;

            // Status display
            const statusEl = document.getElementById('selected-status');
            statusEl.innerHTML = '<span class="status-dot status-' + status + '" style="display:inline-block;vertical-align:middle;margin-right:5px;"></span>' + status.charAt(0).toUpperCase() + status.slice(1);

            // Version display
            const versionEl = document.getElementById('selected-version');
            if (version) {
                versionEl.textContent = 'Version: ' + version;
                versionEl.style.display = 'block';
            } else {
                versionEl.style.display = 'none';
            }

            // Country display
            const countryEl = document.getElementById('selected-country');
            if (svcInfo && svcInfo.country) {
                countryEl.textContent = 'Country: ' + svcInfo.country;
                countryEl.style.display = 'block';
            } else {
                countryEl.style.display = 'none';
            }

            // Services display
            const servicesEl = document.getElementById('selected-services');
            if (svcInfo && svcInfo.services.length > 0) {
                servicesEl.innerHTML = svcInfo.services.map(s => '<span class="service-badge ' + s + '">' + s.toUpperCase() + '</span>').join('');
                servicesEl.style.display = 'block';
            } else {
                servicesEl.style.display = 'none';
            }

            document.getElementById('conn-list').innerHTML = connections.sort((a, b) => a.type.localeCompare(b.type))
                .map(c => {
                    const cStatus = getVisorStatus(c.pk);
                    const cVersion = visorVersions[c.pk];
                    let versionTag = cVersion ? ' <span style="color:#0f9b8e;font-size:0.8em;">' + cVersion + '</span>' : '';
                    return '<div class="conn-item"><span class="conn-type ' + c.type + '">' + c.type.toUpperCase() + '</span><span class="status-dot status-' + cStatus + '" style="display:inline-block;width:8px;height:8px;margin-right:5px;"></span>' + c.pk.substring(0, 16) + '...' + versionTag + '</div>';
                }).join('');

            info.classList.add('visible');
        }

        function hideNodeInfo() { document.getElementById('selected-info').classList.remove('visible'); }

        function applyFilters() {
            const showStcpr = document.getElementById('show-stcpr').checked;
            const showSudph = document.getElementById('show-sudph').checked;
            const showDmsg = document.getElementById('show-dmsg').checked;
            const showOnline = document.getElementById('show-online').checked;
            const showOffline = document.getElementById('show-offline').checked;
            const showUnknown = document.getElementById('show-unknown').checked;
            const showServices = document.getElementById('show-services').checked;
            const searchTerm = document.getElementById('search').value.toLowerCase();

            // Batch node updates
            const nodeUpdates = [];
            const hiddenNodes = new Set();
            nodesDataset.forEach(node => {
                const status = getVisorStatus(node.id);
                let visible = true;

                if (status === 'online' && !showOnline) visible = false;
                if (status === 'offline' && !showOffline) visible = false;
                if (status === 'unknown' && !showUnknown) visible = false;

                if (!visible) hiddenNodes.add(node.id);

                const color = getNodeColor({ id: node.id, connections: node.connections });
                nodeUpdates.push({ id: node.id, hidden: !visible, color: { background: color.background, border: color.border, highlight: { background: '#e94560', border: '#ff6b6b' } } });
            });
            nodesDataset.update(nodeUpdates);

            // Batch edge updates
            const edgeUpdates = [];
            edgesDataset.forEach(edge => {
                let visible = true;
                if (edge.type === 'stcpr' && !showStcpr) visible = false;
                if (edge.type === 'sudph' && !showSudph) visible = false;
                if (edge.type === 'dmsg' && !showDmsg) visible = false;

                // Also hide edge if either connected node is hidden
                if (hiddenNodes.has(edge.from) || hiddenNodes.has(edge.to)) {
                    visible = false;
                }

                edgeUpdates.push({ id: edge.id, hidden: !visible });
            });
            edgesDataset.update(edgeUpdates);

            // Search highlighting
            if (searchTerm.length >= 4) {
                let foundNode = null;
                nodesDataset.forEach(node => {
                    if (node.id.toLowerCase().startsWith(searchTerm)) {
                        foundNode = node.id;
                    }
                });
                if (foundNode) {
                    nodesDataset.update({ id: foundNode, color: { background: '#e94560', border: '#ff6b6b' } });
                    network.focus(foundNode, { scale: 1.5, animation: true });
                    showNodeInfo(foundNode);
                }
            }
        }

        // Check if running from Go server and show cache info
        async function checkServer() {
            try {
                const resp = await fetch('/health');
                if (resp.ok) {
                    const info = await resp.json();
                    let cacheInfo = 'Cache max age: ' + info.cache_age + ' min';
                    if (info.auto_refresh) {
                        cacheInfo += '<br>Auto-refresh: enabled';
                    }
                    document.getElementById('cache-info').innerHTML = cacheInfo;
                }
            } catch (e) {
                document.getElementById('cache-info').innerHTML = 'Direct mode (no local caching)';
            }
        }

        document.getElementById('show-stcpr').addEventListener('change', applyFilters);
        document.getElementById('show-sudph').addEventListener('change', applyFilters);
        document.getElementById('show-dmsg').addEventListener('change', applyFilters);
        document.getElementById('show-online').addEventListener('change', applyFilters);
        document.getElementById('show-offline').addEventListener('change', applyFilters);
        document.getElementById('show-unknown').addEventListener('change', applyFilters);
        document.getElementById('show-services').addEventListener('change', applyFilters);
        document.getElementById('search').addEventListener('input', applyFilters);
        document.getElementById('btn-fit').addEventListener('click', () => network && network.fit());

        // Auto-refresh every 5 minutes
        setInterval(fetchAllData, 5 * 60 * 1000);

        checkServer();
        fetchAllData();
    </script>
</body>
</html>
