syntax = "proto3";

package rpcgrpc;

option go_package = "github.com/skycoin/skywire/pkg/visor/rpcgrpc";

// PingService provides streaming ping functionality
service PingService {
  // StreamPing performs multiple pings and streams results back one at a time
  rpc StreamPing(PingRequest) returns (stream PingResult);

  // StreamDmsgPing performs multiple pings over dmsg and streams results
  rpc StreamDmsgPing(PingRequest) returns (stream PingResult);

  // StreamBandwidthTest performs a bandwidth test and streams progress
  rpc StreamBandwidthTest(BandwidthRequest) returns (stream BandwidthProgress);

  // StreamDmsgBandwidthTest performs a bandwidth test over dmsg and streams progress
  rpc StreamDmsgBandwidthTest(BandwidthRequest) returns (stream BandwidthProgress);

  // GetRemoteDmsgServers returns the DMSG servers a remote visor is connected to
  rpc GetRemoteDmsgServers(DmsgServersRequest) returns (DmsgServersResponse);

  // StreamSystemStats streams system stats (CPU, memory, disk, network, etc.) for gotop-style monitoring
  rpc StreamSystemStats(SystemStatsRequest) returns (stream SystemStats);

  // GetSystemStats returns a single snapshot of system stats
  rpc GetSystemStats(SystemStatsRequest) returns (SystemStats);

  // StreamRemoteSystemStats proxies system stats from a remote visor via DMSG
  // The local visor dials the remote visor over DMSG and forwards the stats stream
  rpc StreamRemoteSystemStats(RemoteSystemStatsRequest) returns (stream SystemStats);

  // StreamAppLogs streams visor log entries scoped to one app's session.
  // Used by 'skywire-cli proxy start --verbose' to surface what the visor is
  // doing while spinning up an app's transports/routes.
  rpc StreamAppLogs(AppLogStreamRequest) returns (stream AppLogEntry);

  // StreamCalcRoutes runs a route-finder BFS server-side and streams each
  // valid route back as it's discovered. Lets the CLI display routes
  // incrementally and avoids accumulating every result in memory before
  // returning — important when count is large or unbounded.
  rpc StreamCalcRoutes(CalcRoutesRequest) returns (stream CalcRoute);
}

message PingRequest {
  string public_key = 1;    // Target visor public key
  int32 tries = 2;          // Number of ping attempts
  int32 packet_size_kb = 3; // Packet size in KB
  bool local_route = 4;     // Use local route calculation
  int64 ping_timeout_ns = 5; // Timeout for ping phase only (after route setup), 0 = no timeout
  int64 setup_timeout_ns = 6; // Timeout for route setup phase, 0 = no timeout (default 30s recommended)
  string dmsg_server_pk = 7;  // Optional: specific DMSG server to use for DMSG pings
  string transport_id = 8;    // Optional: use specific transport (skips route calculation)
  repeated RouteHop forward_hops = 9;  // Optional: explicit forward route (skips route calculation)
  repeated RouteHop reverse_hops = 10; // Optional: explicit reverse route (skips route calculation)
}

message PingResult {
  int32 sequence = 1;       // Ping sequence number (1-indexed)
  int64 latency_ns = 2;     // Round-trip time in nanoseconds
  string error = 3;         // Error message if ping failed
  bool is_setup = 4;        // True if this is the route setup time, not a ping
  repeated string route_hops = 5; // Route hops (public keys), only set for setup message (deprecated)
  repeated RouteHop route_hop_details = 6; // Detailed route hops with transport info
  string dmsg_server_pk = 7;  // For DMSG pings: the server PK used for this connection
  int64 route_calc_time_ns = 8; // Route calculation time in nanoseconds (local route mode only)
}

message DmsgServersRequest {
  string public_key = 1;    // Remote visor public key to look up
}

message DmsgServersResponse {
  repeated string server_pks = 1; // List of DMSG server public keys
}

message RouteHop {
  string tp_id = 1;    // Transport ID (UUID)
  string from = 2;     // Source public key
  string to = 3;       // Destination public key
  string tp_type = 4;  // Transport type (stcpr, sudph, dmsg)
}

message BandwidthRequest {
  string public_key = 1;     // Target visor public key
  int64 duration_ns = 2;     // Duration to run the test in nanoseconds
  int32 packet_size_kb = 3;  // Packet size in KB (default 32)
  bool local_route = 4;      // Use local route calculation (for skywire route)
}

message BandwidthProgress {
  uint64 bytes_sent = 1;       // Cumulative bytes sent
  uint64 bytes_received = 2;   // Cumulative bytes received
  int64 elapsed_ns = 3;        // Elapsed time in nanoseconds
  double upload_speed = 4;     // Current upload speed in KB/s
  double download_speed = 5;   // Current download speed in KB/s
  bool is_final = 6;           // True if this is the final result
  string error = 7;            // Error message if test failed
}

// SystemStatsRequest configures system stats streaming
message SystemStatsRequest {
  int64 update_interval_ns = 1;  // Update interval in nanoseconds (default 1s)
  bool include_processes = 2;    // Include top processes (more expensive)
  int32 process_limit = 3;       // Max processes to include (default 10)
}

// RemoteSystemStatsRequest requests system stats from a remote visor via DMSG
message RemoteSystemStatsRequest {
  string remote_pk = 1;              // Public key of remote visor to connect to
  int64 update_interval_ns = 2;      // Update interval in nanoseconds (default 1s)
  bool include_processes = 3;        // Include top processes (more expensive)
  int32 process_limit = 4;           // Max processes to include (default 10)
}

// SystemStats contains system monitoring data for gotop-style display
message SystemStats {
  int64 timestamp_ns = 1;           // Unix timestamp in nanoseconds
  HostInfo host = 2;                // Host information
  repeated CpuStat cpu = 3;         // CPU usage per core
  double cpu_average = 4;           // Average CPU usage across all cores
  MemoryStat memory = 5;            // Memory usage
  MemoryStat swap = 6;              // Swap usage
  repeated DiskStat disks = 7;      // Disk usage per partition
  NetworkStat network = 8;          // Network I/O
  repeated TempStat temps = 9;      // Temperature sensors
  repeated ProcessStat processes = 10; // Top processes
  string error = 11;                // Error message if collection failed
}

// HostInfo contains basic host information
message HostInfo {
  string hostname = 1;
  int64 uptime_sec = 2;         // System uptime in seconds
  string os = 3;                // Operating system name
  string platform = 4;          // Platform (e.g., ubuntu, centos)
  string platform_version = 5;  // Platform version
  string kernel_version = 6;    // Kernel version
  string kernel_arch = 7;       // Kernel architecture
  int32 num_cpus = 8;           // Number of logical CPUs
}

// CpuStat contains CPU usage for a single core
message CpuStat {
  string cpu = 1;         // CPU identifier (cpu0, cpu1, etc. or cpu-total)
  double usage_percent = 2; // Usage percentage (0-100)
}

// MemoryStat contains memory usage information
message MemoryStat {
  uint64 total = 1;         // Total memory in bytes
  uint64 used = 2;          // Used memory in bytes
  uint64 available = 3;     // Available memory in bytes
  double used_percent = 4;  // Usage percentage (0-100)
}

// DiskStat contains disk usage for a partition
message DiskStat {
  string device = 1;        // Device name
  string mountpoint = 2;    // Mount point
  string fstype = 3;        // Filesystem type
  uint64 total = 4;         // Total space in bytes
  uint64 used = 5;          // Used space in bytes
  uint64 free = 6;          // Free space in bytes
  double used_percent = 7;  // Usage percentage (0-100)
}

// NetworkStat contains network I/O information
message NetworkStat {
  uint64 bytes_sent = 1;        // Total bytes sent
  uint64 bytes_recv = 2;        // Total bytes received
  uint64 packets_sent = 3;      // Total packets sent
  uint64 packets_recv = 4;      // Total packets received
  double bytes_sent_rate = 5;   // Bytes sent per second (since last update)
  double bytes_recv_rate = 6;   // Bytes received per second (since last update)
}

// TempStat contains temperature sensor information
message TempStat {
  string sensor_key = 1;      // Sensor identifier
  double temperature = 2;     // Temperature in Celsius
  double high = 3;            // High threshold (if available)
  double critical = 4;        // Critical threshold (if available)
}

// AppLogStreamRequest configures app-scoped log streaming.
message AppLogStreamRequest {
  // AppName scopes the stream to entries originating from this app's
  // module or carrying app=<name> as a logrus field. Either AppName
  // or Modules (or both) must be set.
  string app_name = 1;
  // IncludeRouter is retained on the wire for forward compatibility
  // but is ignored — the app_name field tagging now covers what it
  // used to do, and Modules below is the explicit path for non-app
  // scoping (e.g. 'cli dmsg curl --verbose' picking up dmsg layers).
  bool include_router = 2;
  // MinLevel filters out lower-severity entries: trace|debug|info|warn|error.
  // Default debug.
  string min_level = 3;
  // Modules filters by _module prefix, OR-merged with the AppName
  // match. Use this when no app context exists — e.g. 'dmsg curl
  // --verbose' sends ["dmsgC","dmsghttp","dmsg_grpc"]. Empty means
  // "no module-prefix match"; AppName is then the only path.
  repeated string modules = 4;
}

// AppLogEntry is one log line forwarded to the gRPC client.
message AppLogEntry {
  int64 timestamp_ns = 1;        // entry time as Unix nanoseconds
  string level = 2;              // "trace"|"debug"|"info"|"warn"|"error"|"fatal"|"panic"
  string module = 3;             // _module field (e.g. "router", "skysocks-client")
  string message = 4;            // formatted message text
  map<string, string> fields = 5; // remaining structured fields
  // Subscribed is set on a sentinel entry the server sends
  // immediately after it has registered the subscription with the
  // broadcaster. Clients use this to know that any subsequent log
  // activity will reach them — letting them gate downstream RPC
  // calls (e.g. StartAppWithMode) on subscription readiness so the
  // first ~50ms of setup logs aren't lost to the race between
  // subscription handshake and the action that triggers them.
  // The other fields are unused on the sentinel.
  bool subscribed = 6;
}

// CalcRoutesRequest configures server-side route calculation streaming.
message CalcRoutesRequest {
  // SrcPk is the source visor public key. Empty means use the receiving
  // visor's own PK (the common case — calc routes from this visor).
  string src_pk = 1;
  // DstPk is the destination visor public key. Required.
  string dst_pk = 2;
  // MinHops is the minimum hop count. 0 falls back to the visor's
  // routing.min_hops, then 1.
  int32 min_hops = 3;
  // MaxHops is the maximum hop count. 0 falls back to a safe default.
  int32 max_hops = 4;
  // Count caps how many routes to return. 0 means unbounded (the BFS
  // runs until the search space is exhausted; the streaming wire
  // protocol means the caller can still dump them as they arrive
  // without buffering the whole set).
  int32 count = 5;
  // Source selects the transport-graph data source. "tpd" (HTTP),
  // "dht" (visor's local DHT store), or "auto" (DHT then TPD fallback).
  string source = 6;
  // TpdUrl optionally overrides the default transport-discovery URL.
  string tpd_url = 7;
  // QueueCap caps the per-call BFS queue size on the server. 0 falls
  // back to the route-finder package's DefaultMaxBFSQueue. Negative
  // means unbounded (use with caution on dense graphs).
  int32 queue_cap = 8;
}

// CalcRoute is one path the BFS found. Hops are listed in forward order
// from src to dst; the caller can derive the reverse by mirroring.
message CalcRoute {
  repeated CalcHop hops = 1;
}

// CalcHop is one edge in a route.
message CalcHop {
  string tp_id = 1;
  string from = 2;
  string to = 3;
}

// ProcessStat contains information about a running process
message ProcessStat {
  int32 pid = 1;              // Process ID
  string name = 2;            // Process name
  double cpu_percent = 3;     // CPU usage percentage
  double memory_percent = 4;  // Memory usage percentage
  uint64 memory_rss = 5;      // Resident set size in bytes
  string username = 6;        // Username running the process
  string status = 7;          // Process status (running, sleeping, etc.)
}
