syntax = "proto3";

package rpcgrpc;

option go_package = "github.com/skycoin/skywire/pkg/visor/rpcgrpc";

// PingService provides streaming ping functionality
service PingService {
  // StreamPing performs multiple pings and streams results back one at a time
  rpc StreamPing(PingRequest) returns (stream PingResult);

  // StreamDmsgPing performs multiple pings over dmsg and streams results
  rpc StreamDmsgPing(PingRequest) returns (stream PingResult);

  // StreamBandwidthTest performs a bandwidth test and streams progress
  rpc StreamBandwidthTest(BandwidthRequest) returns (stream BandwidthProgress);

  // StreamDmsgBandwidthTest performs a bandwidth test over dmsg and streams progress
  rpc StreamDmsgBandwidthTest(BandwidthRequest) returns (stream BandwidthProgress);

  // GetRemoteDmsgServers returns the DMSG servers a remote visor is connected to
  rpc GetRemoteDmsgServers(DmsgServersRequest) returns (DmsgServersResponse);

  // StreamSystemStats streams system stats (CPU, memory, disk, network, etc.) for gotop-style monitoring
  rpc StreamSystemStats(SystemStatsRequest) returns (stream SystemStats);

  // GetSystemStats returns a single snapshot of system stats
  rpc GetSystemStats(SystemStatsRequest) returns (SystemStats);

  // StreamRemoteSystemStats proxies system stats from a remote visor via DMSG
  // The local visor dials the remote visor over DMSG and forwards the stats stream
  rpc StreamRemoteSystemStats(RemoteSystemStatsRequest) returns (stream SystemStats);

  // StreamAppLogs streams visor log entries scoped to one app's session.
  // Used by 'skywire-cli proxy start --verbose' to surface what the visor is
  // doing while spinning up an app's transports/routes.
  rpc StreamAppLogs(AppLogStreamRequest) returns (stream AppLogEntry);

  // StreamCalcRoutes runs a route-finder BFS server-side and streams each
  // valid route back as it's discovered. Lets the CLI display routes
  // incrementally and avoids accumulating every result in memory before
  // returning — important when count is large or unbounded.
  rpc StreamCalcRoutes(CalcRoutesRequest) returns (stream CalcRoute);

  // StreamGroupMessages opens a long-lived stream of inbound group
  // messages. The server holds a per-stream subscription to the
  // visor's group inbox and pushes each delivered message to the
  // client as it arrives. Replaces the net/rpc poll loop in
  // 'cli skychat group listen', which would lose its underlying
  // connection every 5 minutes to the per-conn deadline applied at
  // init_apps.go for unary-RPC hang detection. Stream lifetime is
  // the listen lifetime, no arbitrary ceiling.
  rpc StreamGroupMessages(GroupMessagesRequest) returns (stream GroupMessageEvent);

  // StreamPingTree walks the visor's neighborhood breadth-first and
  // streams discovery + ping events as they happen. Replaces the
  // client-side BFS in 'cli visor ping tree' — server-side has
  // direct access to TransportSummary.LatencyMS (the smoothed per-
  // transport RTT measured continuously by the transport layer),
  // the route-finder, and the local tpM, so it can:
  //   - Skip live pings at level 1 when the transport already has a
  //     warmed latency cache (use_transport_latency flag);
  //   - Walk tpM.WalkTransports directly without the snapshot
  //     allocation cost that the unary Transports() RPC imposes
  //     on visors with hundreds of transports;
  //   - Observe cancellation at every BFS iteration so a client
  //     disconnect tears down the walk within one in-flight ping.
  //
  // Result events arrive in chunk-complete-by-completion order, NOT
  // deterministically grouped per peer — consumers that want
  // (level, parent_pk, remote_pk) grouping must sort/bucket on
  // receive. Server-side per-level concurrency means events for
  // level N+1 never appear before level N's LevelDone.
  //
  // Authorization: the handler gates on the same whitelist used by
  // dmsgscp (hypervisors + own PK + Dmsgpty.Whitelist). On a public
  // visor with hundreds of transports, an unauthenticated caller
  // could trigger a many-target ping storm; the gate prevents that.
  rpc StreamPingTree(PingTreeRequest) returns (stream PingTreeEvent);

  // StreamMuxBandwidth measures bandwidth + queueing-delay between
  // this visor and a target peer, optionally across N parallel
  // routes. The operator-visible hypothesis: routes that EXCLUDE the
  // direct transport (via min_hops >= 2) should sum to MORE bandwidth
  // than the direct edge alone, because intermediates aggregate
  // independent paths. This RPC produces the data to test that.
  //
  // Three flavors via the request fields:
  //   - routes=1, min_hops=0: baseline — whatever route the finder
  //     picks. With a healthy direct transport this measures the
  //     direct edge.
  //   - routes=1, min_hops=2: single non-direct path — forces the
  //     route through at least one intermediate.
  //   - routes=N, min_hops=>=0: N parallel routes pumping bytes
  //     concurrently. Aggregate throughput is the operator's headline
  //     comparison metric.
  //
  // Optionally a separate small-packet probe runs alongside the bulk
  // load to capture queueing-delay: loaded RTT vs unloaded RTT
  // baseline. The probe rides the SAME first route as the bulk pump,
  // so the queueing-delay number reflects that route's saturation.
  //
  // Wire shape mirrors StreamPingTree: server-side BFS becomes
  // server-side bandwidth-pump, events stream as they happen,
  // ctx.Done() at every iteration, bounded internal channel.
  rpc StreamMuxBandwidth(MuxBandwidthRequest) returns (stream MuxBandwidthEvent);
}

message PingRequest {
  string public_key = 1;    // Target visor public key
  int32 tries = 2;          // Number of ping attempts
  int32 packet_size_kb = 3; // Packet size in KB
  bool local_route = 4;     // Use local route calculation
  int64 ping_timeout_ns = 5; // Timeout for ping phase only (after route setup), 0 = no timeout
  int64 setup_timeout_ns = 6; // Timeout for route setup phase, 0 = no timeout (default 30s recommended)
  string dmsg_server_pk = 7;  // Optional: specific DMSG server to use for DMSG pings
  string transport_id = 8;    // Optional: use specific transport (skips route calculation)
  repeated RouteHop forward_hops = 9;  // Optional: explicit forward route (skips route calculation)
  repeated RouteHop reverse_hops = 10; // Optional: explicit reverse route (skips route calculation)
}

message PingResult {
  int32 sequence = 1;       // Ping sequence number (1-indexed)
  int64 latency_ns = 2;     // Round-trip time in nanoseconds
  string error = 3;         // Error message if ping failed
  bool is_setup = 4;        // True if this is the route setup time, not a ping
  repeated string route_hops = 5; // Route hops (public keys), only set for setup message (deprecated)
  repeated RouteHop route_hop_details = 6; // Detailed route hops with transport info
  string dmsg_server_pk = 7;  // For DMSG pings: the server PK used for this connection
  int64 route_calc_time_ns = 8; // Route calculation time in nanoseconds (local route mode only)
}

message DmsgServersRequest {
  string public_key = 1;    // Remote visor public key to look up
}

message DmsgServersResponse {
  repeated string server_pks = 1; // List of DMSG server public keys
}

message RouteHop {
  string tp_id = 1;    // Transport ID (UUID)
  string from = 2;     // Source public key
  string to = 3;       // Destination public key
  string tp_type = 4;  // Transport type (stcpr, sudph, dmsg)
}

message BandwidthRequest {
  string public_key = 1;     // Target visor public key
  int64 duration_ns = 2;     // Duration to run the test in nanoseconds
  int32 packet_size_kb = 3;  // Packet size in KB (default 32)
  bool local_route = 4;      // Use local route calculation (for skywire route)
}

message BandwidthProgress {
  uint64 bytes_sent = 1;       // Cumulative bytes sent
  uint64 bytes_received = 2;   // Cumulative bytes received
  int64 elapsed_ns = 3;        // Elapsed time in nanoseconds
  double upload_speed = 4;     // Current upload speed in KB/s
  double download_speed = 5;   // Current download speed in KB/s
  bool is_final = 6;           // True if this is the final result
  string error = 7;            // Error message if test failed
}

// SystemStatsRequest configures system stats streaming
message SystemStatsRequest {
  int64 update_interval_ns = 1;  // Update interval in nanoseconds (default 1s)
  bool include_processes = 2;    // Include top processes (more expensive)
  int32 process_limit = 3;       // Max processes to include (default 10)
}

// RemoteSystemStatsRequest requests system stats from a remote visor via DMSG
message RemoteSystemStatsRequest {
  string remote_pk = 1;              // Public key of remote visor to connect to
  int64 update_interval_ns = 2;      // Update interval in nanoseconds (default 1s)
  bool include_processes = 3;        // Include top processes (more expensive)
  int32 process_limit = 4;           // Max processes to include (default 10)
}

// SystemStats contains system monitoring data for gotop-style display
message SystemStats {
  int64 timestamp_ns = 1;           // Unix timestamp in nanoseconds
  HostInfo host = 2;                // Host information
  repeated CpuStat cpu = 3;         // CPU usage per core
  double cpu_average = 4;           // Average CPU usage across all cores
  MemoryStat memory = 5;            // Memory usage
  MemoryStat swap = 6;              // Swap usage
  repeated DiskStat disks = 7;      // Disk usage per partition
  NetworkStat network = 8;          // Network I/O
  repeated TempStat temps = 9;      // Temperature sensors
  repeated ProcessStat processes = 10; // Top processes
  string error = 11;                // Error message if collection failed
}

// HostInfo contains basic host information
message HostInfo {
  string hostname = 1;
  int64 uptime_sec = 2;         // System uptime in seconds
  string os = 3;                // Operating system name
  string platform = 4;          // Platform (e.g., ubuntu, centos)
  string platform_version = 5;  // Platform version
  string kernel_version = 6;    // Kernel version
  string kernel_arch = 7;       // Kernel architecture
  int32 num_cpus = 8;           // Number of logical CPUs
}

// CpuStat contains CPU usage for a single core
message CpuStat {
  string cpu = 1;         // CPU identifier (cpu0, cpu1, etc. or cpu-total)
  double usage_percent = 2; // Usage percentage (0-100)
}

// MemoryStat contains memory usage information
message MemoryStat {
  uint64 total = 1;         // Total memory in bytes
  uint64 used = 2;          // Used memory in bytes
  uint64 available = 3;     // Available memory in bytes
  double used_percent = 4;  // Usage percentage (0-100)
}

// DiskStat contains disk usage for a partition
message DiskStat {
  string device = 1;        // Device name
  string mountpoint = 2;    // Mount point
  string fstype = 3;        // Filesystem type
  uint64 total = 4;         // Total space in bytes
  uint64 used = 5;          // Used space in bytes
  uint64 free = 6;          // Free space in bytes
  double used_percent = 7;  // Usage percentage (0-100)
}

// NetworkStat contains network I/O information
message NetworkStat {
  uint64 bytes_sent = 1;        // Total bytes sent
  uint64 bytes_recv = 2;        // Total bytes received
  uint64 packets_sent = 3;      // Total packets sent
  uint64 packets_recv = 4;      // Total packets received
  double bytes_sent_rate = 5;   // Bytes sent per second (since last update)
  double bytes_recv_rate = 6;   // Bytes received per second (since last update)
}

// TempStat contains temperature sensor information
message TempStat {
  string sensor_key = 1;      // Sensor identifier
  double temperature = 2;     // Temperature in Celsius
  double high = 3;            // High threshold (if available)
  double critical = 4;        // Critical threshold (if available)
}

// AppLogStreamRequest configures app-scoped log streaming.
message AppLogStreamRequest {
  // AppName scopes the stream to entries originating from this app's
  // module or carrying app=<name> as a logrus field. Either AppName
  // or Modules (or both) must be set.
  string app_name = 1;
  // IncludeRouter is retained on the wire for forward compatibility
  // but is ignored — the app_name field tagging now covers what it
  // used to do, and Modules below is the explicit path for non-app
  // scoping (e.g. 'cli dmsg curl --verbose' picking up dmsg layers).
  bool include_router = 2;
  // MinLevel filters out lower-severity entries: trace|debug|info|warn|error.
  // Default debug.
  string min_level = 3;
  // Modules filters by _module prefix, OR-merged with the AppName
  // match. Use this when no app context exists — e.g. 'dmsg curl
  // --verbose' sends ["dmsgC","dmsghttp","dmsg_grpc"]. Empty means
  // "no module-prefix match"; AppName is then the only path.
  repeated string modules = 4;
}

// AppLogEntry is one log line forwarded to the gRPC client.
message AppLogEntry {
  int64 timestamp_ns = 1;        // entry time as Unix nanoseconds
  string level = 2;              // "trace"|"debug"|"info"|"warn"|"error"|"fatal"|"panic"
  string module = 3;             // _module field (e.g. "router", "skysocks-client")
  string message = 4;            // formatted message text
  map<string, string> fields = 5; // remaining structured fields
  // Subscribed is set on a sentinel entry the server sends
  // immediately after it has registered the subscription with the
  // broadcaster. Clients use this to know that any subsequent log
  // activity will reach them — letting them gate downstream RPC
  // calls (e.g. StartAppWithMode) on subscription readiness so the
  // first ~50ms of setup logs aren't lost to the race between
  // subscription handshake and the action that triggers them.
  // The other fields are unused on the sentinel.
  bool subscribed = 6;
}

// CalcRoutesRequest configures server-side route calculation streaming.
message CalcRoutesRequest {
  // SrcPk is the source visor public key. Empty means use the receiving
  // visor's own PK (the common case — calc routes from this visor).
  string src_pk = 1;
  // DstPk is the destination visor public key. Required.
  string dst_pk = 2;
  // MinHops is the minimum hop count. 0 falls back to the visor's
  // routing.min_hops, then 1.
  int32 min_hops = 3;
  // MaxHops is the maximum hop count. 0 falls back to a safe default.
  int32 max_hops = 4;
  // Count caps how many routes to return. 0 means unbounded (the BFS
  // runs until the search space is exhausted; the streaming wire
  // protocol means the caller can still dump them as they arrive
  // without buffering the whole set).
  int32 count = 5;
  // Source selects the transport-graph data source. "tpd" (HTTP),
  // "dht" (visor's local DHT store), or "auto" (DHT then TPD fallback).
  string source = 6;
  // TpdUrl optionally overrides the default transport-discovery URL.
  string tpd_url = 7;
  // QueueCap caps the per-call BFS queue size on the server. 0 falls
  // back to the route-finder package's DefaultMaxBFSQueue. Negative
  // means unbounded (use with caution on dense graphs).
  int32 queue_cap = 8;
}

// CalcRoute is one path the BFS found. Hops are listed in forward order
// from src to dst; the caller can derive the reverse by mirroring.
message CalcRoute {
  repeated CalcHop hops = 1;
}

// CalcHop is one edge in a route.
message CalcHop {
  string tp_id = 1;
  string from = 2;
  string to = 3;
}

// GroupMessagesRequest configures a group-message stream subscription.
message GroupMessagesRequest {
  // GroupId filters to one group. Empty subscribes to every group
  // the visor is currently in (the default 'cli skychat group listen'
  // behavior).
  string group_id = 1;
  // SinceTimestampNs replays buffered messages with TS strictly
  // greater than this value before live deliveries start. Zero
  // means "live only" — drains nothing from history. Mirrors the
  // 'since' arg the previous GroupPoll RPC accepted.
  int64 since_timestamp_ns = 2;
}

// GroupMessageEvent is one inbound group message delivered to the
// stream. Mirrors visor.GroupMessage one-for-one.
message GroupMessageEvent {
  // TimestampNs is the message Unix-nanos timestamp from the sender.
  int64 timestamp_ns = 1;
  // GroupId is the group the message arrived on.
  string group_id = 2;
  // SenderPk is the publishing member's hex public key.
  string sender_pk = 3;
  // Body is the message text (may contain embedded newlines —
  // callers that need one-line-per-event should escape on display).
  string body = 4;
  // Subscribed is set on a sentinel sent immediately after the
  // server registers the subscription. Lets clients gate downstream
  // RPCs on subscription liveness — same pattern AppLogEntry uses.
  bool subscribed = 5;
}

// ProcessStat contains information about a running process
message ProcessStat {
  int32 pid = 1;              // Process ID
  string name = 2;            // Process name
  double cpu_percent = 3;     // CPU usage percentage
  double memory_percent = 4;  // Memory usage percentage
  uint64 memory_rss = 5;      // Resident set size in bytes
  string username = 6;        // Username running the process
  string status = 7;          // Process status (running, sleeping, etc.)
}

// PingTreeRequest configures a server-side BFS ping-tree walk.
// All durations are in nanoseconds (proto convention used throughout
// this service). All "0 = default" fields fall back to handler-side
// constants documented inline.
message PingTreeRequest {
  // MaxLevel caps BFS depth. 0 = unlimited until expansion exhausts.
  int32 max_level = 1;
  // Hops, when > 0, pings ONLY entries at exactly N hops. The BFS
  // still discovers intermediate levels (so it can reach the target),
  // but no PingResult fires for non-target levels. Synth's "latency
  // as a function of hop count" measurement uses this.
  int32 hops = 2;
  // Tries is the per-transport ping count. The PingResult carries
  // the aggregated stats (avg, p50, p99, jitter) over all tries.
  // 0 falls back to 1.
  int32 tries = 3;
  // PacketSizeKb is the per-ping packet size. 0 falls back to 2 KB.
  int32 packet_size_kb = 4;
  // PingTimeoutNs bounds each individual ping (after route setup).
  // 0 falls back to 30s.
  int64 ping_timeout_ns = 5;
  // SetupTimeoutNs bounds the route-setup phase per transport.
  // 0 falls back to 30s.
  int64 setup_timeout_ns = 6;
  // Concurrency limits in-flight pings per level. The cap resets
  // between levels (level 2 starts with a fresh budget after level 1
  // drains) — predictable LevelDone semantics + bounded fan-out at
  // deep levels. 0 falls back to 16.
  int32 concurrency = 7;
  // OnlineOnly filters discovered visors via the uptime tracker.
  bool online_only = 8;
  // MinVersion filters by minimum visor version (semver). Empty = no
  // filter.
  string min_version = 9;
  // UseTransportLatency turns on the level-1 fast path: when a
  // direct transport already has a non-zero smoothed
  // TransportSummary.LatencyMS, the handler emits a PingResult with
  // latency_source="transport_summary" and skips the live ping.
  // Saves traffic + makes level 1 instant for warm transports.
  // Deeper levels always live-ping (no transport-level latency for
  // multi-hop routes).
  bool use_transport_latency = 10;
  // DmsgOnly forces the ping to ride the DMSG path instead of the
  // skywire router. Mirrors `cli visor ping --dmsg`.
  bool dmsg_only = 11;
  // DmsgPreCheck probes DMSG reachability before attempting a
  // route ping. Discards unreachable visors early.
  bool dmsg_pre_check = 12;
  // Retries adds N retry attempts on failed pings. 0 = no retry.
  int32 retries = 13;
  // DryRun runs the BFS discovery but emits no PingResult events;
  // useful for visualizing the reachable graph without traffic.
  bool dry_run = 14;
}

// PingTreeEvent is one entry on the stream. Exactly one oneof
// payload is set per message. Consumers switch on the payload type;
// the top-level timestamp_ns is server-side wall time at emit.
message PingTreeEvent {
  int64 timestamp_ns = 1;
  oneof payload {
    PingTreeDiscovered discovered = 10;
    PingTreeResult ping_result = 11;
    PingTreeLevelDone level_done = 12;
    PingTreeRunDone run_done = 13;
    PingTreeStatusUpdate status_update = 14;
    // ServerError is a terminal event: the handler is about to
    // close the stream because of an unrecoverable condition
    // (e.g. proto break, internal panic recovered). Clients should
    // treat receipt as equivalent to stream-EOF with a known cause.
    PingTreeServerError server_error = 15;
  }
}

// Discovered fires when the BFS adds a (transport, peer) pair to the
// candidate set at level N. Fires BEFORE the corresponding PingResult.
message PingTreeDiscovered {
  string tp_id = 1;
  string tp_type = 2;
  string remote_pk = 3;
  string parent_pk = 4;
  int32 level = 5;
}

// PingResult fires when a transport's ping (or the cache fast-path)
// completes. Both success and failure produce a PingResult; consumers
// switch on the failed bool. Latency stats are aggregated across the
// per-tries sample series.
message PingTreeResult {
  string tp_id = 1;
  string tp_type = 2;
  string remote_pk = 3;
  string parent_pk = 4;
  int32 level = 5;
  bool failed = 6;
  // Canceled distinguishes ctx-canceled-mid-flight from genuine
  // failure. Set when ctx.Err() != nil at the time the result was
  // finalized. Different operator action: retry vs investigate.
  bool canceled = 7;
  // SetupLatencyNs is the route-setup phase time. Excluded from the
  // ping_*_ns aggregations below — those are per-ping post-setup.
  int64 setup_latency_ns = 8;
  // SampleCount is the number of successful pings (out of Tries).
  // Zero when failed.
  int32 sample_count = 9;
  // PingAvgNs / PingP50Ns / PingP99Ns / JitterNs are aggregations
  // over the sample series. Jitter is the population stddev:
  // sqrt(sum((x - mean)^2) / N). Zero when sample_count < 2 (no
  // stddev defined for a single sample).
  int64 ping_avg_ns = 10;
  int64 ping_p50_ns = 11;
  int64 ping_p99_ns = 12;
  int64 jitter_ns = 13;
  // SetupErr / PingErr / CalcErr surface the most-recent error from
  // each phase. Multiple may be set when multiple phases failed.
  string setup_err = 14;
  string ping_err = 15;
  string calc_err = 16;
  // LatencySource carries the provenance of the latency stats:
  //   "live_ping"          — measured by an actual ping just now
  //   "transport_summary"  — pulled from TransportSummary.LatencyMS
  //                          (smoothed cache, level-1 fast path)
  //   "skipped"            — entry was --hops mismatch or --dry-run
  // Consumers use this to weight stale-cache values vs fresh probes.
  string latency_source = 17;
  // Route is the hop sequence used for this ping. Empty for the
  // transport_summary fast-path (no route was constructed).
  repeated RouteHop route = 18;
}

// LevelDone fires after every transport at level N has either
// completed its ping or been skipped. Always fires before the next
// level's Discovered events. Counts are authoritative for the harness.
message PingTreeLevelDone {
  int32 level = 1;
  // Attempted = sum of (succeeded + failed + skipped_cached + skipped_dry).
  int32 attempted = 2;
  int32 succeeded = 3;
  int32 failed = 4;
  // SkippedCached is the count of entries where the
  // use_transport_latency fast-path fired. Lets harnesses compute
  // cache hit rate.
  int32 skipped_cached = 5;
}

// RunDone is the terminal event before stream close. Fires exactly
// once per StreamPingTree call.
message PingTreeRunDone {
  int32 total_discovered = 1;
  int32 total_pinged = 2;
  int32 total_succeeded = 3;
  int32 total_failed = 4;
  int32 total_skipped_cached = 5;
  int64 wall_time_ns = 6;
  // PeakInFlight is the highest concurrent ping count observed
  // during the run. Useful for tuning concurrency.
  int32 peak_in_flight = 7;
  // TerminationReason is one of:
  //   "max_level"          — hit cfg.MaxLevel
  //   "no_neighbors"       — BFS exhausted before MaxLevel
  //   "hops_target"        — reached cfg.Hops target level
  //   "context_cancel"     — client disconnect / server shutdown
  //   "error"              — see ServerError preceding this event
  string termination_reason = 8;
}

// StatusUpdate is a low-priority informational event (e.g. "expanding
// level 3", "draining in-flight"). The handler MUST prefer dropping
// StatusUpdate over PingResult under backpressure — never trade
// measurement data for status text.
message PingTreeStatusUpdate {
  // Phase is one of: "discovering" | "pinging_level_N" | "finalizing".
  string phase = 1;
  // InFlight is the count of currently-active ping goroutines.
  int32 in_flight = 2;
  // Pending is the count of queued-but-not-started pings.
  int32 pending = 3;
  // Message is an optional human-readable hint (e.g. "waiting on 3
  // slow pings at level 2"). Empty for routine progress.
  string message = 4;
}

// ServerError signals an unrecoverable condition that's about to
// close the stream. Clients receive it as the last event before
// stream-EOF; preserves a known cause vs an opaque transport error.
message PingTreeServerError {
  // Code is a short stable identifier (e.g. "auth_denied",
  // "internal_panic", "tpm_unavailable"). Suitable for grep / metric
  // labeling.
  string code = 1;
  // Message carries operator-readable detail. Not stable across
  // versions.
  string message = 2;
}

// MuxBandwidthRequest configures a multiplexed-route bandwidth + RTT
// probe run against a single target peer. See StreamMuxBandwidth's
// docstring for the operator-visible hypothesis this serves.
//
// All durations are nanoseconds (proto convention used throughout
// this service). All "0 = default" fields fall back to handler-side
// constants documented inline.
message MuxBandwidthRequest {
  // TargetPk is the remote visor's public key. Required.
  string target_pk = 1;

  // Routes is the number of parallel route connections to open.
  // 1 = single route (the StreamBandwidthTest equivalent).
  // N > 1 = N concurrent routes pumping bytes, aggregate throughput
  // is the headline measurement. 0 falls back to 1.
  int32 routes = 2;

  // DurationNs caps the total wall-clock time spent pumping bytes.
  // 0 falls back to 30s.
  int64 duration_ns = 3;

  // PacketSizeKb sizes each write block. Larger amortizes write
  // overhead; smaller surfaces stalls faster. 0 falls back to 32 KB.
  int32 packet_size_kb = 4;

  // MinHops is the route-finder's minimum hop constraint. When > 1,
  // the route excludes any direct transport between the local visor
  // and TargetPk — forcing the bandwidth pump through intermediates.
  // This is the "mux excluding direct" cell of the operator's
  // hypothesis. 0 uses the visor's routing.min_hops config default
  // (usually 1).
  int32 min_hops = 5;

  // SetupTimeoutNs bounds each route's setup phase. 0 falls back to
  // 30s. Long setup times are common for multi-hop routes (see the
  // p95=9.5s level-1 setup numbers from the ping-tree measurement).
  int64 setup_timeout_ns = 6;

  // ProbeRtt toggles a separate small-packet RTT probe that runs
  // concurrently with the bulk pump. Pairs are emitted as
  // MuxRttProbe events. The probe rides the SAME first route as the
  // bulk pump, so the resulting RTT samples reflect that route's
  // saturation — the queueing-delay signal.
  bool probe_rtt = 7;

  // ProbeIntervalNs is how often the RTT probe fires. 0 falls back
  // to 100 ms. Faster = denser jitter signal; slower = less
  // contention with the bulk pump.
  int64 probe_interval_ns = 8;

  // SampleIntervalNs is how often a MuxBandwidthSample is emitted.
  // 0 falls back to 1s. Smaller surfaces transient throughput dips
  // (bufferbloat, queue spikes); larger reduces stream chatter.
  int64 sample_interval_ns = 9;

  // LocalRoute uses local route calculation (cached TPD data)
  // instead of querying the route-finder service. Mirrors
  // BandwidthRequest.LocalRoute.
  bool local_route = 10;
}

// MuxBandwidthEvent is one entry on the stream. Exactly one oneof
// payload is set per message.
message MuxBandwidthEvent {
  int64 timestamp_ns = 1;
  oneof payload {
    // RouteEstablished fires once per route (in any order) as the
    // setup phase completes. Carries the actual route hops chosen,
    // letting consumers verify min_hops was honored.
    MuxRouteEstablished route_established = 10;
    // Sample fires every sample_interval_ns with cumulative + instant
    // throughput numbers. Sent until pump duration elapses.
    MuxBandwidthSample sample = 11;
    // RttProbe fires every probe_interval_ns when ProbeRtt is set.
    // Standalone from the Sample event because probes are async.
    MuxRttProbe rtt_probe = 12;
    // Done is the terminal event before stream close. Carries the
    // aggregated totals + RTT distribution stats.
    MuxBandwidthDone done = 13;
    // Error signals an unrecoverable condition. Last event before
    // stream close; same shape semantics as PingTreeServerError.
    MuxBandwidthError error = 14;
  }
}

// MuxRouteEstablished records one route's setup outcome.
message MuxRouteEstablished {
  // RouteIndex is 0..Routes-1, assigned in setup-order.
  int32 route_index = 1;
  // SetupLatencyNs is the time spent on the route-setup phase
  // (route-finder query + setup-node negotiation + handshake).
  int64 setup_latency_ns = 2;
  // Hops is the chosen path. Consumers verify min_hops by
  // counting (len(hops) - 1) intermediate edges.
  repeated RouteHop hops = 3;
  // Failed is set when the route could not be established;
  // SetupErr carries the cause. The route is excluded from the
  // pump phase but kept in the event log for diagnostics.
  bool failed = 4;
  string setup_err = 5;
}

// MuxBandwidthSample is a periodic throughput snapshot. Cumulative
// fields are run-totals across all routes; instant fields are
// per-sample-interval rates.
message MuxBandwidthSample {
  // ElapsedNs is the time since the first byte was sent (NOT since
  // the run was requested — excludes setup time).
  int64 elapsed_ns = 1;
  uint64 bytes_sent = 2;
  uint64 bytes_received = 3;
  // InstantSendBps / RecvBps are per-interval rates. avg_*_bps are
  // run-cumulative rates. All in bits-per-second (matches the
  // network-engineer convention; consumers needing Mbps divide by
  // 1e6).
  double instant_send_bps = 4;
  double instant_recv_bps = 5;
  double avg_send_bps = 6;
  double avg_recv_bps = 7;
  // ActiveRoutes is how many of the Routes-requested routes are
  // still pumping. Drops when a route fails mid-run.
  int32 active_routes = 8;
}

// MuxRttProbe is one RTT measurement during the pump. Allows
// consumers to plot loaded-RTT-over-time and compute queueing delay
// as (loaded_rtt - baseline_rtt).
message MuxRttProbe {
  // Sequence is the 1-indexed probe number, in emit order.
  int64 sequence = 1;
  // LatencyNs is the measured RTT. 0 when the probe failed; Error
  // carries the cause.
  int64 latency_ns = 2;
  string error = 3;
  // ElapsedNs is the time since the first byte was sent (same epoch
  // as MuxBandwidthSample.ElapsedNs). Lets consumers align probes
  // with concurrent bandwidth samples without timestamp diffing.
  int64 elapsed_ns = 4;
}

// MuxBandwidthDone is the terminal event. Aggregates the run.
message MuxBandwidthDone {
  uint64 total_bytes_sent = 1;
  uint64 total_bytes_received = 2;
  // WallTimeNs is total elapsed including setup; PumpTimeNs excludes
  // setup. Operators comparing throughput across runs typically want
  // PumpTimeNs (apples-to-apples regardless of how long setup took).
  int64 wall_time_ns = 3;
  int64 pump_time_ns = 4;
  double avg_send_bps = 5;
  double avg_recv_bps = 6;
  double peak_send_bps = 7;
  double peak_recv_bps = 8;
  int32 routes_requested = 9;
  int32 routes_established = 10;
  int64 setup_total_ns = 11;
  // RTT distribution across all probes (when ProbeRtt was set).
  // Zero when no probes ran. Jitter is population stddev — same
  // formula as PingTreeResult.jitter_ns.
  int32 probe_count = 12;
  int64 probe_avg_ns = 13;
  int64 probe_p50_ns = 14;
  int64 probe_p99_ns = 15;
  int64 probe_jitter_ns = 16;
  // TerminationReason: "duration" | "context_cancel" | "all_routes_failed" | "error".
  string termination_reason = 17;
}

// MuxBandwidthError signals an unrecoverable condition. Last event
// before stream close.
message MuxBandwidthError {
  string code = 1;
  string message = 2;
}
