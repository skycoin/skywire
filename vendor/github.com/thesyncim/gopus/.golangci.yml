version: "2"
run:
  modules-download-mode: readonly
linters:
  default: none
  enable:
    - errcheck
    - gocritic
    - govet
    - ineffassign
    - revive
    - staticcheck
  settings:
    gocritic:
      disabled-checks:
        - appendAssign
        - assignOp
        - badCall
        - builtinShadowDecl
        - captLocal
        - commentedOutCode
        - elseif
        - filepathJoin
        - ifElseChain
        - truncateCmp
        - unlambda
        - unslice
        - valSwap
      enabled-tags:
        - diagnostic
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: errorf
        - name: unreachable-code
  exclusions:
    generated: lax
    rules:
      - linters:
          - errcheck
        path: _test\.go
      - linters:
          - revive
        path: example_test\.go
      - linters:
          - staticcheck
        text: 'S1009:'
      - linters:
          - staticcheck
        text: 'S1021:'
      - linters:
          - staticcheck
        text: 'S1031:'
      - linters:
          - staticcheck
        path: ^internal/celt/
        text: 'SA9003:'
      - linters:
          - revive
        path: ^internal/celt/(plc|synthesis)_stage_trace\.go$
        text: 'unexported-return:'
      - linters:
          - staticcheck
        path: ^internal/celt/(bands|dynalloc|encode_frame|pvq_search|qext_alloc)\.go$
        text: 'SA4006:'
      - linters:
          - staticcheck
        path: ^internal/fixedpoint/celt_dynalloc_analysis\.go$
        text: 'SA4006:'
      - linters:
          - staticcheck
        path: ^internal/encoder/encoder\.go$
        text: 'SA4006:'
      - linters:
          - staticcheck
        path: ^internal/silk/(libopus_decode|pitch_detect)\.go$
        text: 'SA4006:'
      - linters:
          - errcheck
        path: ^internal/benchutil/opus_demo\.go$
      - linters:
          - errcheck
        path: ^tools/gen_opusdec_crossval_fixture\.go$
      - linters:
          - errcheck
          - ineffassign
        path: ^internal/encoder/encoder\.go$
      - linters:
          - ineffassign
        path: ^internal/celt/(bands|bands_quant|channel_adapters|decoder_flow_helpers|dynalloc|encode_frame|pvq_search|qext_alloc)\.go$
      - linters:
          - ineffassign
        path: ^internal/fixedpoint/celt_(dynalloc_analysis|encode|pitch|plc)\.go$
      - linters:
          - ineffassign
        path: ^multistream/framing\.go$
      - linters:
          - ineffassign
        path: ^internal/silk/(libopus_decode|pitch_detect)\.go$
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
