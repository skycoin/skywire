#
# E2E Test Environment SKYENV Configuration
#
# This template is used with SKYDEPLOY=docker/integration/services-config.json
# to generate visor configs for the E2E Docker test environment.
#
# Regenerate configs with: make e2e-config
#

### Deployment ##########################################################

#--  Use the E2E deployment services (via SKYDEPLOY env)
#    Ports are NOT offset (containers are isolated)
TESTENV=false

#--  Use only http to connect to services (no dmsg fallback in E2E)
#    E2E services are on internal Docker networks, not accessible via dmsg
#DMSGHTTP=false

### Apps ################################################################

#--  Skychat binds on all interfaces for cross-container access
SKYCHATADDR='*:8001'

#--  Autostart skychat
SKYCHAT=true

#--  Autostart vpn server
VPNSERVER=true

### Remote Access #######################################################

#--  CLI RPC listens on all interfaces for cross-container access
#    (config gen defaults to localhost which is only accessible in-container)
CLIADDR='0.0.0.0:3435'

### Advanced Tuning #####################################################

#--  Graceful shutdown timeout
SHUTDOWNTIMEOUT='10s'
