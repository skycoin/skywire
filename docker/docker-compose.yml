networks:
  srv:
    driver: "bridge"
    ipam:
      config:
        - subnet: 175.0.0.0/16
    driver_opts:
      com.docker.network.bridge.name: br-srv
    internal: true

  visors:
    driver: "bridge"
    ipam:
      config:
        - subnet: 173.0.0.0/16
    driver_opts:
      com.docker.network.bridge.name: br-visors
    internal: true

  intra:
    driver: "bridge"
    ipam:
      config:
        - subnet: 174.0.0.0/16
    driver_opts:
      com.docker.network.bridge.name: br-intra

services:
  dmsgd-redis:
    image: "redis:alpine"
    networks:
      srv:
        ipv4_address: 175.0.0.250
      intra:
        ipv4_address: 174.0.0.250
    container_name: "dmsgd-redis"
    hostname: dmsgd-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ar-redis:
    image: "redis:alpine"
    networks:
      srv:
        ipv4_address: 175.0.0.251
      intra:
        ipv4_address: 174.0.0.251
    container_name: "ar-redis"
    hostname: ar-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  sd-redis:
    image: "redis:alpine"
    networks:
      srv:
        ipv4_address: 175.0.0.252
      intra:
        ipv4_address: 174.0.0.252
    container_name: "sd-redis"
    hostname: sd-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  tpd-redis:
    image: "redis:alpine"
    networks:
      srv:
        ipv4_address: 175.0.0.253
      intra:
        ipv4_address: 174.0.0.253
    container_name: "tpd-redis"
    hostname: tpd-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ut-redis:
    image: "redis:alpine"
    networks:
      srv:
        ipv4_address: 175.0.0.255
      intra:
        ipv4_address: 174.0.0.255
    container_name: "ut-redis"
    hostname: ut-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres-db:
    image: "postgres:alpine"
    networks:
      srv:
        ipv4_address: 175.0.0.248
      intra:
        ipv4_address: 174.0.0.248
    environment:
      - GODEBUG=madvdontneed=1
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    # ports:
    #   - '5432:5432'
    shm_size: 256mb
    container_name: "postgres-db"
    hostname: postgres-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s

  # deployment-services collapses the nine deployment-side containers
  # (transport-discovery, route-finder, dmsg-discovery, dmsg-server,
  # setup-node, service-discovery, address-resolver, transport-setup,
  # stun-server) into a single process driven by `skywire svc run`.
  # Each service runs as a goroutine inside one binary, sharing a
  # signal handler and merged log stream. Hostnames are preserved on
  # the docker bridge via `aliases` so visor configs and the e2e
  # test's extra_hosts continue to refer to each service by its
  # original name; only the IPs change.
  #
  # IP plan: visors=173.0.0.17 + intra=174.0.0.17 inherits stun's
  # required pair (RFC 3489 needs two distinct IPs for full NAT type
  # detection); srv=175.0.0.2 inherits TPD's address.
  deployment-services:
    privileged: true
    image: "${REGISTRY}/skywire:${DOCKER_TAG}"
    hostname: deployment-services
    container_name: "deployment-services"
    networks:
      srv:
        ipv4_address: 175.0.0.2
        aliases:
          - transport-discovery
          - route-finder
          - dmsg-discovery
          - dmsg-server
          - setup-node
          - service-discovery
          - address-resolver
          - transport-setup
      intra:
        ipv4_address: 174.0.0.17
        aliases:
          - transport-discovery
          - route-finder
          - dmsg-discovery
          - dmsg-server
          - setup-node
          - service-discovery
          - address-resolver
          - transport-setup
          - stun-server
      visors:
        ipv4_address: 173.0.0.17
        aliases:
          - stun-server
    depends_on:
      tpd-redis:
        condition: service_healthy
      sd-redis:
        condition: service_healthy
      ar-redis:
        condition: service_healthy
      dmsgd-redis:
        condition: service_healthy
    restart: always
    environment:
      - GODEBUG=madvdontneed=1
    entrypoint: "/release/skywire svc run --config /release/services.json"
    volumes:
      - type: bind
        source: ../docker/integration/services.json
        target: /release/services.json
        read_only: true
      - type: bind
        source: ../docker/integration/dmsg-server.json
        target: /release/dmsg-server.json
        read_only: true
      - type: bind
        source: ../docker/integration/setup-node.json
        target: /release/setup-node.json
        read_only: true
      - type: bind
        source: ../docker/integration/transport-setup.json
        target: /release/transport-setup.json
        read_only: true
    healthcheck:
      # All four service /debug/service endpoints (TPD, SD, AR, RF)
      # share one process — checking any one of them validates the
      # supervisor is up and at least one HTTP listener is live.
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:6094/debug/service"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s
    stdin_open: true # docker run -i
    tty: true        # docker run -t

  uptime-tracker:
    privileged: true
    image: "${REGISTRY}/skywire:${DOCKER_TAG}"
    hostname: uptime-tracker
    container_name: "uptime-tracker"
    restart: always
    networks:
      srv:
        ipv4_address: 175.0.0.7
      intra:
        ipv4_address: 174.0.0.7
    depends_on:
      ut-redis:
        condition: service_healthy
      postgres-db:
        condition: service_healthy
    environment:
      - GODEBUG=madvdontneed=1
      - PG_USER=postgres
      - PG_PASSWORD=postgres
      - PG_DATABASE=postgres
    entrypoint: "/release/skywire svc ut --addr :9095 --pprof :6095 --pg-host postgres-db --pg-port 5432 --redis redis://ut-redis:6379 --sk e20681b4fd1eb1904ebfbf8fba79a138bbac481e1c3f77bcfab3a877525fda32 --dmsg-disc http://dmsg-discovery:9090"
    stdin_open: true # docker run -i
    tty: true        # docker run -t

  # skywire visors, which by being on a different network are to be isolated from the first one

  visor-a:
    privileged: true
    image: "${REGISTRY}/skywire:${DOCKER_TAG}"
    container_name: "visor-a"
    hostname: visor-a
    cap_add:
      - ALL
    networks:
      visors:
        ipv4_address: 173.0.0.11
      intra:
        ipv4_address: 174.0.0.11
    extra_hosts:
      - "visor-b:173.0.0.12"
      - "visor-c:173.0.0.13"
      - "dmsg-discovery:174.0.0.17"
      - "dmsg-server:174.0.0.17"
      - "transport-discovery:174.0.0.17"
      - "route-finder:174.0.0.17"
      - "address-resolver:174.0.0.17"
      - "service-discovery:174.0.0.17"
      - "uptime-tracker:174.0.0.7"
      - "setup-node:174.0.0.17"
      - "stun-server:174.0.0.17"
      - "transport-setup:174.0.0.17"
    volumes:
      - type: bind
        source: ../docker/integration/visorA.json
        target: /opt/skywire/skywire-visor.json
        read_only: false
    depends_on:
      - visor-b
    restart: always
    environment:
      - GODEBUG=madvdontneed=1
    entrypoint: /release/skywire visor -c /opt/skywire/skywire-visor.json -s -l debug -q http
    healthcheck:
      test: [
        "CMD-SHELL",
        "/release/skywire cli --rpc localhost:3435 dmsg sessions --json | grep -v '\"count\": 0' | grep -q '\"count\"'"
      ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  visor-b:
    privileged: true
    image: "${REGISTRY}/skywire:${DOCKER_TAG}"
    container_name: "visor-b"
    hostname: visor-b
    cap_add:
      - ALL
    networks:
      visors:
        ipv4_address: 173.0.0.12
      intra:
        ipv4_address: 174.0.0.12
    extra_hosts:
      - "visor-a:173.0.0.11"
      - "visor-c:173.0.0.13"
      - "dmsg-discovery:174.0.0.17"
      - "dmsg-server:174.0.0.17"
      - "transport-discovery:174.0.0.17"
      - "route-finder:174.0.0.17"
      - "address-resolver:174.0.0.17"
      - "service-discovery:174.0.0.17"
      - "uptime-tracker:174.0.0.7"
      - "setup-node:174.0.0.17"
      - "stun-server:174.0.0.17"
      - "transport-setup:174.0.0.17"
    volumes:
      - type: bind
        source: ../docker/integration/visorB.json
        target: /opt/skywire/skywire-visor.json
        read_only: false
      - type: bind
        source: ../docker/integration/hypervisor.crt
        target: /opt/integration/hypervisor.crt
        read_only: false
      - type: bind
        source: ../docker/integration/hypervisor.key
        target: /opt/integration/hypervisor.key
        read_only: false
    depends_on:
      deployment-services:
        condition: service_healthy
    restart: always
    environment:
      - GODEBUG=madvdontneed=1
    entrypoint: /release/skywire visor -c /opt/skywire/skywire-visor.json -s -l debug -q http
    healthcheck:
      test: [
        "CMD-SHELL",
        "/release/skywire cli --rpc localhost:3435 dmsg sessions --json | grep -v '\"count\": 0' | grep -q '\"count\"'"
      ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  visor-c:
    privileged: true
    image: "${REGISTRY}/skywire:${DOCKER_TAG}"
    container_name: "visor-c"
    hostname: visor-c
    cap_add:
      - ALL
    networks:
      visors:
        ipv4_address: 173.0.0.13
      intra:
        ipv4_address: 174.0.0.13
    extra_hosts:
      - "visor-a:173.0.0.11"
      - "visor-b:173.0.0.12"
      - "dmsg-discovery:174.0.0.17"
      - "dmsg-server:174.0.0.17"
      - "transport-discovery:174.0.0.17"
      - "route-finder:174.0.0.17"
      - "address-resolver:174.0.0.17"
      - "service-discovery:174.0.0.17"
      - "uptime-tracker:174.0.0.7"
      - "setup-node:174.0.0.17"
      - "stun-server:174.0.0.17"
      - "transport-setup:174.0.0.17"
    volumes:
      - type: bind
        source: ../docker/integration/visorC.json
        target: /opt/skywire/skywire-visor.json
        read_only: false
    depends_on:
      - visor-a
    restart: always
    environment:
      - GODEBUG=madvdontneed=1
    entrypoint: /release/skywire visor -c /opt/skywire/skywire-visor.json -s -l debug -q http
    healthcheck:
      test: [
        "CMD-SHELL",
        "/release/skywire cli --rpc localhost:3435 dmsg sessions --json | grep -v '\"count\": 0' | grep -q '\"count\"'"
      ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  network-monitor:
    image: "${REGISTRY}/skywire:${DOCKER_TAG}"
    hostname: network-monitor
    container_name: "network-monitor"
    networks:
      srv:
        ipv4_address: 175.0.0.30
      intra:
        ipv4_address: 174.0.0.30
    environment:
      - GODEBUG=madvdontneed=1
    entrypoint: "/release/skywire svc nm --addr :9080 --pprof :6080 --ut-url http://uptime-tracker:9095 --tpd-url http://transport-discovery:9094 --sd-url http://service-discovery:9091 --dmsgd-url http://dmsg-discovery:9090 --ar-url http://address-resolver:9093"
    depends_on:
      - visor-c
    restart: always
    stdin_open: true # docker run -i
    tty: true        # docker run -t

  e2e-test:
    image: golang:1.26-alpine
    container_name: e2e-test
    networks:
      - visors
      - intra
      - srv
    extra_hosts:
      # Static host entries bypass Docker embedded DNS (127.0.0.11)
      # which is flaky on GH Actions ("server misbehaving"). All
      # collapsed deployment services point at the deployment-services
      # container's intra IP (174.0.0.17); UT remains separate.
      - "visor-a:173.0.0.11"
      - "visor-b:173.0.0.12"
      - "visor-c:173.0.0.13"
      - "dmsg-discovery:174.0.0.17"
      - "dmsg-server:174.0.0.17"
      - "transport-discovery:174.0.0.17"
      - "route-finder:174.0.0.17"
      - "address-resolver:174.0.0.17"
      - "service-discovery:174.0.0.17"
      - "uptime-tracker:174.0.0.7"
      - "setup-node:174.0.0.17"
      - "stun-server:174.0.0.17"
      - "transport-setup:174.0.0.17"
    volumes:
      - ../:/workspace
      - go-test-cache:/root/.cache/go-build
      - go-mod-cache:/go/pkg/mod
      - /var/run/docker.sock:/var/run/docker.sock:ro  # Add Docker socket
    working_dir: /workspace
    environment:
      - GODEBUG=madvdontneed=1
      - CGO_ENABLED=0
      - SKYDEPLOY=/workspace/docker/integration/services-config.json
    depends_on:
      visor-a:
        condition: service_healthy
      visor-b:
        condition: service_healthy
      visor-c:
        condition: service_healthy
    profiles:
      - test

volumes:
  go-test-cache:
  go-mod-cache:
