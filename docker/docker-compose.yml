networks:
  srv:
    driver: "bridge"
    ipam:
      config:
        - subnet: 175.0.0.0/16
    driver_opts:
      com.docker.network.bridge.name: br-srv
    internal: true

  visors:
    driver: "bridge"
    ipam:
      config:
        - subnet: 173.0.0.0/16
    driver_opts:
      com.docker.network.bridge.name: br-visors
    internal: true

  intra:
    driver: "bridge"
    ipam:
      config:
        - subnet: 174.0.0.0/16
    driver_opts:
      com.docker.network.bridge.name: br-intra

services:
  # Single shared redis for every discovery service. Each service uses
  # its own logical DB (redis://redis:6379/<N>) to preserve the keyspace
  # isolation the previous per-service redis containers gave:
  #   /0 dmsg-discovery   /1 transport-discovery + route-finder (shared,
  #   route-finder reads TPD's transport data)   /2 service-discovery
  #   /3 address-resolver
  redis:
    image: "redis:alpine"
    networks:
      srv:
        ipv4_address: 175.0.0.250
      intra:
        ipv4_address: 174.0.0.250
    container_name: "redis"
    hostname: redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # deployment-services collapses the nine deployment-side containers
  # (transport-discovery, route-finder, dmsg-discovery, dmsg-server,
  # setup-node, service-discovery, address-resolver, transport-setup,
  # stun-server) into a single process driven by `skywire svc run`.
  # Each service runs as a goroutine inside one binary, sharing a
  # signal handler and merged log stream. Hostnames are preserved on
  # the docker bridge via `aliases` so visor configs and the e2e
  # test's extra_hosts continue to refer to each service by its
  # original name; only the IPs change.
  #
  # IP plan: visors=173.0.0.17 + intra=174.0.0.17 inherits stun's
  # required pair (RFC 3489 needs two distinct IPs for full NAT type
  # detection); srv=175.0.0.2 inherits TPD's address.
  deployment-services:
    privileged: true
    image: "${REGISTRY}/skywire:${DOCKER_TAG}"
    hostname: deployment-services
    container_name: "deployment-services"
    networks:
      srv:
        ipv4_address: 175.0.0.2
        aliases:
          - dmsg-discovery
          - dmsg-server
          - setup-node
          - transport-setup
      intra:
        ipv4_address: 174.0.0.17
        aliases:
          - dmsg-discovery
          - dmsg-server
          - setup-node
          - transport-setup
          - stun-server
      visors:
        ipv4_address: 173.0.0.17
        aliases:
          - stun-server
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    environment:
      - GODEBUG=madvdontneed=1
    entrypoint: "/release/skywire svc run --config /release/services.json"
    volumes:
      - type: bind
        source: ../docker/integration/services.json
        target: /release/services.json
        read_only: true
      - type: bind
        source: ../docker/integration/dmsg-server.json
        target: /release/dmsg-server.json
        read_only: true
      - type: bind
        source: ../docker/integration/setup-node.json
        target: /release/setup-node.json
        read_only: true
      - type: bind
        source: ../docker/integration/transport-setup.json
        target: /release/transport-setup.json
        read_only: true
    healthcheck:
      # dmsg-discovery's /health stands for the whole process: the
      # services share one supervisor, so one live HTTP listener
      # means it is up. Several services starting concurrently on a
      # 2-core CI runner contend, so start_period is generous.
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9090/health"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 60s
    stdin_open: true # docker run -i
    tty: true        # docker run -t

  # visor-s runs transport-discovery, route-finder, address-resolver
  # and service-discovery INSIDE a visor (config.embedded_services),
  # the way a deployment host does: each is mounted under a prefix on
  # the visor's dmsg HTTP port and addressed by the visor's key
  # (dmsg://<visor-s pk>:80/tpd, /rf, /ar, /sd — see
  # docker/integration/services-config.json). The same handlers are
  # also served on their old plain-HTTP ports so the suite's direct
  # curls keep working; the service hostnames now alias this container.
  visor-s:
    privileged: true
    image: "${REGISTRY}/skywire:${DOCKER_TAG}"
    container_name: "visor-s"
    hostname: visor-s
    networks:
      srv:
        ipv4_address: 175.0.0.3
        aliases:
          - transport-discovery
          - route-finder
          - address-resolver
          - service-discovery
      intra:
        ipv4_address: 174.0.0.18
        aliases:
          - transport-discovery
          - route-finder
          - address-resolver
          - service-discovery
    extra_hosts:
      - "dmsg-discovery:174.0.0.17"
      - "dmsg-server:174.0.0.17"
      - "setup-node:174.0.0.17"
      - "stun-server:174.0.0.17"
      - "transport-setup:174.0.0.17"
    volumes:
      - type: bind
        source: ../docker/integration/visorS.json
        target: /opt/skywire/skywire-visor.json
        read_only: false
    depends_on:
      redis:
        condition: service_healthy
      deployment-services:
        condition: service_healthy
    restart: always
    environment:
      - GODEBUG=madvdontneed=1
    entrypoint: /release/skywire visor -c /opt/skywire/skywire-visor.json -s -l debug -q http
    healthcheck:
      # transport-discovery's plain-HTTP /health, served by the visor.
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9094/health"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 60s

  # NOTE: the standalone uptime-tracker service (+ its postgres + redis) was
  # removed — uptime tracking is now integrated into every discovery service
  # (TPD et al.), so the deprecated `skywire svc ut` deployment is no longer
  # part of the e2e topology.

  # skywire visors, which by being on a different network are to be isolated from the first one
  #
  # Each visor runs skychat as an in-process app on container port 8001 (see
  # the launcher.apps entry in its config: no "binary", so the name resolves to
  # the in-tree run func). The three UIs are published on the host so the chat
  # app can be driven from a browser against three real visors — DMs, groups,
  # file transfers, and voice/video messages:
  #
  #   visor-a  http://127.0.0.1:8001
  #   visor-b  http://127.0.0.1:8002   (also the hypervisor: http://127.0.0.1:8000)
  #   visor-c  http://127.0.0.1:8003
  #
  # Published on 127.0.0.1 deliberately, and not just to limit exposure: the
  # microphone/camera (getUserMedia) and the Notifications API only work in a
  # secure context, which plain http satisfies for 127.0.0.1/localhost and NOT
  # for a LAN address. Reaching these UIs over the network instead would leave
  # voice/video messages and desktop notifications disabled.
  #
  # Real-time voice CALLS are the one part that can't be exercised here: the
  # visor captures/plays host audio (pkg/skychat/call — PulseAudio/PipeWire on
  # Linux), and these alpine containers run no audio daemon, so the call
  # manager reports disabled and the UI hides its call controls. Voice/video
  # MESSAGES are unaffected — the browser records them and they ship over the
  # ordinary file path.

  visor-a:
    privileged: true
    image: "${REGISTRY}/skywire:${DOCKER_TAG}"
    container_name: "visor-a"
    hostname: visor-a
    cap_add:
      - ALL
    networks:
      visors:
        ipv4_address: 173.0.0.11
      intra:
        ipv4_address: 174.0.0.11
    ports:
      - "127.0.0.1:8001:8001"   # skychat UI
    extra_hosts:
      - "visor-b:173.0.0.12"
      - "visor-c:173.0.0.13"
      - "dmsg-discovery:174.0.0.17"
      - "dmsg-server:174.0.0.17"
      - "transport-discovery:174.0.0.18"
      - "route-finder:174.0.0.18"
      - "address-resolver:174.0.0.18"
      - "service-discovery:174.0.0.18"
      - "setup-node:174.0.0.17"
      - "stun-server:174.0.0.17"
      - "transport-setup:174.0.0.17"
    volumes:
      - type: bind
        source: ../docker/integration/visorA.json
        target: /opt/skywire/skywire-visor.json
        read_only: false
    depends_on:
      - visor-b
    restart: always
    environment:
      - GODEBUG=madvdontneed=1
    entrypoint: /release/skywire visor -c /opt/skywire/skywire-visor.json -s -l debug -q http
    healthcheck:
      test: [
        "CMD-SHELL",
        "/release/skywire cli --rpc localhost:3435 dmsg sessions --json | grep -v '\"count\": 0' | grep -q '\"count\"'"
      ]
      interval: 5s
      timeout: 5s
      retries: 90
      start_period: 90s

  visor-b:
    privileged: true
    image: "${REGISTRY}/skywire:${DOCKER_TAG}"
    container_name: "visor-b"
    hostname: visor-b
    cap_add:
      - ALL
    networks:
      visors:
        ipv4_address: 173.0.0.12
      intra:
        ipv4_address: 174.0.0.12
    ports:
      - "127.0.0.1:8002:8001"   # skychat UI (container port is 8001 on every visor)
      - "127.0.0.1:8000:8000"   # hypervisor UI — visor-b is the hypervisor for a and c
    extra_hosts:
      - "visor-a:173.0.0.11"
      - "visor-c:173.0.0.13"
      - "dmsg-discovery:174.0.0.17"
      - "dmsg-server:174.0.0.17"
      - "transport-discovery:174.0.0.18"
      - "route-finder:174.0.0.18"
      - "address-resolver:174.0.0.18"
      - "service-discovery:174.0.0.18"
      - "setup-node:174.0.0.17"
      - "stun-server:174.0.0.17"
      - "transport-setup:174.0.0.17"
    volumes:
      - type: bind
        source: ../docker/integration/visorB.json
        target: /opt/skywire/skywire-visor.json
        read_only: false
      - type: bind
        source: ../docker/integration/hypervisor.crt
        target: /opt/integration/hypervisor.crt
        read_only: false
      - type: bind
        source: ../docker/integration/hypervisor.key
        target: /opt/integration/hypervisor.key
        read_only: false
    depends_on:
      deployment-services:
        condition: service_healthy
      visor-s:
        condition: service_healthy
    restart: always
    environment:
      - GODEBUG=madvdontneed=1
    entrypoint: /release/skywire visor -c /opt/skywire/skywire-visor.json -s -l debug -q http
    healthcheck:
      test: [
        "CMD-SHELL",
        "/release/skywire cli --rpc localhost:3435 dmsg sessions --json | grep -v '\"count\": 0' | grep -q '\"count\"'"
      ]
      interval: 5s
      timeout: 5s
      retries: 90
      start_period: 90s

  visor-c:
    privileged: true
    image: "${REGISTRY}/skywire:${DOCKER_TAG}"
    container_name: "visor-c"
    hostname: visor-c
    cap_add:
      - ALL
    networks:
      visors:
        ipv4_address: 173.0.0.13
      intra:
        ipv4_address: 174.0.0.13
    ports:
      - "127.0.0.1:8003:8001"   # skychat UI
    extra_hosts:
      - "visor-a:173.0.0.11"
      - "visor-b:173.0.0.12"
      - "dmsg-discovery:174.0.0.17"
      - "dmsg-server:174.0.0.17"
      - "transport-discovery:174.0.0.18"
      - "route-finder:174.0.0.18"
      - "address-resolver:174.0.0.18"
      - "service-discovery:174.0.0.18"
      - "setup-node:174.0.0.17"
      - "stun-server:174.0.0.17"
      - "transport-setup:174.0.0.17"
    volumes:
      - type: bind
        source: ../docker/integration/visorC.json
        target: /opt/skywire/skywire-visor.json
        read_only: false
    depends_on:
      - visor-a
    restart: always
    environment:
      - GODEBUG=madvdontneed=1
    entrypoint: /release/skywire visor -c /opt/skywire/skywire-visor.json -s -l debug -q http
    healthcheck:
      test: [
        "CMD-SHELL",
        "/release/skywire cli --rpc localhost:3435 dmsg sessions --json | grep -v '\"count\": 0' | grep -q '\"count\"'"
      ]
      interval: 5s
      timeout: 5s
      retries: 90
      start_period: 90s

  # network-monitor was removed from the e2e topology: it was already
  # disabled (never started by `make e2e-run`, excluded from env_test's
  # expected containers) and its `svc nm` entrypoint monitored services
  # over plain HTTP — including the now-removed uptime-tracker. The
  # pkg/deployment/monitor code is unaffected; re-add a dmsg-only container
  # here if e2e network monitoring is wanted again.

  e2e-test:
    image: golang:1.27.1-alpine
    container_name: e2e-test
    networks:
      - visors
      - intra
      - srv
    extra_hosts:
      # Static host entries bypass Docker embedded DNS (127.0.0.11)
      # which is flaky on GH Actions ("server misbehaving"). All
      # collapsed deployment services point at the deployment-services
      # container's intra IP (174.0.0.17); UT remains separate.
      - "visor-a:173.0.0.11"
      - "visor-b:173.0.0.12"
      - "visor-c:173.0.0.13"
      - "dmsg-discovery:174.0.0.17"
      - "dmsg-server:174.0.0.17"
      - "transport-discovery:174.0.0.18"
      - "route-finder:174.0.0.18"
      - "address-resolver:174.0.0.18"
      - "service-discovery:174.0.0.18"
      - "setup-node:174.0.0.17"
      - "stun-server:174.0.0.17"
      - "transport-setup:174.0.0.17"
    volumes:
      - ../:/workspace
      - go-test-cache:/root/.cache/go-build
      - go-mod-cache:/go/pkg/mod
      - /var/run/docker.sock:/var/run/docker.sock:ro  # Add Docker socket
    working_dir: /workspace
    environment:
      - GODEBUG=madvdontneed=1
      - CGO_ENABLED=0
      - SKYDEPLOY=/workspace/docker/integration/services-config.json
    depends_on:
      visor-a:
        condition: service_healthy
      visor-b:
        condition: service_healthy
      visor-c:
        condition: service_healthy
    profiles:
      - test

volumes:
  go-test-cache:
  go-mod-cache:
