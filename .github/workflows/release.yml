name: Release
# only trigger on pull request closed events
on:
  push:
    tags:
      - '*'
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.x
      - uses: actions/checkout@v4
      - name: Install Requirements
        run: |
          sudo apt update
          sudo snap install goreleaser --classic
          make dep-github-release
      - name: Releasing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make github-release

  darwin:
    needs: linux
    runs-on: macos-latest
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.x
      - uses: actions/checkout@v4
      - name: Install Requirements
        run: |
          brew install goreleaser
          brew install jq
          brew install wget
      - name: Releasing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          make github-release-darwin
          make mac-installer-release

  windows:
    needs: darwin
    runs-on: windows-latest
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.x
      - uses: actions/checkout@v4
      - name: Install Requirements
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/goreleaser/goreleaser/releases/download/v2.0.1/goreleaser_Windows_x86_64.zip" -OutFile goreleaser.zip
          Expand-Archive goreleaser.zip
          choco install make
      - name: Releasing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          make github-release-windows
          make windows-installer-release
  publish-winget:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Komac
        run: |
          winget install --id RussellBanks.Komac -e --silent

      - name: Configure Komac authentication
        run: komac token add
        env:
          KOMAC_TOKEN: ${{ secrets.WINGET_PAT }}

      - name: Publish to WinGet
        run: |
          komac update Skycoin.Skywire `
            --version ${{ github.ref_name }} `
            --urls "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/skywire-installer-${{ github.ref_name }}-windows-amd64.msi" `
                   "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/skywire-installer-${{ github.ref_name }}-windows-386.msi" `
            --submit
        env:
          KOMAC_TOKEN: ${{ secrets.WINGET_PAT }}
