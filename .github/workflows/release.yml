name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  # Rebuild the assets of an EXISTING tag with the workflow as it is on the
  # branch this is dispatched from. A tag-push run uses the workflow at the
  # tag, so a workflow fix can only reach an already-tagged release this way;
  # the tag itself never moves (see the v1.3.94 linux assets).
  workflow_dispatch:
    inputs:
      tag:
        description: existing release tag to build assets for
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  GO_VERSION: 'stable'
  MUSL_RELEASE: 'v1.3.29'
  MODULE: github.com/skycoin/skywire

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ env.RELEASE_TAG }}" \
            --repo ${{ github.repository }} \
            --title "${{ env.RELEASE_TAG }}" \
            --generate-notes || true

  linux:
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      # Don't let one arch's transient failure (e.g. a flaky module fetch)
      # cancel the other five — each arch uploads independently.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            goarch: amd64
            toolchain: x86_64-linux-musl
            toolchain_file: x86_64-linux-musl-cross.tgz
          - arch: arm64
            goarch: arm64
            toolchain: aarch64-linux-musl
            toolchain_file: aarch64-linux-musl-cross.tgz
          - arch: arm
            goarch: arm
            goarm: "6"
            toolchain: arm-linux-musleabi
            toolchain_file: arm-linux-musleabi-cross.tgz
          - arch: armhf
            goarch: arm
            goarm: "7"
            toolchain: arm-linux-musleabihf
            toolchain_file: arm-linux-musleabihf-cross.tgz
          - arch: 386
            goarch: "386"
            toolchain: i686-linux-musl
            toolchain_file: i686-linux-musl-cross.tgz
          - arch: riscv64
            goarch: riscv64
            toolchain: riscv64-linux-musl
            toolchain_file: riscv64-linux-musl-cross.tgz
    steps:
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y wget tar xz-utils libusb-1.0-0-dev autoconf automake libtool

      - name: Checkout skywire at the tag
        uses: actions/checkout@v7
        with:
          # FIRST, before anything is put in the workspace: checkout deletes
          # the whole workspace when it is not yet a repository, clean: false
          # or not. The musl toolchain used to be unpacked here two steps
          # earlier and vanished, so every linux job of v1.3.94-alpha1 and
          # v1.3.94 failed with "C compiler … not found"; the dispatched
          # rebuild of v1.3.94 proved clean: false alone was not enough.
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          fetch-tags: true

      # Go stamps vcs.modified=true when the work tree is dirty — an UNTRACKED
      # file is enough — and the version then reads v1.3.94+dirty, which is
      # exactly what v1.3.94 shipped. So every scratch file this job writes
      # goes to $RUNNER_TEMP, or is ignored (bin/, dist/, skywire.wasm,
      # musl-data), and the steps that build assert a clean tree first.
      - name: Fetch build-libusb-musl.sh
        run: |
          # Into $RUNNER_TEMP, not the workspace: see the note above.
          # -f fails on HTTP error (so a raw.github 404/429 right after the tag
          # push isn't saved as an error page and run as a shell script); retry
          # to ride out raw.github propagation lag / rate-limiting.
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 4 \
            "https://raw.githubusercontent.com/${{ github.repository }}/${{ env.RELEASE_TAG }}/ci_scripts/build-libusb-musl.sh" \
            -o "$RUNNER_TEMP/build-libusb-musl.sh"
          chmod +x "$RUNNER_TEMP/build-libusb-musl.sh"

      - name: Cache musl toolchain
        id: cache-toolchain
        uses: actions/cache@v6
        with:
          path: musl-data
          key: musl-${{ env.MUSL_RELEASE }}-${{ matrix.toolchain }}

      - name: Download musl toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          # The tarball lands in $RUNNER_TEMP: musl-data is gitignored, the
          # tarball at the repo root was not, and it only has to exist while
          # one step runs to dirty a build in another.
          mkdir -p musl-data
          wget -q -O "$RUNNER_TEMP/${{ matrix.toolchain_file }}" \
            "https://github.com/skycoin/skywire/releases/download/${{ env.MUSL_RELEASE }}/${{ matrix.toolchain_file }}"
          tar -xzf "$RUNNER_TEMP/${{ matrix.toolchain_file }}" -C ./musl-data
          rm "$RUNNER_TEMP/${{ matrix.toolchain_file }}"

      - name: Build libusb for musl target
        run: '"$RUNNER_TEMP/build-libusb-musl.sh" ${{ matrix.arch }} ${{ matrix.toolchain }} ./musl-data/${{ matrix.toolchain }}-cross'

      - name: Build the js/wasm command module (stage 1 of the two-stage build)
        env:
          CGO_ENABLED: "0"
          GOOS: js
          GOARCH: wasm
        run: |
          # Gate: this module is built with -buildvcs=true, so a dirty tree is
          # recorded IN THE MODULE as vcs.modified=true and the desk reports
          # dev-<commit>-dirty forever after (v1.3.94's embedded module did).
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::work tree is dirty before the js/wasm build — the embedded module would be stamped dirty"
            git status --porcelain
            exit 1
          fi
          # The desk's `skywire` command and the tab visor, embedded into the
          # native binary below (pkg/wasmhv/execwasm) so every release serves
          # the desk with no extra file. Same toolchain as wasm_exec.js.
          go build -trimpath -buildvcs=true -mod=vendor -tags "withoutsystray withoutgotop" \
            -ldflags "-s -w -buildid=" -o skywire.wasm .
          gzip -9 -n -c skywire.wasm > pkg/wasmhv/execwasm/blob/skywire.wasm.gz
          # Record which commit the module was built from, beside it, so a
          # served binary can report that its desk is older than itself. Without
          # this the blob has no revision, execwasm.Revision() is "", and the
          # staleness check (rev != "" && bin != "" && rev != bin) is hard-false
          # — inert on exactly the binaries that ship. Same lift as
          # `make embed-exec-wasm`: vcs.revision= is not at the start of a
          # strings(1) line, so match the substring rather than anchoring.
          strings -a skywire.wasm | grep -oE 'vcs\.revision=[0-9a-f]{40}' \
            | head -1 | cut -d= -f2 > pkg/wasmhv/execwasm/blob/revision.txt
          # An empty revision is the silent failure this exists to prevent, so
          # fail the build rather than publish a binary that cannot self-report.
          test -s pkg/wasmhv/execwasm/blob/revision.txt || {
            echo "ERROR: could not read vcs.revision from the js/wasm module"; exit 1; }
          echo "staged module revision: $(cat pkg/wasmhv/execwasm/blob/revision.txt)"
          rm -f skywire.wasm
          ls -la pkg/wasmhv/execwasm/blob/
          # Both files above are TRACKED (committed by #4872), so overwriting
          # them leaves two modified tracked files — which is what stamped the
          # native binary +dirty. assume-unchanged makes git ignore the work
          # tree copy while the rebuilt bytes are still what gets embedded;
          # nothing is committed and nothing is reverted.
          git update-index --assume-unchanged \
            pkg/wasmhv/execwasm/blob/skywire.wasm.gz \
            pkg/wasmhv/execwasm/blob/revision.txt
          git status --porcelain

      - name: Build skywire release binary
        env:
          CGO_ENABLED: "1"
          CC: ${{ github.workspace }}/musl-data/${{ matrix.toolchain }}-cross/bin/${{ matrix.toolchain }}-gcc
          PKG_CONFIG_PATH: ${{ github.workspace }}/musl-data/${{ matrix.toolchain }}-cross/${{ matrix.toolchain }}/lib/pkgconfig
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::work tree is dirty before the release build — the binary would be stamped +dirty"
            git status --porcelain
            exit 1
          fi
          # Built from the checked-out tag (not `go install module@tag`) so the
          # staged js/wasm module above is embedded. -mod=vendor: the tree
          # vendors its dependencies.
          #
          # -X …buildinfo.version: this was the one native build in the repo
          # that stamped no version at all, so Version() fell back to
          # bi.Main.Version — i.e. to whatever the VCS said, "+dirty" included.
          # publish-binary.yml stamps the same symbol; belt and braces, the
          # released binary now reports the tag whatever the toolchain records.
          mkdir -p bin
          go build -tags="cgo,withoutsystray" -trimpath -mod=vendor \
            -ldflags "-s -w -linkmode external -extldflags '-static' -buildid= -X ${MODULE}/pkg/buildinfo.version=${RELEASE_TAG}" \
            -o bin/skywire .

          # Verify binary on native arch
          if [ "${{ matrix.arch }}" = "amd64" ]; then
            ./bin/skywire || true
            ./bin/skywire skycoin || true
          fi

      # v1.3.94 shipped `mod github.com/skycoin/skywire v1.3.94+dirty` and an
      # embedded module carrying vcs.modified=true. Both are checked here, on
      # the artifact itself, so a release that would repeat it fails before the
      # upload instead of being discovered in a downloaded tarball.
      - name: Verify the built binary and its embedded module are clean
        run: |
          set -euo pipefail
          go version -m bin/skywire > "$RUNNER_TEMP/buildinfo.txt"
          grep -E 'vcs\.(revision|modified)|^[[:space:]]*mod[[:space:]]' "$RUNNER_TEMP/buildinfo.txt" || true
          if grep -qE '^[[:space:]]*mod[[:space:]].*\+dirty' "$RUNNER_TEMP/buildinfo.txt"; then
            echo "::error::bin/skywire is stamped +dirty"
            exit 1
          fi
          if grep -q 'vcs.modified=true' "$RUNNER_TEMP/buildinfo.txt"; then
            echo "::error::bin/skywire records vcs.modified=true"
            exit 1
          fi
          # The module embedded in that binary is the staged blob, byte for
          # byte, so read the blob rather than carving the gzip stream back out
          # of a 100 MB binary — same bytes, and it works on every arch.
          gzip -dc pkg/wasmhv/execwasm/blob/skywire.wasm.gz > "$RUNNER_TEMP/staged.wasm"
          mod=$(grep -m1 -aoE 'vcs\.modified=[a-z]+' "$RUNNER_TEMP/staged.wasm" || true)
          rev=$(grep -m1 -aoE 'vcs\.revision=[0-9a-f]{40}' "$RUNNER_TEMP/staged.wasm" || true)
          rm -f "$RUNNER_TEMP/staged.wasm"
          echo "embedded js/wasm module: ${rev:-<none>} ${mod:-<none>}"
          if [ "$mod" != "vcs.modified=false" ]; then
            echo "::error::the embedded js/wasm module is not clean (${mod:-no vcs.modified record})"
            exit 1
          fi
          # …and that it was built from THIS commit, not carried in stale.
          make check-exec-wasm

      - name: Create archive
        run: |
          ARCHIVE_NAME="skywire-${{ env.RELEASE_TAG }}-linux-${{ matrix.arch }}"
          mkdir -p dist
          cp bin/skywire dist/
          cd dist
          tar -cvf - skywire | xz -9e -T0 -c > "${ARCHIVE_NAME}.tar.xz"
          sha256sum "${ARCHIVE_NAME}.tar.xz" > "${ARCHIVE_NAME}.tar.xz.sha256"

      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ env.RELEASE_TAG }}" \
            dist/skywire-${{ env.RELEASE_TAG }}-linux-${{ matrix.arch }}.tar.xz \
            dist/skywire-${{ env.RELEASE_TAG }}-linux-${{ matrix.arch }}.tar.xz.sha256 \
            --repo ${{ github.repository }} \
            --clobber

  darwin-amd64:
    needs: create-release
    runs-on: macos-15-intel
    steps:
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install Requirements
        run: |
          brew install --quiet libusb || brew upgrade --quiet libusb
          brew install --quiet hidapi || brew upgrade --quiet hidapi

      - name: Build skywire
        env:
          GOPROXY: "https://proxy.golang.org,direct"
          GOSUMDB: "off"
          CGO_ENABLED: "1"
          CGO_CFLAGS: -I/usr/local/include -I/opt/homebrew/include -I/opt/homebrew/opt/hidapi/include -I/opt/homebrew/opt/libusb/include
          CGO_LDFLAGS: -L/usr/local/lib -L/opt/homebrew/lib -L/opt/homebrew/opt/hidapi/lib -L/opt/homebrew/opt/libusb/lib
        run: |
          # module@tag from the proxy: there is no work tree in this job, so
          # nothing here can dirty the build and no clean-tree gate applies.
          # The flip side is that this binary embeds the COMMITTED js/wasm
          # blob, not a freshly built one — only the linux job rebuilds it.
          go install -trimpath -ldflags "-s -w" \
            ${{ env.MODULE }}@${{ env.RELEASE_TAG }}

          mkdir -p bin
          cp "$(go env GOPATH)/bin/skywire" bin/skywire
          ./bin/skywire || true
          ./bin/skywire skycoin || true

      - name: Create archive
        run: |
          ARCHIVE_NAME="skywire-${{ env.RELEASE_TAG }}-darwin-amd64"
          mkdir -p dist
          cp bin/skywire dist/
          cd dist
          tar -cvf - skywire | xz -9e -T0 -c > "${ARCHIVE_NAME}.tar.xz"
          shasum -a 256 "${ARCHIVE_NAME}.tar.xz" > "${ARCHIVE_NAME}.tar.xz.sha256"

      - name: Create macOS package
        run: |
          PKG_NAME="skywire-${{ env.RELEASE_TAG }}-darwin-amd64"
          mkdir -p pkg-root/usr/local/bin
          cp bin/skywire pkg-root/usr/local/bin/
          pkgbuild --root pkg-root \
            --identifier com.skycoin.skywire \
            --version "${{ env.RELEASE_TAG }}" \
            --install-location / \
            "dist/${PKG_NAME}.pkg"
          shasum -a 256 "dist/${PKG_NAME}.pkg" > "dist/${PKG_NAME}.pkg.sha256"

      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ env.RELEASE_TAG }}" \
            dist/skywire-${{ env.RELEASE_TAG }}-darwin-amd64.tar.xz \
            dist/skywire-${{ env.RELEASE_TAG }}-darwin-amd64.tar.xz.sha256 \
            dist/skywire-${{ env.RELEASE_TAG }}-darwin-amd64.pkg \
            dist/skywire-${{ env.RELEASE_TAG }}-darwin-amd64.pkg.sha256 \
            --repo ${{ github.repository }} \
            --clobber

  darwin-arm64:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install Requirements
        run: |
          brew install --quiet libusb || brew upgrade --quiet libusb
          brew install --quiet hidapi || brew upgrade --quiet hidapi

      - name: Build skywire
        env:
          GOPROXY: "https://proxy.golang.org,direct"
          GOSUMDB: "off"
          CGO_ENABLED: "1"
          CGO_CFLAGS: -I/opt/homebrew/include -I/opt/homebrew/opt/hidapi/include -I/opt/homebrew/opt/libusb/include
          CGO_LDFLAGS: -L/opt/homebrew/lib -L/opt/homebrew/opt/hidapi/lib -L/opt/homebrew/opt/libusb/lib
        run: |
          # module@tag from the proxy: there is no work tree in this job, so
          # nothing here can dirty the build and no clean-tree gate applies.
          # The flip side is that this binary embeds the COMMITTED js/wasm
          # blob, not a freshly built one — only the linux job rebuilds it.
          go install -trimpath -ldflags "-s -w" \
            ${{ env.MODULE }}@${{ env.RELEASE_TAG }}

          mkdir -p bin
          cp "$(go env GOPATH)/bin/skywire" bin/skywire
          ./bin/skywire || true
          ./bin/skywire skycoin || true

      - name: Create archive
        run: |
          ARCHIVE_NAME="skywire-${{ env.RELEASE_TAG }}-darwin-arm64"
          mkdir -p dist
          cp bin/skywire dist/
          cd dist
          tar -cvf - skywire | xz -9e -T0 -c > "${ARCHIVE_NAME}.tar.xz"
          shasum -a 256 "${ARCHIVE_NAME}.tar.xz" > "${ARCHIVE_NAME}.tar.xz.sha256"

      - name: Create macOS package
        run: |
          PKG_NAME="skywire-${{ env.RELEASE_TAG }}-darwin-arm64"
          mkdir -p pkg-root/usr/local/bin
          cp bin/skywire pkg-root/usr/local/bin/
          pkgbuild --root pkg-root \
            --identifier com.skycoin.skywire \
            --version "${{ env.RELEASE_TAG }}" \
            --install-location / \
            "dist/${PKG_NAME}.pkg"
          shasum -a 256 "dist/${PKG_NAME}.pkg" > "dist/${PKG_NAME}.pkg.sha256"

      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ env.RELEASE_TAG }}" \
            dist/skywire-${{ env.RELEASE_TAG }}-darwin-arm64.tar.xz \
            dist/skywire-${{ env.RELEASE_TAG }}-darwin-arm64.tar.xz.sha256 \
            dist/skywire-${{ env.RELEASE_TAG }}-darwin-arm64.pkg \
            dist/skywire-${{ env.RELEASE_TAG }}-darwin-arm64.pkg.sha256 \
            --repo ${{ github.repository }} \
            --clobber

  windows:
    needs: create-release
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            goarch: amd64
            wix_arch: x64
            wintun_arch: amd64
          - arch: "386"
            goarch: "386"
            wix_arch: x86
            wintun_arch: x86
          - arch: arm64
            goarch: arm64
            wix_arch: x64
            wintun_arch: arm64
    steps:
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install CGO Requirements
        if: matrix.arch == 'amd64'
        shell: pwsh
        run: |
          C:\msys64\usr\bin\bash.exe -lc "pacman -S --noconfirm mingw-w64-x86_64-libusb mingw-w64-x86_64-hidapi mingw-w64-x86_64-pkg-config"
          echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Fetch Windows installer files
        shell: pwsh
        run: |
          $base = "https://raw.githubusercontent.com/${{ github.repository }}/${{ env.RELEASE_TAG }}/scripts/win_installer"
          New-Item -ItemType Directory -Force -Path "scripts\win_installer\images"
          # Retry each fetch — raw.github rate-limits (429) / lags right after a
          # tag push, and Invoke-WebRequest throws on that, failing the release.
          function Fetch($rel) {
            $url = "$base/$rel"
            $out = "scripts\win_installer\" + ($rel -replace '/', '\')
            for ($i = 1; $i -le 6; $i++) {
              try { Invoke-WebRequest $url -OutFile $out -UseBasicParsing; return }
              catch { Write-Host "fetch $rel attempt $i failed: $_"; Start-Sleep -Seconds (4 * $i) }
            }
            throw "failed to fetch $rel after 6 attempts"
          }
          foreach ($f in @("Product.wxs","UI.wxs","skywire.bat","skywire-autoconfig.bat","images/Banner.png","images/Dialog.png","images/ico.ico")) {
            Fetch $f
          }

      - name: Build skywire
        env:
          GOPROXY: "https://proxy.golang.org,direct"
          GOSUMDB: "off"
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
        shell: pwsh
        run: |
          # Compile from repo root (not cmd/release) because cmd/release imports
          # hardware wallet which requires libusb/libhidapi DLLs on Windows.
          # The hw wallet is built separately below with the required DLLs.
          # module@tag from the proxy: no work tree in this job, so no
          # clean-tree gate applies (see the linux job).
          go install -trimpath -ldflags "-s -w" "${{ env.MODULE }}@${{ env.RELEASE_TAG }}"

          New-Item -ItemType Directory -Force -Path "bin"
          $gopath = go env GOPATH
          $crossPath = "$gopath\bin\windows_${{ matrix.goarch }}\skywire.exe"
          $nativePath = "$gopath\bin\skywire.exe"

          if (Test-Path $crossPath) {
            Copy-Item $crossPath "bin\skywire.exe"
          } elseif (Test-Path $nativePath) {
            Copy-Item $nativePath "bin\skywire.exe"
          } else {
            Write-Error "Binary not found"
            Get-ChildItem -Recurse "$gopath\bin" -Filter "skywire*"
            exit 1
          }

          # Verify binary (amd64 and 386 can run on amd64 runner)
          if ("${{ matrix.arch }}" -ne "arm64") {
            & "bin\skywire.exe"
            & "bin\skywire.exe" skycoin
          }

      - name: Build hardware wallet utility
        if: matrix.arch == 'amd64'
        env:
          GOPROXY: "https://proxy.golang.org,direct"
          GOSUMDB: "off"
          CGO_ENABLED: "1"
          CGO_CFLAGS: -IC:/msys64/mingw64/include -IC:/msys64/mingw64/include/libusb-1.0
          CGO_LDFLAGS: -LC:/msys64/mingw64/lib
          GOOS: windows
          GOARCH: amd64
        shell: pwsh
        run: |
          go install -trimpath -ldflags "-s -w" github.com/skycoin/skycoin/cmd/hardware-wallet@latest

          $gopath = go env GOPATH
          $hwPath = "$gopath\bin\hardware-wallet.exe"
          if (Test-Path $hwPath) {
            Copy-Item $hwPath "bin\skyhw.exe"
          } else {
            Write-Warning "Hardware wallet binary not found, skipping"
          }

      - name: Create archive
        shell: pwsh
        run: |
          $ARCHIVE_NAME = "skywire-${{ env.RELEASE_TAG }}-windows-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path "dist"
          Copy-Item "bin\skywire.exe" "dist\"

          # Include hardware wallet binary and required DLLs if present
          if (Test-Path "bin\skyhw.exe") {
            Copy-Item "bin\skyhw.exe" "dist\"
            # Bundle required DLLs for the CGO hardware wallet binary
            $dllDir = "C:\msys64\mingw64\bin"
            foreach ($dll in @("libhidapi-0.dll", "libusb-1.0.dll")) {
              $dllPath = "$dllDir\$dll"
              if (Test-Path $dllPath) {
                Copy-Item $dllPath "dist\"
              }
            }
          }

          Compress-Archive -Path "dist\*" -DestinationPath "dist\$ARCHIVE_NAME.zip" -CompressionLevel Optimal
          Get-FileHash "dist\$ARCHIVE_NAME.zip" -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $ARCHIVE_NAME.zip" } > "dist\$ARCHIVE_NAME.zip.sha256"
          Get-ChildItem "dist\" -Exclude "*.zip","*.sha256" | Remove-Item

      - name: Create MSI installer
        shell: pwsh
        run: |
          $MSI_NAME = "skywire-installer-${{ env.RELEASE_TAG }}-windows-${{ matrix.arch }}"
          $VERSION = "${{ env.RELEASE_TAG }}" -replace '(^v|-.+$)', ''

          # Download WiX 3.11
          Invoke-WebRequest "https://github.com/wixtoolset/wix3/releases/download/wix3112rtm/wix311-binaries.zip" -OutFile wix.zip
          Expand-Archive wix.zip -DestinationPath wix

          # Download wintun
          Invoke-WebRequest "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile wintun.zip
          Expand-Archive wintun.zip -DestinationPath wintun_extracted

          # Prepare build directory
          Set-Location scripts\win_installer
          New-Item -ItemType Directory -Force -Path "build\apps"
          Copy-Item ..\..\bin\skywire.exe build\skywire.exe
          Copy-Item skywire.bat build\skywire.bat
          Copy-Item skywire-autoconfig.bat build\skywire-autoconfig.bat
          New-Item -ItemType File -Path "build\new.update"
          Copy-Item ..\..\wintun_extracted\wintun\bin\${{ matrix.wintun_arch }}\wintun.dll build\wintun.dll

          # Update version in Product.wxs
          $productWxs = Get-Content -Path Product.wxs -Raw
          $productWxs = $productWxs -replace "skywireVersion", $VERSION
          Set-Content -Path Product.wxs -Value $productWxs

          # Build MSI. -ext WixUtilExtension on candle too (not just light) so the
          # <util:CloseApplication> element in Product.wxs — which stops a running
          # skywire so an upgrade isn't blocked by locked files — compiles.
          ..\..\wix\candle.exe -ext WixUtilExtension UI.wxs Product.wxs -arch ${{ matrix.wix_arch }}
          ..\..\wix\light.exe -ext WixUIExtension -ext WixUtilExtension -sacl -spdb -out skywire.msi UI.wixobj Product.wixobj
          Move-Item skywire.msi ..\..\dist\$MSI_NAME.msi

          Set-Location ..\..
          Get-FileHash "dist\$MSI_NAME.msi" -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $MSI_NAME.msi" } > "dist\$MSI_NAME.msi.sha256"

      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $files = @(
            "dist\skywire-${{ env.RELEASE_TAG }}-windows-${{ matrix.arch }}.zip",
            "dist\skywire-${{ env.RELEASE_TAG }}-windows-${{ matrix.arch }}.zip.sha256"
          )
          $msi = "dist\skywire-installer-${{ env.RELEASE_TAG }}-windows-${{ matrix.arch }}.msi"
          $msiSha = "dist\skywire-installer-${{ env.RELEASE_TAG }}-windows-${{ matrix.arch }}.msi.sha256"
          if (Test-Path $msi) {
            $files += $msi
            $files += $msiSha
          }
          gh release upload "${{ env.RELEASE_TAG }}" @files --repo ${{ github.repository }} --clobber

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Build and push Docker image
        run: |
          make docker-push-test
          # Also tag with the release version
          docker tag skycoin/skywire:test "skycoin/skywire:${{ env.RELEASE_TAG }}"
          docker push "skycoin/skywire:${{ env.RELEASE_TAG }}"
        shell: bash

  create-checksums:
    needs: [linux, darwin-amd64, darwin-arm64, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all checksums and create combined file
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ env.RELEASE_TAG }}" --repo ${{ github.repository }} --pattern "*.sha256"
          cat *.sha256 > checksums.txt

      - name: Upload combined checksums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ env.RELEASE_TAG }}" checksums.txt \
            --repo ${{ github.repository }} \
            --clobber

  publish-release:
    # create-release publishes the release immediately (no --draft) so it is
    # never left stranded as a draft when one platform job fails — which is
    # what happened to v1.3.62/v1.3.63 when the windows MSI job broke and the
    # old draft-gating publish step (needs all jobs) never ran. This job is a
    # belt-and-suspenders final pass: it runs regardless of upstream job
    # outcome (if: always()) and re-asserts the published state.
    needs: [linux, darwin-amd64, darwin-arm64, windows, docker, create-checksums]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Ensure the release is published
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ env.RELEASE_TAG }}" \
            --repo ${{ github.repository }} \
            --draft=false
