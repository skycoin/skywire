name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

env:
  GO_VERSION: '1.27.0'
  MUSL_RELEASE: 'v1.3.29'
  MODULE: github.com/skycoin/skywire

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo ${{ github.repository }} \
            --title "${{ github.ref_name }}" \
            --generate-notes || true

  linux:
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      # Don't let one arch's transient failure (e.g. a flaky module fetch)
      # cancel the other five — each arch uploads independently.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            goarch: amd64
            toolchain: x86_64-linux-musl
            toolchain_file: x86_64-linux-musl-cross.tgz
          - arch: arm64
            goarch: arm64
            toolchain: aarch64-linux-musl
            toolchain_file: aarch64-linux-musl-cross.tgz
          - arch: arm
            goarch: arm
            goarm: "6"
            toolchain: arm-linux-musleabi
            toolchain_file: arm-linux-musleabi-cross.tgz
          - arch: armhf
            goarch: arm
            goarm: "7"
            toolchain: arm-linux-musleabihf
            toolchain_file: arm-linux-musleabihf-cross.tgz
          - arch: 386
            goarch: "386"
            toolchain: i686-linux-musl
            toolchain_file: i686-linux-musl-cross.tgz
          - arch: riscv64
            goarch: riscv64
            toolchain: riscv64-linux-musl
            toolchain_file: riscv64-linux-musl-cross.tgz
    steps:
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y wget tar xz-utils libusb-1.0-0-dev autoconf automake libtool

      - name: Fetch build-libusb-musl.sh
        run: |
          # -f fails on HTTP error (so a raw.github 404/429 right after the tag
          # push isn't saved as an error page and run as a shell script); retry
          # to ride out raw.github propagation lag / rate-limiting.
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 4 \
            "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/ci_scripts/build-libusb-musl.sh" \
            -o build-libusb-musl.sh
          chmod +x build-libusb-musl.sh

      - name: Cache musl toolchain
        id: cache-toolchain
        uses: actions/cache@v6
        with:
          path: musl-data
          key: musl-${{ env.MUSL_RELEASE }}-${{ matrix.toolchain }}

      - name: Download musl toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p musl-data
          wget -q "https://github.com/skycoin/skywire/releases/download/${{ env.MUSL_RELEASE }}/${{ matrix.toolchain_file }}"
          tar -xzf "${{ matrix.toolchain_file }}" -C ./musl-data
          rm "${{ matrix.toolchain_file }}"

      - name: Build libusb for musl target
        run: ./build-libusb-musl.sh ${{ matrix.arch }} ${{ matrix.toolchain }} ./musl-data/${{ matrix.toolchain }}-cross

      - name: Build skywire release binary
        env:
          GOPROXY: "https://proxy.golang.org,direct"
          GOSUMDB: "off"
          CGO_ENABLED: "1"
          CC: ${{ github.workspace }}/musl-data/${{ matrix.toolchain }}-cross/bin/${{ matrix.toolchain }}-gcc
          PKG_CONFIG_PATH: ${{ github.workspace }}/musl-data/${{ matrix.toolchain }}-cross/${{ matrix.toolchain }}/lib/pkgconfig
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          go install -tags="cgo,withoutsystray" -trimpath \
            -ldflags "-s -w -linkmode external -extldflags '-static' -buildid=" \
            ${{ env.MODULE }}@${{ github.ref_name }}

          mkdir -p bin
          GOPATH_BIN="$(go env GOPATH)/bin"
          if [ -f "${GOPATH_BIN}/linux_${{ matrix.goarch }}/skywire" ]; then
            cp "${GOPATH_BIN}/linux_${{ matrix.goarch }}/skywire" bin/skywire
          elif [ -f "${GOPATH_BIN}/skywire" ]; then
            cp "${GOPATH_BIN}/skywire" bin/skywire
          else
            echo "Binary not found in expected locations"
            find "${GOPATH_BIN}" -name "skywire*" -type f
            exit 1
          fi

          # Verify binary on native arch
          if [ "${{ matrix.arch }}" = "amd64" ]; then
            ./bin/skywire || true
            ./bin/skywire skycoin || true
          fi

      - name: Create archive
        run: |
          ARCHIVE_NAME="skywire-${{ github.ref_name }}-linux-${{ matrix.arch }}"
          mkdir -p dist
          cp bin/skywire dist/
          cd dist
          tar -cvf - skywire | xz -9e -T0 -c > "${ARCHIVE_NAME}.tar.xz"
          sha256sum "${ARCHIVE_NAME}.tar.xz" > "${ARCHIVE_NAME}.tar.xz.sha256"

      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            dist/skywire-${{ github.ref_name }}-linux-${{ matrix.arch }}.tar.xz \
            dist/skywire-${{ github.ref_name }}-linux-${{ matrix.arch }}.tar.xz.sha256 \
            --repo ${{ github.repository }} \
            --clobber

  darwin-amd64:
    needs: create-release
    runs-on: macos-15-intel
    steps:
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install Requirements
        run: |
          brew install --quiet libusb || brew upgrade --quiet libusb
          brew install --quiet hidapi || brew upgrade --quiet hidapi

      - name: Build skywire
        env:
          GOPROXY: "https://proxy.golang.org,direct"
          GOSUMDB: "off"
          CGO_ENABLED: "1"
          CGO_CFLAGS: -I/usr/local/include -I/opt/homebrew/include -I/opt/homebrew/opt/hidapi/include -I/opt/homebrew/opt/libusb/include
          CGO_LDFLAGS: -L/usr/local/lib -L/opt/homebrew/lib -L/opt/homebrew/opt/hidapi/lib -L/opt/homebrew/opt/libusb/lib
        run: |
          go install -trimpath -ldflags "-s -w" \
            ${{ env.MODULE }}@${{ github.ref_name }}

          mkdir -p bin
          cp "$(go env GOPATH)/bin/skywire" bin/skywire
          ./bin/skywire || true
          ./bin/skywire skycoin || true

      - name: Create archive
        run: |
          ARCHIVE_NAME="skywire-${{ github.ref_name }}-darwin-amd64"
          mkdir -p dist
          cp bin/skywire dist/
          cd dist
          tar -cvf - skywire | xz -9e -T0 -c > "${ARCHIVE_NAME}.tar.xz"
          shasum -a 256 "${ARCHIVE_NAME}.tar.xz" > "${ARCHIVE_NAME}.tar.xz.sha256"

      - name: Create macOS package
        run: |
          PKG_NAME="skywire-${{ github.ref_name }}-darwin-amd64"
          mkdir -p pkg-root/usr/local/bin
          cp bin/skywire pkg-root/usr/local/bin/
          pkgbuild --root pkg-root \
            --identifier com.skycoin.skywire \
            --version "${{ github.ref_name }}" \
            --install-location / \
            "dist/${PKG_NAME}.pkg"
          shasum -a 256 "dist/${PKG_NAME}.pkg" > "dist/${PKG_NAME}.pkg.sha256"

      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            dist/skywire-${{ github.ref_name }}-darwin-amd64.tar.xz \
            dist/skywire-${{ github.ref_name }}-darwin-amd64.tar.xz.sha256 \
            dist/skywire-${{ github.ref_name }}-darwin-amd64.pkg \
            dist/skywire-${{ github.ref_name }}-darwin-amd64.pkg.sha256 \
            --repo ${{ github.repository }} \
            --clobber

  darwin-arm64:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install Requirements
        run: |
          brew install --quiet libusb || brew upgrade --quiet libusb
          brew install --quiet hidapi || brew upgrade --quiet hidapi

      - name: Build skywire
        env:
          GOPROXY: "https://proxy.golang.org,direct"
          GOSUMDB: "off"
          CGO_ENABLED: "1"
          CGO_CFLAGS: -I/opt/homebrew/include -I/opt/homebrew/opt/hidapi/include -I/opt/homebrew/opt/libusb/include
          CGO_LDFLAGS: -L/opt/homebrew/lib -L/opt/homebrew/opt/hidapi/lib -L/opt/homebrew/opt/libusb/lib
        run: |
          go install -trimpath -ldflags "-s -w" \
            ${{ env.MODULE }}@${{ github.ref_name }}

          mkdir -p bin
          cp "$(go env GOPATH)/bin/skywire" bin/skywire
          ./bin/skywire || true
          ./bin/skywire skycoin || true

      - name: Create archive
        run: |
          ARCHIVE_NAME="skywire-${{ github.ref_name }}-darwin-arm64"
          mkdir -p dist
          cp bin/skywire dist/
          cd dist
          tar -cvf - skywire | xz -9e -T0 -c > "${ARCHIVE_NAME}.tar.xz"
          shasum -a 256 "${ARCHIVE_NAME}.tar.xz" > "${ARCHIVE_NAME}.tar.xz.sha256"

      - name: Create macOS package
        run: |
          PKG_NAME="skywire-${{ github.ref_name }}-darwin-arm64"
          mkdir -p pkg-root/usr/local/bin
          cp bin/skywire pkg-root/usr/local/bin/
          pkgbuild --root pkg-root \
            --identifier com.skycoin.skywire \
            --version "${{ github.ref_name }}" \
            --install-location / \
            "dist/${PKG_NAME}.pkg"
          shasum -a 256 "dist/${PKG_NAME}.pkg" > "dist/${PKG_NAME}.pkg.sha256"

      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            dist/skywire-${{ github.ref_name }}-darwin-arm64.tar.xz \
            dist/skywire-${{ github.ref_name }}-darwin-arm64.tar.xz.sha256 \
            dist/skywire-${{ github.ref_name }}-darwin-arm64.pkg \
            dist/skywire-${{ github.ref_name }}-darwin-arm64.pkg.sha256 \
            --repo ${{ github.repository }} \
            --clobber

  windows:
    needs: create-release
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            goarch: amd64
            wix_arch: x64
            wintun_arch: amd64
          - arch: "386"
            goarch: "386"
            wix_arch: x86
            wintun_arch: x86
          - arch: arm64
            goarch: arm64
            wix_arch: x64
            wintun_arch: arm64
    steps:
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install CGO Requirements
        if: matrix.arch == 'amd64'
        shell: pwsh
        run: |
          C:\msys64\usr\bin\bash.exe -lc "pacman -S --noconfirm mingw-w64-x86_64-libusb mingw-w64-x86_64-hidapi mingw-w64-x86_64-pkg-config"
          echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Fetch Windows installer files
        shell: pwsh
        run: |
          $base = "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/scripts/win_installer"
          New-Item -ItemType Directory -Force -Path "scripts\win_installer\images"
          # Retry each fetch — raw.github rate-limits (429) / lags right after a
          # tag push, and Invoke-WebRequest throws on that, failing the release.
          function Fetch($rel) {
            $url = "$base/$rel"
            $out = "scripts\win_installer\" + ($rel -replace '/', '\')
            for ($i = 1; $i -le 6; $i++) {
              try { Invoke-WebRequest $url -OutFile $out -UseBasicParsing; return }
              catch { Write-Host "fetch $rel attempt $i failed: $_"; Start-Sleep -Seconds (4 * $i) }
            }
            throw "failed to fetch $rel after 6 attempts"
          }
          foreach ($f in @("Product.wxs","UI.wxs","skywire.bat","skywire-autoconfig.bat","images/Banner.png","images/Dialog.png","images/ico.ico")) {
            Fetch $f
          }

      - name: Build skywire
        env:
          GOPROXY: "https://proxy.golang.org,direct"
          GOSUMDB: "off"
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
        shell: pwsh
        run: |
          # Compile from repo root (not cmd/release) because cmd/release imports
          # hardware wallet which requires libusb/libhidapi DLLs on Windows.
          # The hw wallet is built separately below with the required DLLs.
          go install -trimpath -ldflags "-s -w" "${{ env.MODULE }}@${{ github.ref_name }}"

          New-Item -ItemType Directory -Force -Path "bin"
          $gopath = go env GOPATH
          $crossPath = "$gopath\bin\windows_${{ matrix.goarch }}\skywire.exe"
          $nativePath = "$gopath\bin\skywire.exe"

          if (Test-Path $crossPath) {
            Copy-Item $crossPath "bin\skywire.exe"
          } elseif (Test-Path $nativePath) {
            Copy-Item $nativePath "bin\skywire.exe"
          } else {
            Write-Error "Binary not found"
            Get-ChildItem -Recurse "$gopath\bin" -Filter "skywire*"
            exit 1
          }

          # Verify binary (amd64 and 386 can run on amd64 runner)
          if ("${{ matrix.arch }}" -ne "arm64") {
            & "bin\skywire.exe"
            & "bin\skywire.exe" skycoin
          }

      - name: Build hardware wallet utility
        if: matrix.arch == 'amd64'
        env:
          GOPROXY: "https://proxy.golang.org,direct"
          GOSUMDB: "off"
          CGO_ENABLED: "1"
          CGO_CFLAGS: -IC:/msys64/mingw64/include -IC:/msys64/mingw64/include/libusb-1.0
          CGO_LDFLAGS: -LC:/msys64/mingw64/lib
          GOOS: windows
          GOARCH: amd64
        shell: pwsh
        run: |
          go install -trimpath -ldflags "-s -w" github.com/skycoin/skycoin/cmd/hardware-wallet@latest

          $gopath = go env GOPATH
          $hwPath = "$gopath\bin\hardware-wallet.exe"
          if (Test-Path $hwPath) {
            Copy-Item $hwPath "bin\skyhw.exe"
          } else {
            Write-Warning "Hardware wallet binary not found, skipping"
          }

      - name: Create archive
        shell: pwsh
        run: |
          $ARCHIVE_NAME = "skywire-${{ github.ref_name }}-windows-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path "dist"
          Copy-Item "bin\skywire.exe" "dist\"

          # Include hardware wallet binary and required DLLs if present
          if (Test-Path "bin\skyhw.exe") {
            Copy-Item "bin\skyhw.exe" "dist\"
            # Bundle required DLLs for the CGO hardware wallet binary
            $dllDir = "C:\msys64\mingw64\bin"
            foreach ($dll in @("libhidapi-0.dll", "libusb-1.0.dll")) {
              $dllPath = "$dllDir\$dll"
              if (Test-Path $dllPath) {
                Copy-Item $dllPath "dist\"
              }
            }
          }

          Compress-Archive -Path "dist\*" -DestinationPath "dist\$ARCHIVE_NAME.zip" -CompressionLevel Optimal
          Get-FileHash "dist\$ARCHIVE_NAME.zip" -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $ARCHIVE_NAME.zip" } > "dist\$ARCHIVE_NAME.zip.sha256"
          Get-ChildItem "dist\" -Exclude "*.zip","*.sha256" | Remove-Item

      - name: Create MSI installer
        shell: pwsh
        run: |
          $MSI_NAME = "skywire-installer-${{ github.ref_name }}-windows-${{ matrix.arch }}"
          $VERSION = "${{ github.ref_name }}" -replace '(^v|-.+$)', ''

          # Download WiX 3.11
          Invoke-WebRequest "https://github.com/wixtoolset/wix3/releases/download/wix3112rtm/wix311-binaries.zip" -OutFile wix.zip
          Expand-Archive wix.zip -DestinationPath wix

          # Download wintun
          Invoke-WebRequest "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile wintun.zip
          Expand-Archive wintun.zip -DestinationPath wintun_extracted

          # Prepare build directory
          Set-Location scripts\win_installer
          New-Item -ItemType Directory -Force -Path "build\apps"
          Copy-Item ..\..\bin\skywire.exe build\skywire.exe
          Copy-Item skywire.bat build\skywire.bat
          Copy-Item skywire-autoconfig.bat build\skywire-autoconfig.bat
          New-Item -ItemType File -Path "build\new.update"
          Copy-Item ..\..\wintun_extracted\wintun\bin\${{ matrix.wintun_arch }}\wintun.dll build\wintun.dll

          # Update version in Product.wxs
          $productWxs = Get-Content -Path Product.wxs -Raw
          $productWxs = $productWxs -replace "skywireVersion", $VERSION
          Set-Content -Path Product.wxs -Value $productWxs

          # Build MSI. -ext WixUtilExtension on candle too (not just light) so the
          # <util:CloseApplication> element in Product.wxs — which stops a running
          # skywire so an upgrade isn't blocked by locked files — compiles.
          ..\..\wix\candle.exe -ext WixUtilExtension UI.wxs Product.wxs -arch ${{ matrix.wix_arch }}
          ..\..\wix\light.exe -ext WixUIExtension -ext WixUtilExtension -sacl -spdb -out skywire.msi UI.wixobj Product.wixobj
          Move-Item skywire.msi ..\..\dist\$MSI_NAME.msi

          Set-Location ..\..
          Get-FileHash "dist\$MSI_NAME.msi" -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $MSI_NAME.msi" } > "dist\$MSI_NAME.msi.sha256"

      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $files = @(
            "dist\skywire-${{ github.ref_name }}-windows-${{ matrix.arch }}.zip",
            "dist\skywire-${{ github.ref_name }}-windows-${{ matrix.arch }}.zip.sha256"
          )
          $msi = "dist\skywire-installer-${{ github.ref_name }}-windows-${{ matrix.arch }}.msi"
          $msiSha = "dist\skywire-installer-${{ github.ref_name }}-windows-${{ matrix.arch }}.msi.sha256"
          if (Test-Path $msi) {
            $files += $msi
            $files += $msiSha
          }
          gh release upload "${{ github.ref_name }}" @files --repo ${{ github.repository }} --clobber

  # TinyGo build of the full browser wasm-visor, compiled with the fork
  # (github.com/0magnet/tinygo) whose net/http-on-js support is what makes the
  # visor compile. Produces a ~7 MB / ~2.9 MB-gzip blob (vs ~43 MB / ~9.5 MB for
  # standard Go js/wasm). Uploaded as a distinct "-wasm-visor-tinygo" archive.
  wasm-visor-tinygo:
    needs: create-release
    runs-on: ubuntu-latest
    env:
      TINYGO_REPO: https://github.com/0magnet/tinygo.git
      TINYGO_BRANCH: develop
    steps:
      - name: Checkout skywire
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install LLVM 22 (apt.llvm.org)
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y llvm-22-dev libclang-22-dev clang-22 lld-22

      - name: Build the TinyGo fork
        run: |
          git clone --branch "${TINYGO_BRANCH}" --recurse-submodules --depth 1 \
            "${TINYGO_REPO}" "${GITHUB_WORKSPACE}/tinygo-fork"
          cd "${GITHUB_WORKSPACE}/tinygo-fork"
          go build -tags llvm22 -o "${GITHUB_WORKSPACE}/tinygo-fork/build/tinygo" .
          ./build/tinygo version

      - name: Build the wasm-visor with the TinyGo fork
        env:
          TINYGOROOT: ${{ github.workspace }}/tinygo-fork
        run: |
          make tinygo-wasm-visor TINYGO="${GITHUB_WORKSPACE}/tinygo-fork/build/tinygo"
          ls -la build/wasm-visor/
          # sanity: the module must start with the wasm magic
          test "$(head -c4 build/wasm-visor/wasm-visor.wasm | xxd -p)" = "0061736d"

      - name: Create archive
        run: |
          ARCHIVE_NAME="skywire-${{ github.ref_name }}-wasm-visor-tinygo"
          mkdir -p dist
          gzip -9 -n -c build/wasm-visor/wasm-visor.wasm > "build/wasm-visor/wasm-visor.wasm.gz"
          tar -C build/wasm-visor -czvf "dist/${ARCHIVE_NAME}.tar.gz" .
          sha256sum "dist/${ARCHIVE_NAME}.tar.gz" > "dist/${ARCHIVE_NAME}.tar.gz.sha256"

      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            dist/skywire-${{ github.ref_name }}-wasm-visor-tinygo.tar.gz \
            dist/skywire-${{ github.ref_name }}-wasm-visor-tinygo.tar.gz.sha256 \
            --repo ${{ github.repository }} \
            --clobber

  # Android APK + AAB, signed and attached to the SAME `v*` release as every
  # other artifact. This replaces the retired android-release.yml, which minted
  # a separate `mobile-vX.Y.Z` tag/release; the version is now the `v*` tag.
  android:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          fetch-tags: true

      # Publishing an unsigned APK/AAB would ship a file that cannot be
      # installed (or, for the AAB, uploaded to Play). The debug-signed build is
      # debuggable and must never reach users of an app that holds wallet seeds,
      # so an unsigned build is the error here, not a fallback.
      - name: Require signing secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE" ]   || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$STORE_PASS" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ]  || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$KEY_PASS" ]   || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo ""
            echo "Create the signing key ONCE and keep it forever — Android"
            echo "refuses to upgrade an app signed with a different key, so"
            echo "this key is what lets every future release reach the people"
            echo "who installed this one. Back it up somewhere you will still"
            echo "have in five years."
            echo ""
            echo "  keytool -genkeypair -v -keystore skywire-release.jks \\"
            echo "    -alias skywire -keyalg RSA -keysize 4096 -validity 10000"
            echo ""
            echo "  gh secret set ANDROID_KEYSTORE_BASE64 < <(base64 -i skywire-release.jks)"
            echo "  gh secret set ANDROID_KEYSTORE_PASSWORD"
            echo "  gh secret set ANDROID_KEY_ALIAS       # 'skywire' above"
            echo "  gh secret set ANDROID_KEY_PASSWORD"
            exit 1
          fi

      # vX.Y.Z -> X.Y.Z. The Android versionCode is NOT computed here: `make
      # android-apk`/`android-aab` derive it, so the tag and a local build
      # cannot disagree. The shape is validated up front so a `v*` tag that
      # cannot map to an Android version fails in seconds instead of after the
      # payload build.
      - name: Derive Android version from tag
        id: version
        run: |
          raw="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$raw" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '${GITHUB_REF_NAME}' is not vX.Y.Z — cannot derive an Android version"
            exit 1
          fi
          rest=${raw#*.}; minor=${rest%%.*}; patch=${rest#*.}
          if [ "$minor" -gt 99 ] || [ "$patch" -gt 99 ]; then
            echo "::error::minor/patch must be <= 99 to keep the Android versionCode monotonic"
            exit 1
          fi
          if [ "$raw" = "0.0.0" ]; then
            echo "::error::0.0.0 derives versionCode 0; Android requires a positive integer (lowest is 0.0.1)"
            exit 1
          fi
          echo "name=$raw" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # The NDK lane, not the pure-Go one. cgo builds resolve DNS through
      # bionic's getaddrinfo, which is the only path that honours the phone's
      # actual resolver configuration — the pure-Go resolver is fine for CI and
      # the emulator but is not what should ship.
      # ANDROID_NDK_LATEST_HOME is set by the runner image, which means it is a
      # shell variable and NOT in the `env` context — ${{ env.X }} would expand
      # to empty and the Makefile would stop on its own guard.
      - name: Build Go payload (NDK/cgo release lane)
        run: |
          test -n "$ANDROID_NDK_LATEST_HOME" || {
            echo "::error::runner exposes no Android NDK"; exit 1; }
          ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" make android-mobile-ndk

      - name: Decode keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"

      # Through make, so these are the same commands a maintainer runs locally.
      # ANDROID_JAVA_HOME points at the runner's JDK instead of the Makefile's
      # macOS default.
      - name: Assemble signed release APK + AAB
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          make android-apk android-aab \
            APK_VERSION="${{ steps.version.outputs.name }}" \
            ANDROID_JAVA_HOME="$JAVA_HOME"

      # An unsigned artifact reaching this point would mean the signingConfig
      # silently did not apply — catch it here rather than after someone
      # downloads a file that will not install (APK) or upload (AAB).
      - name: Verify signatures and stage assets
        run: |
          ref="${GITHUB_REF_NAME}"
          apk=android/app/build/outputs/apk/release/app-release.apk
          aab=android/app/build/outputs/bundle/release/app-release.aab
          test -f "$apk" || { echo "::error::$apk not found"; exit 1; }
          test -f "$aab" || { echo "::error::$aab not found"; exit 1; }
          # Newest build-tools present, rather than a pinned version that
          # silently disappears the next time the runner image is rebuilt.
          signer=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner \
                     2>/dev/null | sort -V | tail -n1)
          test -n "$signer" || { echo "::error::apksigner not found"; exit 1; }
          "$signer" verify --print-certs "$apk" \
            || { echo "::error::APK is not signed"; exit 1; }
          # AABs carry a v1 (jar) signature, which apksigner does not read —
          # jarsigner is the right verifier for the bundle.
          jarsigner -verify "$aab" | grep -q 'jar verified' \
            || { echo "::error::AAB is not signed"; exit 1; }
          apk_out="skywire-${ref}-android-arm64.apk"
          aab_out="skywire-${ref}-android-arm64.aab"
          mv "$apk" "$apk_out"
          mv "$aab" "$aab_out"
          sha256sum "$apk_out" > "$apk_out.sha256"
          sha256sum "$aab_out" > "$aab_out.sha256"

      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ref="${GITHUB_REF_NAME}"
          gh release upload "$ref" \
            "skywire-${ref}-android-arm64.apk" \
            "skywire-${ref}-android-arm64.apk.sha256" \
            "skywire-${ref}-android-arm64.aab" \
            "skywire-${ref}-android-arm64.aab.sha256" \
            --repo "${{ github.repository }}" \
            --clobber

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Build and push Docker image
        run: |
          make docker-push-test
          # Also tag with the release version
          docker tag skycoin/skywire:test "skycoin/skywire:${{ github.ref_name }}"
          docker push "skycoin/skywire:${{ github.ref_name }}"
        shell: bash

  create-checksums:
    needs: [linux, darwin-amd64, darwin-arm64, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all checksums and create combined file
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ github.ref_name }}" --repo ${{ github.repository }} --pattern "*.sha256"
          cat *.sha256 > checksums.txt

      - name: Upload combined checksums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" checksums.txt \
            --repo ${{ github.repository }} \
            --clobber

  publish-release:
    # create-release publishes the release immediately (no --draft) so it is
    # never left stranded as a draft when one platform job fails — which is
    # what happened to v1.3.62/v1.3.63 when the windows MSI job broke and the
    # old draft-gating publish step (needs all jobs) never ran. This job is a
    # belt-and-suspenders final pass: it runs regardless of upstream job
    # outcome (if: always()) and re-asserts the published state.
    needs: [linux, darwin-amd64, darwin-arm64, windows, docker, create-checksums]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Ensure the release is published
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" \
            --repo ${{ github.repository }} \
            --draft=false
