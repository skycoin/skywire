on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  push:
    branches: [develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:
name: Test

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: go.sum

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: Install Dependencies
        shell: bash
        run: make install-shellcheck

      - name: Lint Shell Scripts
        run: make lint-shell

      # golangci-lint already ran above (pinned, cached). check-ci skips the
      # redundant second golangci-lint run but keeps go vet + config-gen smoke
      # + the test suite.
      - name: Check Format and Run Tests
        run: make check-ci

  # e2e runs as its own job so it executes in parallel with the linux check
  # job above instead of serially after it — cutting overall wall-clock.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: go.sum

      - name: Setup SSH Key, Build and Run E2E
        shell: bash
        run: |
          set -e
          sudo ./ci_scripts/create-ip-aliases.sh
          make e2e-build
          make e2e-run
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Test E2E
        run: make e2e-test

      - name: Clean E2E
        run: make e2e-stop

  darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: go.sum

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: Checking Format and Testing
        run: |
          GO111MODULE=on golangci-lint run -c .golangci.yml ./...
          go run . --help
          go run . cli config gen -dnw
          go run . cli config gen --nofetch -nw
          GO111MODULE=on go test -cover -timeout=25m -mod=vendor -tags 'no_ci' ./internal/... ./pkg/... ./cmd/skywire-cli/commands/config/...

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: go.sum

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: Install Requirements
        shell: pwsh
        run: choco install make

      - name: Checking (lint + test)
        run: |
          $env:GO111MODULE='on'
          make check-windows
        shell: powershell

  # Native (no-Docker) client-side e2e on macOS: runs a small skywire deployment
  # + two visors as host processes on 127.0.0.1 and exercises the CLIENT runtime
  # (visor, hypervisor, skysocks-client, vpn-client) — the OS-specific code the
  # Linux Docker `e2e` job can't reach. See internal/nativee2e. The test binary is
  # compiled as the runner user, then run under sudo so vpn-client/vpn-server can
  # create TUN devices and set up pf NAT (macOS vpn-server: os_server_darwin.go).
  e2e-darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: go.sum

      - name: Build binaries + compile native e2e
        run: |
          set -e
          mkdir -p ./_nbin
          go build -mod=vendor -o ./_nbin/skywire ./cmd/skywire
          for a in skychat skysocks skysocks-client vpn-server vpn-client; do
            go build -mod=vendor -o ./_nbin/$a ./cmd/apps/$a
          done
          go test -c -mod=vendor -tags client_e2e -o ./nativee2e.test ./internal/nativee2e

      - name: Run native client e2e (root for vpn TUN + pf)
        run: sudo env SKYWIRE_NATIVEE2E_BIN="$PWD/_nbin" ./nativee2e.test -test.v -test.timeout=25m

  # Native client-side e2e on Windows: visor + hypervisor + skysocks-client +
  # vpn-client/vpn-server (WinTUN + WinNAT, os_server_windows.go). The runner is
  # admin, so TUN creation + NAT work; wintun.dll is provisioned next to the
  # binary since it isn't embedded in the wintun Go binding.
  e2e-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: go.sum

      - name: Build binaries + provision WinTUN driver
        shell: pwsh
        run: |
          $env:GO111MODULE='on'
          New-Item -ItemType Directory -Force -Path ./_nbin | Out-Null
          go build -mod=vendor -o ./_nbin/skywire.exe ./cmd/skywire
          foreach ($a in 'skychat','skysocks','skysocks-client','vpn-server','vpn-client') {
            go build -mod=vendor -o ./_nbin/$a.exe ./cmd/apps/$a
          }
          # WinTUN driver DLL is NOT embedded in the golang.zx2c4.com/wintun
          # binding (it LoadLibraryEx's wintun.dll from the app dir / System32).
          # The visor runs vpn-client/vpn-server in-process, so the DLL must sit
          # next to skywire.exe (= _nbin) for TUN creation to work. Zip layout:
          # wintun/bin/amd64/wintun.dll. Try the skywire mirror first, then upstream.
          $urls = @('https://freeshell.de/~mrpalide/wintun-0.14.1.zip','https://deb.skywire.dev/wintun-0.14.1.zip','https://www.wintun.net/builds/wintun-0.14.1.zip')
          $ok = $false
          foreach ($u in $urls) {
            try { Invoke-WebRequest -Uri $u -OutFile wintun.zip -ErrorAction Stop; $ok = $true; Write-Host "downloaded wintun from $u"; break }
            catch { Write-Host "wintun download failed from ${u}: $_" }
          }
          if (-not $ok) { throw 'could not download wintun.dll from any source' }
          Expand-Archive -Path wintun.zip -DestinationPath wintun-extracted -Force
          Copy-Item wintun-extracted/wintun/bin/amd64/wintun.dll ./_nbin/wintun.dll
          Write-Host "wintun.dll present:" (Test-Path ./_nbin/wintun.dll)

      - name: Run native client e2e (admin runner → vpn TUN + NAT)
        shell: pwsh
        run: |
          $env:GO111MODULE='on'
          $env:SKYWIRE_NATIVEE2E_BIN = "$PWD/_nbin"
          go test -mod=vendor -tags client_e2e -v -timeout=25m ./internal/nativee2e/

  # Compile-only lane for the browser/wasm binaries. Every wasm main package is
  # guarded by //go:build js && wasm, so the default-GOARCH unit lanes never even
  # build them — a break in the js/wasm code (e.g. an import that isn't
  # browser-portable) ships undetected. This job cross-compiles each one with
  # GOOS=js GOARCH=wasm (no run) so build regressions fail CI. Runs in parallel
  # with the other jobs; fast (build only, cached module deps).
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: go.sum

      - name: Compile-check js/wasm binaries
        run: make build-wasm

  # Headless RUNTIME smoke of the real wasm-visor blob (Tier B of the
  # wasm-visor test plan): Node ≥22 executes the compiled js/wasm binary via
  # Go's wasm_exec.js — no browser — boots the visor against a loopback dmsg
  # server started by the script, and asserts the browser-critical path: boot →
  # ws dmsg session → dmsg_connected → the in-wasm hypervisor /api core
  # answering. The compile-check above can't catch runtime-only breakage
  # (boot-glue regressions, carrier selection, the /api dispatch); this does.
  wasm-headless:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Headless wasm-visor smoke (boot → dmsg(ws) → /api)
        run: ./scripts/wasm-headless/run.sh

  # TinyGo lane. Several wasm binaries are ALSO built with TinyGo for the
  # embedded/browser targets (smaller output, no crypto/tls): the dmsg IoT
  # probe (wasip1), the tpviz/dmsg-wasm/wasm-visor browser edges (wasm), and
  # the app-mux routing policy (wasi). The standard-Go `wasm` job above cannot
  # catch TinyGo-only breakage (different compiler, different std-lib subset),
  # so this job installs TinyGo and compile-checks each of them. It then runs a
  # real WASM *runtime* smoke test: rebuild app-mux.wasm from source and drive
  # it through the wazero evaluator (pkg/router/policy/wasm), so the policy
  # loader test exercises a fresh build instead of the committed (stale-able)
  # blob. Runs in parallel with the other jobs.
  wasm-tinygo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: go.sum

      - uses: acifani/setup-tinygo@v2
        with:
          tinygo-version: '0.41.1'

      - name: Compile-check TinyGo wasm binaries
        run: make build-wasm-tinygo

      - name: Rebuild app-mux.wasm and run the policy runtime smoke test
        run: make test-wasm-policy

  # Hypervisor manager UI (Angular). The UI build + lint + unit tests only ever
  # ran as manually-invoked Makefile targets, so a regression that breaks
  # `ng build`, trips an eslint rule, or fails a spec shipped undetected. This
  # job installs the node deps once, lints (fail-fast), builds the production
  # bundle, then runs the karma unit specs headless. Build is invoked directly
  # (not `make build-ui`) to reuse the single npm install above — build-ui
  # re-runs `npm ci` via its install-deps-ui prerequisite, and CI doesn't need
  # the artifact copy into pkg/visor/static that build-ui also does. The specs
  # run in headless Chrome via the ChromeHeadlessNoSandbox launcher (see
  # src/karma.conf.js); browser-actions/setup-chrome provides the binary.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: static/skywire-manager-src/package-lock.json

      - uses: browser-actions/setup-chrome@v2
        id: setup-chrome

      - name: Install UI dependencies
        run: make install-deps-ui

      - name: Lint UI
        run: make lint-ui

      - name: Build UI
        run: cd static/skywire-manager-src && npm run build

      - name: Test UI
        run: make test-ui
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}

  # Redis-backed store tests. redis_store_test.go / redis_test.go live behind
  # //go:build !no_ci because they need a real Redis (redis://localhost:6379),
  # so the tag-free unit lanes (which run with -tags no_ci) skip them — leaving
  # them running in NO job. This lane provides a Redis service and runs those
  # store packages WITHOUT no_ci so the redis-backed tests actually execute.
  redis-store:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: go.sum

      - name: Run redis-backed store tests
        run: go test -mod=vendor -timeout=5m ./pkg/address-resolver/store/... ./pkg/dmsg/discovery/store/...
