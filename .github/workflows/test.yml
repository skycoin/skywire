on: [pull_request]
name: Test

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
          cache: true
          cache-dependency-path: go.sum

      - name: Install Dependencies
        shell: bash
        run: |
          set -euo pipefail

          go install github.com/fzipp/gocyclo/cmd/gocyclo@latest

          sudo apt-get update
          sudo apt-get install -y \
            libglfw3-dev \
            libgl1-mesa-dev \
            xorg-dev \
            libglu1-mesa-dev \
            shellcheck

          make install-shellcheck

      - name: Cache libsecp256k1
        id: cache-libsecp256k1
        uses: actions/cache@v3
        with:
          path: /usr/local/lib/libsecp256k1*
          key: secp256k1-linux-v1

      - name: Install libsecp256k1
        if: steps.cache-libsecp256k1.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf libtool git
          cd /tmp && git clone --depth 1 https://github.com/bitcoin-core/secp256k1.git
          cd secp256k1 && ./autogen.sh && ./configure --enable-module-recovery
          make -j$(nproc) && sudo make install && sudo ldconfig

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh \
            | sh -s -- -b $(go env GOPATH)/bin v2.5.0
        shell: bash

      - name: Lint Shell Scripts
        run: make lint-shell

      - name: Check Format and Run Tests
        run: make check

      - name: Build
        run: make build

      - name: Setup SSH Key, Build and Run E2E
        shell: bash
        run: |
          set -e
          sudo ./ci_scripts/create-ip-aliases.sh
          make e2e-build
          make e2e-run
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Test E2E
        run: make e2e-test

      - name: Clean E2E
        run: make e2e-stop

  darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
          cache: true
          cache-dependency-path: go.sum

      - name: Install Requirements
        run: |
          go install github.com/fzipp/gocyclo/cmd/gocyclo@latest
          brew install glfw
        shell: bash

      - name: Cache libsecp256k1
        id: cache-libsecp256k1
        uses: actions/cache@v3
        with:
          path: /usr/local/lib/libsecp256k1*
          key: secp256k1-macos-v1

      - name: Install libsecp256k1
        if: steps.cache-libsecp256k1.outputs.cache-hit != 'true'
        run: |
          brew install autoconf automake libtool
          cd /tmp && git clone --depth 1 https://github.com/bitcoin-core/secp256k1.git
          cd secp256k1 && ./autogen.sh && ./configure --enable-module-recovery
          make -j$(sysctl -n hw.ncpu) && sudo make install

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh \
            | sh -s -- -b $(go env GOPATH)/bin v2.5.0
        shell: bash

      - name: Checking Format and Testing
        run: make check

      - name: Build
        run: make build

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
          cache: true
          cache-dependency-path: go.sum

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            autoconf
            automake
            libtool
            make
            mingw-w64-x86_64-gcc
            git

      - name: Cache libsecp256k1
        id: cache-libsecp256k1
        uses: actions/cache@v3
        with:
          path: D:\secp256k1
          key: secp256k1-windows-v1

      - name: Install libsecp256k1
        if: steps.cache-libsecp256k1.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          git clone --depth 1 https://github.com/bitcoin-core/secp256k1.git
          cd secp256k1
          ./autogen.sh
          ./configure --enable-module-recovery --prefix=/d/secp256k1
          make -j$(nproc)
          make install

      - name: Set CGO flags
        shell: bash
        run: |
          echo "CGO_CFLAGS=-ID:/secp256k1/include" >> $GITHUB_ENV
          echo "CGO_LDFLAGS=-LD:/secp256k1/lib -lsecp256k1" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=D:/secp256k1/lib/pkgconfig" >> $GITHUB_ENV

      - name: Install golangci-lint
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh" -OutFile "install.sh"
          bash install.sh -b $HOME/go/bin v2.5.0
          echo "$HOME/go/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Requirements
        run: |
          choco install make
          go install github.com/fzipp/gocyclo/cmd/gocyclo@latest

      - name: Install MinGW
        run: choco install mingw -y
        shell: powershell

      - name: Add MinGW to PATH
        run: echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: powershell

      - name: Verify GCC
        run: gcc --version
        shell: powershell

      - name: Testing
        run: |
          set GO111MODULE=on
          make test-windows

      - name: Build
        run: make build-windows
