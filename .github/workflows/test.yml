on: [pull_request]
name: Test

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.*
          cache: true
          cache-dependency-path: go.sum

      - name: Cache Go tools
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-go-tools-${{ hashFiles('Makefile') }}
          restore-keys: |
            ${{ runner.os }}-go-tools-

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/test.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install Dependencies
        shell: bash
        run: |
          set -euo pipefail

          go install github.com/fzipp/gocyclo/cmd/gocyclo@latest

          sudo apt-get update
          sudo apt-get install -y \
            libglfw3-dev \
            libgl1-mesa-dev \
            xorg-dev \
            libglu1-mesa-dev \
            shellcheck

          make dep
          ./ci_scripts/create-ip-aliases.sh

          make install-shellcheck

      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.5.0

      - name: Lint Shell Scripts
        run: make lint-shell

      - name: Check Format and Run Tests
        run: make check

      - name: Build
        run: make build

      - name: Setup SSH Key, Build and Run E2E
        shell: bash
        run: |
          set -e
          make e2e-build
          make e2e-run
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Test E2E
        run: make e2e-test

      - name: Clean E2E
        run: make e2e-stop

  darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.*
          cache: true
          cache-dependency-path: go.sum

      - name: Cache Go tools
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-go-tools-${{ hashFiles('Makefile') }}
          restore-keys: |
            ${{ runner.os }}-go-tools-

      - name: Install Requirements
        run: |
          go install github.com/fzipp/gocyclo/cmd/gocyclo@latest
          make dep
          brew install glfw
        shell: bash

      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.5.0

      - name: Checking Format and Testing
        run: make check

      - name: Build
        run: make build

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.*
          cache: true
          cache-dependency-path: go.sum

      - name: Cache Go tools
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-go-tools-${{ hashFiles('Makefile') }}
          restore-keys: |
            ${{ runner.os }}-go-tools-

      - name: Install Requirements
        run: |
          choco install make
          go install github.com/fzipp/gocyclo/cmd/gocyclo@latest
          make dep

      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.5.0

      - name: Testing
        run: |
          set GO111MODULE=on
          make test-windows

      - name: Build
        run: make build-windows
