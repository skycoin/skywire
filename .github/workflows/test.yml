on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
name: Test

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.1'
          cache: true
          cache-dependency-path: go.sum

      - uses: golangci/golangci-lint-action@v9

      - name: Install Dependencies
        shell: bash
        run: make install-shellcheck

      - name: Lint Shell Scripts
        run: make lint-shell

      - name: Check Format and Run Tests
        run: make check

      - name: Setup SSH Key, Build and Run E2E
        shell: bash
        run: |
          set -e
          sudo ./ci_scripts/create-ip-aliases.sh
          make e2e-build
          make e2e-run
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Test E2E
        run: make e2e-test

      - name: Clean E2E
        run: make e2e-stop

  darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.1'
          cache: true
          cache-dependency-path: go.sum

      - uses: golangci/golangci-lint-action@v9

      - name: Checking Format and Testing
        run: |
          CGO_ENABLED=0 GO111MODULE=on golangci-lint run -c .golangci.yml --build-tags 'withoutsystray withoutgotop' ./...
          CGO_ENABLED=0 go run -tags 'withoutsystray withoutgotop' . --help
          CGO_ENABLED=0 go run -tags 'withoutsystray withoutgotop' . cli config gen -dnw
          CGO_ENABLED=0 go run -tags 'withoutsystray withoutgotop' . cli config gen --nofetch -nw
          CGO_ENABLED=0 GO111MODULE=on go test -cover -timeout=5m -mod=vendor -tags 'no_ci withoutsystray withoutgotop' ./internal/... ./pkg/... ./cmd/skywire-cli/commands/config/...

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.1'
          cache: true
          cache-dependency-path: go.sum

      - uses: golangci/golangci-lint-action@v9

      - name: Install Requirements
        shell: pwsh
        run: choco install make

      - name: Checking (lint + test)
        run: |
          $env:GO111MODULE='on'
          make check-windows
        shell: powershell
