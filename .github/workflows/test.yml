on: [pull_request]
name: Test

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
          cache: true
          cache-dependency-path: go.sum

      - name: Install Dependencies
        shell: bash
        run: |
          set -euo pipefail

          go install github.com/fzipp/gocyclo/cmd/gocyclo@latest

          sudo apt-get update
          sudo apt-get install -y \
            libglfw3-dev \
            libgl1-mesa-dev \
            xorg-dev \
            libglu1-mesa-dev \
            shellcheck

          ./ci_scripts/create-ip-aliases.sh

          make install-shellcheck

      - name: Install golangci-lint v1.61.0
        run: |
          curl -sSfL https://github.com/golangci/golangci-lint/releases/download/v1.61.0/golangci-lint-1.61.0-linux-amd64.tar.gz \
            | tar -xz
          sudo mv golangci-lint-1.61.0-linux-amd64/golangci-lint /usr/local/bin/
          golangci-lint version

      - name: Lint Shell Scripts
        run: make lint-shell

      - name: Check Format and Run Tests
        run: make check

      - name: Build
        run: make build

      - name: Setup SSH Key, Build and Run E2E
        shell: bash
        run: |
          set -e
          make e2e-build
          make e2e-run
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Test E2E
        run: make e2e-test

      - name: Clean E2E
        run: make e2e-stop

  darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
          cache: true
          cache-dependency-path: go.sum

      - name: Install Requirements
        run: |
          go install github.com/fzipp/gocyclo/cmd/gocyclo@latest
          brew install glfw
        shell: bash

      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.6.1
        env:
          CGO_ENABLED: 0

      - name: Checking Format and Testing
        run: make check

      - name: Build
        run: make build

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
          cache: true
          cache-dependency-path: go.sum

      - name: Install Requirements
        run: |
          choco install make
          go install github.com/fzipp/gocyclo/cmd/gocyclo@latest

      - name: Testing
        run: |
          set GO111MODULE=on
          make test-windows

      - name: Build
        run: make build-windows
