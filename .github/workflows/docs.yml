name: Docs

# Builds the MkDocs site from sources spread across the repo (docs/,
# skywire-specs/, rewards/, cmd/apps/**/README.md, cmd/dmsg/*/README.md,
# cmd/svc/*/README.md) and deploys to the gh-pages branch, which GitHub
# Pages serves at https://skycoin.github.io/skywire/.
#
# Triggers:
#   - push to develop: build + deploy
#   - pull_request:    build only (catches broken links / config drift
#                      before merge; doesn't touch gh-pages)
#   - workflow_dispatch: manual rebuild button

on:
  # Every develop push, not just docs paths: the site now ships the
  # PLAYGROUND — the full skywire binary compiled to wasm behind a browser
  # desk — and that must track the code, not just the prose.
  push:
    branches: [develop]
  pull_request:
    paths:
      - 'docs/**'
      - 'skywire-specs/**'
      - 'rewards/**'
      - 'cmd/apps/*/README.md'
      - 'cmd/dmsg/*/README.md'
      - 'cmd/svc/*/README.md'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
      - 'scripts/docs-prepare.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          cache: pip

      - name: Install MkDocs + plugins
        run: |
          pip install \
            mkdocs-material==9.5.* \
            mkdocs-awesome-pages-plugin==2.9.* \
            pymdown-extensions==10.*

      - name: Stage external doc trees under docs/
        run: bash scripts/docs-prepare.sh
      # The desk IS the site root: the whole skywire binary compiled to js/wasm
      # behind a websh terminal and a nested browser, exactly as the wasm visor
      # page is, with two differences — no visor is started, and the terminal
      # has already run `skywire --help`. The docs themselves are served INSIDE
      # that page by `skywire doc serve`, which renders the live cobra tree and
      # the embedded prose from the same binary, and netscrape displays it.
      #
      # It used to be the other way round: mkdocs at the root with the desk
      # opened over it in an iframe from /playground/. That made the docs the
      # wrapper and the desk the guest, which is backwards — every other
      # deployment of this page has the desk at the root.
      #
      # Skipped on PRs — the wasm build costs minutes and PR checks only need
      # the static pages to build.
      - uses: actions/setup-go@v6
        if: github.event_name != 'pull_request'
        with:
          go-version: stable
          cache: true

      - name: Build the desk
        if: github.event_name != 'pull_request'
        run: make playground

      - name: Build
        # No --strict here — the upstream skywire-specs/ and rewards/
        # markdown contain a handful of dangling links / case-mismatched
        # anchors that would otherwise block the deploy. mkdocs.yml
        # already sets `strict: false`; we just have to not override it
        # from the CLI. Warnings are still printed to the build log so
        # a content-cleanup follow-up can address them.
        run: mkdocs build

      # Overlay the desk ON TOP of the built site, replacing mkdocs' landing
      # page with it. Every other static page keeps its path, so existing
      # links, the sitemap and search-engine indexing are untouched — only the
      # root changes hands. Done after `mkdocs build` rather than by staging
      # into docs/ because mkdocs would otherwise try to process the wasm and
      # the bundle as page assets.
      - name: Put the desk at the site root
        if: github.event_name != 'pull_request'
        run: |
          test -f build/playground/index.html || { echo "no desk build to overlay"; exit 1; }
          cp -r build/playground/. site/
          test -f site/skywire.wasm.gz || { echo "the wasm module did not land at the root"; exit 1; }
          echo "site root is now the desk:"; ls -la site/index.html site/skywire.wasm.gz

      - name: Deploy to gh-pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          # ghp-import rather than `mkdocs gh-deploy`: gh-deploy REBUILDS the
          # site before publishing, which would discard the overlay above and
          # put mkdocs' own index.html back at the root.
          pip install ghp-import==2.*
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          ghp-import --no-jekyll --push --force \
            --message "Deploy docs from ${GITHUB_SHA}" site
