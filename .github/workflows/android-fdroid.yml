# F-Droid lane: lint the recipe, run F-Droid's update bot against the tag,
# and build the app on F-Droid's own build server image — the three things
# F-Droid does with android/fdroid/com.skycoin.skywire.yml. See
# android/fdroid/check.sh for what each step proves.
#
# Nothing here publishes: F-Droid's update bot finds the tag and publishes the
# release on its own. This only tells us, on our side, whether F-Droid's run
# of the same tag is going to work. android-release.yml calls it once a
# mobile-v* tag's GitHub release is out; it has no trigger of its own.
name: Android F-Droid

on:
  workflow_call:

permissions:
  contents: read

jobs:
  fdroid:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      # The build server image carries a full Android SDK, the NDK is
      # downloaded on top, and the Go payload builds from a full clone. The
      # runner's preinstalled toolchains are not used by any of it.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Lint, checkupdates, build (F-Droid build server image)
        run: |
          mkdir -p fdroid-out
          docker run --rm \
            -v "$PWD:/src" -v "$PWD/fdroid-out:/out" \
            registry.gitlab.com/fdroid/fdroidserver:buildserver-trixie \
            bash /src/android/fdroid/check.sh

      - uses: actions/upload-artifact@v7
        with:
          name: fdroid-unsigned-apk
          path: fdroid-out/*.apk
          if-no-files-found: error
