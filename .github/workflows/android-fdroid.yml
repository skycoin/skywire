# F-Droid lane, run by android-release.yml once a mobile-vX.Y.Z tag's GitHub
# release is out.
#
# F-Droid's update bot needs the version in a file inside the tag it builds
# (it cannot compute our versionCode from a tag name), so this lane:
#
#   1. stamps X.Y.Z into android/version.properties with sed and commits that
#      on top of the tagged commit — nothing is pushed to any branch;
#   2. runs android/fdroid/check.sh on that commit: fdroid lint, fdroid
#      checkupdates (the update bot) and fdroid build, in F-Droid's own build
#      server image;
#   3. signs that build with the release key (android/fdroid/sign.sh), checks
#      it the way F-Droid will, and attaches it to the mobile-vX.Y.Z release as
#      skywire-X.Y.Z-fdroid.apk;
#   4. only if all of that passed, pushes the tag fdroid-vX.Y.Z on that commit.
#
# fdroid-v* tags are what the recipe (android/fdroid/com.skycoin.skywire.yml)
# tells F-Droid's bot to watch, so F-Droid only ever sees a release this lane
# already built. The build is reproducible: F-Droid builds the same commit,
# checks that its build matches skywire-X.Y.Z-fdroid.apk (the recipe's
# Binaries), and then publishes that APK, signed with our key, rather than
# signing its own. F-Droid does the publishing; this lane only adds that one
# file to the release.
#
# Run it by hand (Actions → Android F-Droid → Run workflow, or
# `gh workflow run android-fdroid.yml -f tag=mobile-vX.Y.Z`) to redo this for
# a tag that already has its release, e.g. after fixing this lane. The source
# is the tag's; check.sh and the recipe are those of the branch it is run
# from, so a fix does not need a new release. If fdroid-vX.Y.Z already exists,
# that commit is what gets built, since it is what F-Droid builds, and a
# skywire-X.Y.Z-fdroid.apk already on the release is checked against the new
# build and left in place, not replaced.
name: Android F-Droid

on:
  workflow_call:
    inputs:
      tag:
        description: mobile-vX.Y.Z tag; empty means the tag the caller runs for
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      tag:
        description: Existing mobile-vX.Y.Z tag to run the F-Droid lane for
        required: true
        type: string

env:
  # From the release: the tag it was pushed for. By hand: the input.
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  fdroid:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write # the fdroid-v tag, the signed APK on the release
    steps:
      - name: Check the tag name
        run: |
          printf '%s' "$TAG" | grep -qE '^mobile-v[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::'$TAG' is not mobile-vX.Y.Z"; exit 1; }

      # The same four secrets android-release.yml signs with. Checked first so
      # a missing one fails now, not after the build. When android-release.yml
      # calls this lane it passes them on with `secrets: inherit`.
      - name: Require signing secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE" ]   || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$STORE_PASS" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ]  || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$KEY_PASS" ]   || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (see android-release.yml)"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          fetch-tags: true

      # check.sh and the recipe from the commit this workflow runs from: the
      # tag itself when the release calls it, the chosen branch by hand.
      - name: Take check.sh and the recipe from ${{ github.ref_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/fdroid-ci"
          git archive "$GITHUB_SHA" android/fdroid | tar -x -C "$RUNNER_TEMP/fdroid-ci"
          ls "$RUNNER_TEMP/fdroid-ci/android/fdroid"

      # A re-run for a tag that already has its fdroid-v tag builds that
      # commit instead of stamping a new one. The APK carries its commit's
      # hash and date, so only a build of that very commit can match what
      # F-Droid builds.
      - name: Stamp the tag's version into android/version.properties
        id: version
        run: |
          raw="${TAG#mobile-v}"
          major=${raw%%.*}; rest=${raw#*.}; minor=${rest%%.*}; patch=${rest#*.}
          code=$((major * 10000 + minor * 100 + patch))
          fdroid_tag="fdroid-v$raw"
          if git rev-parse -q --verify "refs/tags/$fdroid_tag^{commit}" >/dev/null; then
            git merge-base --is-ancestor "refs/tags/$TAG" "refs/tags/$fdroid_tag" \
              || { echo "::error::$fdroid_tag is not on top of $TAG"; exit 1; }
            git checkout -q --detach "refs/tags/$fdroid_tag"
            echo "$fdroid_tag exists; building its commit $(git rev-parse HEAD)"
          else
            sed -i -e "s/^versionName=.*/versionName=$raw/" \
                   -e "s/^versionCode=.*/versionCode=$code/" android/version.properties
            if ! git diff --quiet; then
              git -c user.name='github-actions[bot]' \
                  -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                  commit -q -am "android: version $raw for F-Droid (from $TAG)"
            fi
          fi
          if ! grep -qx "versionName=$raw" android/version.properties \
             || ! grep -qx "versionCode=$code" android/version.properties; then
            echo "::error::android/version.properties is not $raw ($code)"
            exit 1
          fi
          grep -E '^version(Name|Code)=' android/version.properties
          echo "name=$raw" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      # The build server image carries a full Android SDK, the NDK is
      # downloaded on top, and the Go payload builds from a full clone. The
      # runner's preinstalled toolchains are not used by any of it.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Lint, checkupdates, build (F-Droid build server image)
        run: |
          mkdir -p fdroid-out
          docker run --rm \
            -v "$PWD:/src" -v "$PWD/fdroid-out:/out" \
            -v "$RUNNER_TEMP/fdroid-ci:/ci:ro" \
            -e RECIPE=/ci/android/fdroid/com.skycoin.skywire.yml \
            registry.gitlab.com/fdroid/fdroidserver:buildserver-trixie \
            bash /ci/android/fdroid/check.sh

      - uses: actions/upload-artifact@v7
        with:
          name: fdroid-unsigned-apk
          path: fdroid-out/*.apk
          if-no-files-found: error

      # In a container of its own, so the key is never in the one that ran the
      # build. A re-run hands sign.sh the APK the release already has, which
      # must match this build; it is never replaced (F-Droid may already have
      # checked it).
      - name: Sign the F-Droid build with the release key and check it as F-Droid will
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="skywire-${{ steps.version.outputs.name }}-fdroid.apk"
          published=""
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
               --jq '.assets[].name' | grep -qx "$asset"; then
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "$asset" --dir fdroid-published
            published="/src/fdroid-published/$asset"
          fi
          ks="$RUNNER_TEMP/keystore"
          mkdir -p "$ks"
          trap 'rm -rf "$ks"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$ks/release.jks"
          docker run --rm \
            -v "$PWD:/src" -v "$ks:/ks:ro" \
            -v "$RUNNER_TEMP/fdroid-ci:/ci:ro" \
            -e KEYSTORE=/ks/release.jks \
            -e ANDROID_KEYSTORE_PASSWORD -e ANDROID_KEY_ALIAS -e ANDROID_KEY_PASSWORD \
            -e RECIPE=/ci/android/fdroid/com.skycoin.skywire.yml \
            registry.gitlab.com/fdroid/fdroidserver:buildserver-trixie \
            bash /ci/android/fdroid/sign.sh \
              "/src/fdroid-out/com.skycoin.skywire_${{ steps.version.outputs.code }}.apk" \
              "/src/fdroid-signed/$asset" $published

      - name: Attach skywire-${{ steps.version.outputs.name }}-fdroid.apk to the ${{ env.TAG }} release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="skywire-${{ steps.version.outputs.name }}-fdroid.apk"
          if [ -f "fdroid-published/$asset" ]; then
            echo "$asset is already on the release and matches this build; leaving it"
            exit 0
          fi
          gh release upload "$TAG" "fdroid-signed/$asset" --repo "$GITHUB_REPOSITORY"

      # Last, so a failure anywhere above means F-Droid never sees this
      # release. A re-run finds the tag already there and leaves it.
      - name: Tag fdroid-v${{ steps.version.outputs.name }} for F-Droid's update bot
        run: |
          tag="fdroid-v${{ steps.version.outputs.name }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; leaving it"
            exit 0
          fi
          git tag "$tag"
          git push origin "refs/tags/$tag"
