# GoReleaser configuration for macOS builds
# Builds skywire binary with hardware wallet utilities for macOS

version: 2

release:
  github:
    owner: skycoin
    name: skywire

before:
  hooks:
    - go mod tidy
    - go mod vendor

builds:
  - id: skywire
    binary: skywire
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=1
      - CGO_CFLAGS=-I/usr/local/include -I/opt/homebrew/include -I/opt/homebrew/opt/hidapi/include -I/opt/homebrew/opt/libusb/include
      - CGO_LDFLAGS=-L/usr/local/lib -L/opt/homebrew/lib -L/opt/homebrew/opt/hidapi/lib -L/opt/homebrew/opt/libusb/lib
    main: ./cmd/release/skywire.go
    ldflags: -s -w

archives:
  - id: archive
    format: tar.gz
    name_template: 'skywire-v{{ .Version }}-{{ .Os }}-{{ .Arch }}'
    builds:
      - skywire
    files:
      - none*

nfpms:
  - id: skywire-pkg
    package_name: skywire
    builds:
      - skywire
    vendor: Skycoin
    homepage: https://skycoin.com
    maintainer: Skycoin Team
    description: Skywire mesh network visor
    license: MIT
    formats:
      - pkg
    file_name_template: 'skywire-v{{ .Version }}-{{ .Os }}-{{ .Arch }}'
    contents:
      - src: ./dist/skywire_{{ .Os }}_{{ .Arch }}*/skywire
        dst: /usr/local/bin/skywire

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
