# GoReleaser configuration for macOS Intel builds
# Builds skywire binary with hardware wallet utilities for macOS amd64

version: 2

release:
  github:
    owner: skycoin
    name: skywire

builds:
  - id: skywire
    binary: skywire
    goos:
      - darwin
    goarch:
      - amd64
    env:
      - CGO_ENABLED=1
      - CGO_CFLAGS=-I/usr/local/include
      - CGO_LDFLAGS=-L/usr/local/lib
    main: ./cmd/release/
    ldflags: -s -w

archives:
  - id: archive
    format: tar.gz
    name_template: 'skywire-v{{ .Version }}-{{ .Os }}-{{ .Arch }}'
    builds:
      - skywire
    files:
      - none*

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
