# GoReleaser configuration for Windows builds
# Builds skywire binaries for Windows
# amd64 includes hardware wallet utilities, 386 and arm64 do not

version: 2

release:
  github:
    owner: skycoin
    name: skywire

builds:
  - id: skywire-amd64
    binary: skywire
    goos:
      - windows
    goarch:
      - amd64
    env:
      - CGO_ENABLED=1
      - PKG_CONFIG_PATH=C:/msys64/mingw64/lib/pkgconfig
      - CGO_CFLAGS=-IC:/msys64/mingw64/include -IC:/msys64/mingw64/include/libusb-1.0
      - CGO_LDFLAGS=-LC:/msys64/mingw64/lib
    main: ./cmd/release/
    ldflags: -s -w

  - id: skywire-386
    binary: skywire
    goos:
      - windows
    goarch:
      - 386
    env:
      - CGO_ENABLED=0
    main: ./cmd/release/
    ldflags: -s -w

  - id: skywire-arm64
    binary: skywire
    goos:
      - windows
    goarch:
      - arm64
    env:
      - CGO_ENABLED=0
    main: ./cmd/release/
    ldflags: -s -w

archives:
  - id: amd64
    formats:
      - zip
    name_template: 'skywire-v{{ .Version }}-{{ .Os }}-{{ .Arch }}'
    ids:
      - skywire-amd64
    files:
      - none*

  - id: 386
    formats:
      - zip
    name_template: 'skywire-v{{ .Version }}-{{ .Os }}-{{ .Arch }}'
    ids:
      - skywire-386
    files:
      - none*

  - id: arm64
    formats:
      - zip
    name_template: 'skywire-v{{ .Version }}-{{ .Os }}-{{ .Arch }}'
    ids:
      - skywire-arm64
    files:
      - none*

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
