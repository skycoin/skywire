# The app's version as local builds and the F-Droid build see it.
#
# Not edited by hand for a release. The GitHub release takes its version from
# the mobile-vX.Y.Z tag. After it, CI (.github/workflows/android-fdroid.yml)
# writes X.Y.Z here on a commit over the tagged one and tags that commit
# fdroid-vX.Y.Z; F-Droid's update bot reads these two lines at that tag.
# The value on the branch is only what a local ./gradlew build reports.
#
# The code is major*10000 + minor*100 + patch (minor and patch at most 99).
versionName=0.0.4
versionCode=4
