# The app's version, committed so that every mobile-v* tag carries it.
#
# F-Droid's update bot reads these two lines at each new tag to add that
# release to F-Droid by itself, and the F-Droid build takes its version from
# here. So a release is: bump both lines, merge, then tag mobile-v<name>. The
# release workflow refuses a tag that does not match this file.
#
# The code is major*10000 + minor*100 + patch (minor and patch at most 99),
# the same formula the Makefile applies to APK_VERSION.
versionName=0.0.4
versionCode=4
