# F-Droid build recipe. Submit it once as metadata/com.skycoin.skywire.yml
# in a merge request to https://gitlab.com/fdroid/fdroiddata. After that
# F-Droid's update bot keeps it current by itself: at each new fdroid-v* tag
# it reads android/version.properties, appends a copy of the last build
# entry for the new version and commit, and F-Droid builds it. Nothing needs
# resubmitting per release.
#
# fdroid-v* tags are made by CI, not by hand: after each mobile-vX.Y.Z
# release, .github/workflows/android-fdroid.yml stamps X.Y.Z into
# android/version.properties on a commit over the tagged one, runs this
# recipe the way F-Droid does (android/fdroid/check.sh: lint, checkupdates,
# build), and only then tags that commit fdroid-vX.Y.Z.
#
# The store listing (title, descriptions, icon, changelogs) is not in this
# file: fdroidserver reads it from fastlane/metadata/android/ at the repo
# root. It scans only the root, the build's subdir (android/app) and
# src/<flavor>/ for that directory, so android/fastlane/ would be skipped as
# an "unknown subdir".
#
# The build entry is copied forward verbatim for each release, so it must not
# name a version anywhere but versionName/versionCode/commit. The version
# comes from android/version.properties, and Go is built from source at the
# version go.mod names (the go srclib's ref below is only where its clone
# starts). The one exception is TinyGo, also built from source, from the
# srclib pinned below: when the wasm-tinygo lane in .github/workflows/test.yml
# moves to a newer TinyGo, bump the srclib's commit here and in fdroiddata's
# copy too.
#
# srclibs/ next to this file holds the srclib definitions check.sh builds
# with: tinygo.yml is new and is submitted to fdroiddata with the recipe,
# go.yml is a verbatim copy of fdroiddata's own.
#
# commit is a full hash, not the fdroid-v* tag: fdroiddata takes no tag or
# branch names there, since those can be moved. The update bot resolves each
# new fdroid-v* tag to its hash by itself.
#
# mobile-v0.0.3 and earlier predate the LICENSE and the skywireFdroid switch,
# and fdroid-v0.0.4 kept its listing under android/fastlane/, where
# fdroidserver never looked. So the first build is fdroid-v0.0.5, made by the
# mobile-v0.0.5 release.

Categories:
  - Connectivity
  - Messaging
  - VPN & Proxy
  - Wallet
License: AGPL-3.0-only
AuthorName: Skycoin
WebSite: https://www.skycoin.com
SourceCode: https://github.com/skycoin/skywire
IssueTracker: https://github.com/skycoin/skywire/issues
Changelog: https://github.com/skycoin/skywire/releases

AutoName: Skywire

RepoType: git
Repo: https://github.com/skycoin/skywire.git

Builds:
  - versionName: 0.0.5
    versionCode: 5
    commit: e8a4d78b1e32a81d8ed599e9b0e9d5af2bdaaf11
    subdir: android/app
    sudo:
      - apt-get update
      # Debian's Go only bootstraps the Go built in `build`: Go 1.26 needs
      # 1.24.6 or newer for that, and trixie has 1.24.4, backports 1.26.
      - apt-get install -y make
      - apt-get install -y -t trixie-backports golang-go
      # What TinyGo is built with and against in `build`: Debian's LLVM 19
      # (trixie's), a C++ compiler for its cgo, and binaryen for the wasm-opt
      # it runs on every wasm binary.
      - apt-get install -y g++ llvm-19-dev libclang-19-dev clang-19 lld-19 binaryen
    gradle:
      - yes
    # Go itself, and TinyGo 0.42.0 for the routing-policy presets built below.
    srclibs:
      - go@go1.26.4
      - tinygo@bdc4a21af007d8f059b5cefe5644b7ee7bda5b2d
    # The routing-policy presets the mobile binary embeds with go:embed. The
    # committed copy is removed and built again from source in `build`.
    rm:
      - pkg/router/policy/wasm/presets/bundle.wasm
    # Prebuilt files in the repo that the mobile build does not use: the
    # `mobile` build tag excludes the GeoLite2 database and the wasm
    # hypervisor, the compiled wasm routing-policy examples are docs (their
    # sources stay: the presets are built from one of them), and the two
    # package.json files are npm metadata that vendored Go modules carry.
    scandelete:
      - pkg/geoip/GeoLite2-City.mmdb.gz
      - pkg/wasmhv/execwasm/blob
      - docs/examples/routing-policies/wasm/*/*.wasm
      - vendor/github.com/blang/semver/package.json
      - vendor/github.com/go-redis/redis/v8/package.json
    # A generated file the mobile binary embeds with go:embed, so it has to
    # stay: the pty web terminal page, gzipped HTML.
    scanignore:
      - pkg/pty/term.html.gz
    gradleprops:
      # Strips the in-app updater and REQUEST_INSTALL_PACKAGES: F-Droid
      # delivers the updates. See android/app/build.gradle.kts.
      - skywireFdroid=true
    ndk: r27c
    build:
      - cd ../..
      # Go from the srclib, at the version go.mod names, bootstrapped by
      # Debian's. Everything below uses it and no other: GOTOOLCHAIN=local
      # never switches to a downloaded toolchain. TinyGo needs this too: it
      # refuses to compile with a newer Go than the one it was built with.
      - git -C $$go$$ checkout -q -f "go$(sed -n 's/^go //p' go.mod)"
      - (cd $$go$$/src && ./make.bash)
      - export PATH="$$go$$/bin:$PATH" GOTOOLCHAIN=local
      - go version
      # TinyGo from the srclib, linked against Debian's LLVM 19 (-tags=llvm19,
      # as TinyGo's own compat CI builds it). It compiles its C runtime
      # libraries from source on first use: wasi-libc from its submodule, and
      # compiler-rt's builtins from the llvm-project commit TinyGo pins in
      # llvm-version.txt, of which only compiler-rt/lib/builtins is fetched.
      # Its Go modules come from the module proxy, checked against
      # sum.golang.org.
      - git -C $$tinygo$$ submodule update --init lib/wasi-libc
      - git init -q $$tinygo$$/llvm-project
      - git -C $$tinygo$$/llvm-project sparse-checkout set compiler-rt/lib/builtins
      - git -C $$tinygo$$/llvm-project fetch -q --depth=1 --filter=blob:none
        https://github.com/tinygo-org/llvm-project "$(cat $$tinygo$$/llvm-version.txt)"
      - git -C $$tinygo$$/llvm-project checkout -q FETCH_HEAD
      - (cd $$tinygo$$ && GOPROXY=https://proxy.golang.org,direct GOSUMDB=sum.golang.org
        go build -tags=llvm19 -o build/tinygo .)
      - export PATH="$$tinygo$$/build:$PATH"
      - tinygo version
      # From here on nothing is downloaded: skywire builds from vendor/, and
      # with the module proxy off, a toolchain fetch would be an error, not a
      # prebuilt Go.
      - export GOPROXY=off
      # The presets removed above, built with TinyGo from
      # docs/examples/routing-policies/wasm/bundle; the target then checks
      # that the fresh build decides exactly as the native presets do.
      - make bundle-wasm
      # The Go core (libskywire-mobile.so) from vendored sources, into
      # app/src/main/jniLibs, before gradle packages it. The NDK lane is the
      # release one: cgo resolves DNS through bionic.
      - ANDROID_NDK_HOME=$$NDK$$ make android-mobile-ndk

AutoUpdateMode: Version
UpdateCheckMode: Tags ^fdroid-v[0-9]+\.[0-9]+\.[0-9]+$
UpdateCheckData: android/version.properties|(?m)^versionCode=(\d+)$|android/version.properties|(?m)^versionName=(\S+)$
CurrentVersion: 0.0.5
CurrentVersionCode: 5
