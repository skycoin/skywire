<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>skywire playground</title>
<style>
  html,body{margin:0;height:100%;background:#0e0c14;color:#cdd2da;font:14px/1.5 system-ui,sans-serif}
  #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8em;z-index:10}
  #boot .t{color:#9d7cff;font:600 18px system-ui}
  #boot .s{color:#9aa0a6;font:12px monospace;max-width:44em;text-align:center}
  #boot.gone{display:none}
</style>
</head>
<body>
<div id="boot">
  <div class="t">skywire playground</div>
  <div class="s" id="boot-msg">loading…</div>
</div>
<script>
// Early error trap: keep full stacks of uncaught errors for diagnosis
// (devtools-free environments — CI probes, bug reports).
window.__errs = [];
Error.stackTraceLimit = 300;
addEventListener('error', function (e) {
  if (window.__errs.length < 20) {
    var s = String((e.error && e.error.stack) || e.message || e);
    window.__errs.push(s.slice(0, 600) + '\n…\n' + s.slice(-2400));
  }
});
</script>
<!-- Go's wasm_exec loader (standard Go — both modules here are std-Go builds). -->
<script src="wasm_exec.js"></script>
<!-- The desk bundle: bottle (jsfs + vnet) → skywire seeding → winbox → browse.js → skywire-exec. -->
<script src="bundle.js"></script>
<script>
// The skywire playground: a browser tab laid out like a Linux host.
//
// No visor runs by default. The desk (winbox windows over a panel) opens with
// one terminal already showing `skywire --help`; from there the Linux ritual
// works exactly as the docs describe it:
//
//   skywire autoconfig                        # visor starts IN this terminal
//   skywire cli visor info                    # from a second terminal
//   skywire cli proxy start <exit-pk>         # SOCKS5 on 127.0.0.1:1080
//   curl -x socks5h://127.0.0.1:1080 https://example.com/
//
// and the nested browser reaches the visor's own hypervisor UI at
// http://127.0.0.1:8001 over the tab's virtual loopback. The filesystem
// persists in IndexedDB across reloads.
(function () {
  'use strict';
  var msg = function (s) { var el = document.getElementById('boot-msg'); if (el) el.textContent = s; };

  // Command modules are fetched relative to this page; .gz is inflated in-page
  // (static hosting can't set Content-Encoding).
  skywireExec.wasmURL = 'skywire.wasm.gz';
  skywireExec.wasmExecURL = 'wasm_exec.js';
  globalThis.__WINBOX_WASM_URL__ = 'winbox.wasm';

  function gunzipFetch(url) {
    return fetch(url).then(function (r) {
      if (!r.ok) throw new Error('fetch ' + url + ': HTTP ' + r.status);
      var inflated = r.body.pipeThrough(new DecompressionStream('gzip'));
      return new Response(inflated, { headers: { 'Content-Type': 'application/wasm' } }).arrayBuffer();
    });
  }

  function waitFor(fn, what, tries) {
    return new Promise(function (res, rej) {
      var n = 0;
      (function poll() {
        var v = fn();
        if (v) { res(v); return; }
        if (++n > (tries || 600)) { rej(new Error('timed out waiting for ' + what)); return; }
        setTimeout(poll, 50);
      })();
    });
  }

  var q = new URLSearchParams(location.search);
  msg('restoring filesystem…');
  (q.has('nopersist') ? Promise.resolve({ restored: false }) : jsfs.persist.enable('skywire-playground')).then(function (p) {
    msg((p.restored ? 'filesystem restored — ' : '') + 'starting the desk…');
    // Boot the desk host: the wasm-visor binary in-page. It installs the
    // shell + the skywireVisor API and then waits — the page never calls
    // boot(), so NO visor runs until you start one in a terminal.
    return gunzipFetch('wasm-visor.wasm.gz');
  }).then(function (buf) {
    var go = new Go();
    go.exit = function (c) { console.log('DESK-HOST exited, code', c, 'at', Math.round(performance.now()) + 'ms'); };
    return WebAssembly.instantiate(buf, go.importObject).then(function (r) {
      go.run(r.instance).then(
        function () { console.log('DESK-HOST run() resolved at', Math.round(performance.now()) + 'ms'); },
        function (e) { console.log('DESK-HOST run() rejected:', String(e)); }
      ); // installs globals, then blocks
      return Promise.all([
        waitFor(function () { return globalThis.skywireShell; }, 'the shell'),
        waitFor(function () { return globalThis.SkywireBrowse; }, 'browse.js'),
        waitFor(function () { return typeof globalThis.WinBox === 'function'; }, 'the window manager'),
      ]);
    });
  }).then(function () {
    var sv = globalThis.skywireVisor;
    var p = globalThis.SkywireBrowse.mountPanel(document, {
      noTour: true, // the tour narrates the visor page; this desk boots no visor
      fetchDmsg: function () { return sv.fetchDmsg.apply(null, arguments); },
      serveContent: function (m) { return sv.serveContent(m); },
      selfPK: function () { try { return sv.status().pk || ''; } catch (e) { return ''; } },
      api: function (m, path, body) {
        return sv.hvApi(m, path, body).then(function (r) {
          return { status: r.status, body: new TextDecoder().decode(r.body) };
        });
      },
    });
    globalThis.__skywireDesk = p;
    document.getElementById('boot').className = 'gone';
    // Default layout: one terminal, already showing the top-level help.
    if (!q.has('noconsole')) {
      p.openConsole({ title: 'skywire', initCmd: q.has('noinit') ? '' : 'skywire --help' });
    }
  }).catch(function (e) {
    msg('boot failed: ' + (e && e.message || e));
  });
})();
</script>
</body>
</html>
