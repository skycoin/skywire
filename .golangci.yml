version: "2"

run:
  concurrency: 4
  modules-download-mode: vendor
  issues-exit-code: 1
  tests: true

output:
  formats:
    text:
      path: stdout

linters:
  # In v2, 'disable-all' is replaced with 'default: none'
  default: none
  
  enable:
    - errcheck
    - gosec
    - ineffassign
    - misspell
    - nakedret
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  
  # Settings moved under linters section in v2
  settings:
    errcheck:
      check-type-assertions: false
      check-blank: true

    misspell:
      locale: US

    nakedret:
      max-func-lines: 30

    unparam:
      check-exported: false

    revive:
      rules:
        - name: package-comments
          disabled: true
  
  # Exclusions moved under linters section in v2
  exclusions:
    # Excluding configuration per-path, per-linter, per-text and per-source
    rules:
      - path: third_party$
      
      - path: builtin$
      
      - path: examples$
      
      - path: ".*_cgo\\.go$"

      - path: src/cipher/bip39/wordlists/
        linters:
          - misspell

      - linters:
          - staticcheck
        text: "QF1003:"
        
      - linters:
          - staticcheck
        text: "ST1005:"
        
      - linters:
          - staticcheck
        text: "QF1008:"
        
      - linters:
          - staticcheck
        text: "QF1001:"
        
      - linters:
          - staticcheck
        text: "QF1002:"
        
      - linters:
          - staticcheck
        text: "QF1010:"
        
      - linters:
          - staticcheck
        text: "QF1004:"
        
      - linters:
          - staticcheck
        text: "QF1006:"

# The 'issues' section is now separate at top level
issues:
  # In v2, the 'new' field moved from root level to issues section
  new: false
