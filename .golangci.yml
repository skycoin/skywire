version: "2"

run:
  concurrency: 4
  modules-download-mode: readonly  
  issues-exit-code: 1
  tests: true
  skip-dirs:
    - vendor
    - cmd/skywire-cli/commands/rewards/ui

linters:
  default: none
  enable:
    - errcheck
    - gosec
    - ineffassign
    - misspell
    - nakedret
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused

linters-settings:
  dupl:
    threshold: 100
  errcheck:
    check-type-assertions: false
    check-blank: true
  goconst:
    min-len: 3
    min-occurrences: 3
  gocyclo:
    min-complexity: 10
  lll:
    line-length: 120
    tab-width: 1
  misspell:
    locale: US
  nakedret:
    max-func-lines: 30
  prealloc:
    simple: true
    range-loops: true
    for-loops: false
  unparam:
    check-exported: false
  revive:
    rules:
      - name: package-comments
        disabled: true
  staticcheck:
    checks: ["all", "-QF1003", "-ST1005", "-QF1008", "-QF1001", "-QF1002", "-QF1010", "-QF1004", "-QF1006"]

issues:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
    rules:
      - linters:
          - misspell
        path: src/cipher/bip39/wordlists/
      - linters:
          - staticcheck
        text: "QF1003:"
      - linters:
          - staticcheck
        text: "ST1005:"
      - linters:
          - staticcheck
        text: "QF1008:"
      - linters:
          - staticcheck
        text: "QF1001:"
      - linters:
          - staticcheck
        text: "QF1002:"
      - linters:
          - staticcheck
        text: "QF1010:"
      - linters:
          - staticcheck
        text: "QF1004:"
      - linters:
          - staticcheck
        text: "QF1006:"