version: "2"
run:
  concurrency: 4
  modules-download-mode: vendor
  issues-exit-code: 1
  tests: true
output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
      colors: true
linters:
  default: none
  enable:
    - errcheck
    - gosec
    - ineffassign
    - misspell
    - nakedret
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    dupl:
      threshold: 100
    errcheck:
      check-type-assertions: false
      check-blank: true
    goconst:
      min-len: 3
      min-occurrences: 3
    gocyclo:
      min-complexity: 10
    lll:
      line-length: 120
      tab-width: 1
    misspell:
      locale: US
    nakedret:
      max-func-lines: 30
    prealloc:
      simple: true
      range-loops: true
      for-loops: false
    unparam:
      check-exported: false
    revive:
      rules:
        - name: package-comments
          disabled: true
  exclusions:
    generated: lax
    paths:
      - vendor/
      - third_party/
      # Vendored router7 DHCP/DNS engine (Apache-2.0, rtr7/router7) — kept
      # verbatim for upstream re-sync, not held to skywire's linter. Our own
      # wrapper (pkg/vpnrouter/lan.go) is NOT excluded.
      - pkg/vpnrouter/router7/
      - cmd/skywire-cli/commands/gotop
      - builtin$
      - examples$
      # Skip any .go file that npm package vendoring drops under the
      # frontend node_modules tree (e.g. flatted/golang/**). These are
      # not part of the skywire source and a developer-local `npm
      # install` should not break lint.
      - node_modules
    rules:
      - linters:
          - misspell
        path: src/cipher/bip39/wordlists/
      - linters:
          - staticcheck
        text: "QF1003:" # could use tagged switch on errCode (staticcheck)
      - linters:
          - staticcheck
        text: "ST1005:" # error strings should not be capitalized (staticcheck)
      - linters:
          - staticcheck
        text: "QF1008:" # could remove embedded field "Common" from selector (staticcheck)
      - linters:
          - staticcheck
        text: "QF1001:" # could apply De Morgan's law (staticcheck)
      - linters:
          - staticcheck
        text: "QF1002:" # could use tagged switch on rs.Type (staticcheck)
      - linters:
          - staticcheck
        text: "QF1010:" # could convert argument to string (staticcheck)
      - linters:
          - staticcheck
        text: "QF1004:" # could use strings.ReplaceAll instead (staticcheck)
      - linters:
          - staticcheck
        text: "QF1006:" # could lift into loop condition (staticcheck)
      - linters:
          - staticcheck
        text: "QF1012:" # could use fmt.Fprintf instead of WriteString(fmt.Sprintf) (staticcheck)
      # The mesh gateway is Linux-only; on darwin/windows the //go:build
      # !linux stub functions always return an error, so the SHARED caller's
      # `if err != nil` reads as "always true" (SA4023) on those platforms
      # only. The cross-platform code is correct — the stub path is meant to
      # fail — so this is a platform-stub false positive, not a dead branch.
      - linters:
          - staticcheck
        text: "SA4023:"
        path: "(pkg/vpn/|pkg/vpnrouter/meshgw/|cmd/apps/vpn-router/)"
      # require.NoError-then-use pattern in these tests: staticcheck can't
      # prove the pointer is non-nil after the error check (SA5011), but the
      # test contract (a non-error result yields a valid value) guarantees it.
      - linters:
          - staticcheck
        text: "SA5011:"
        path: "(pkg/calvin/|pkg/deployment/conf/api/|pkg/skywireconfig/autoconfigcmd/).*_test\\.go"
issues:
  new: false
formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: true
