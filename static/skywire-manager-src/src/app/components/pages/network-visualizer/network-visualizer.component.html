<div class="row">
  <div class="col-12">
    <app-top-bar
      [titleParts]="['node.details.tpviz.title']"
      [tabsData]="tabsData"
      [selectedTabIndex]="6"
      [showUpdateButton]="false"
    ></app-top-bar>
  </div>

  <div class="content col-12 mt-4.5">
    <!-- The pkg/tpviz transport-graph UI (sidebar, filters, grouping and
         Globe/Flat/WebGL views) mounts itself into the generic bundle host, in
         the SPA's own context — no iframe, no /tp-viz/ break-out. -->
    <app-bundle-mount
      class="viz-graph"
      [src]="bundleSrc"
      [scriptId]="bundleId"
      globalName="SkywireTpviz"
      [opts]="mountOpts"
      loadingText="loading network visualizer…"
      unavailableText="The network visualizer isn't available on this visor — the transport-graph UI isn't served here. It's available in the native hypervisor."
      (ready)="onReady($event)"
    ></app-bundle-mount>
  </div>
</div>
