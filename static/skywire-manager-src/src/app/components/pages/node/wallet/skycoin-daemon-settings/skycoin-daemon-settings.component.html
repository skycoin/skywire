<div class="inline-settings">
  <div class="inline-title dim small">{{ 'wallet.daemons.settings.title' | translate }}: <span class="mono">{{ app?.name }}</span></div>

  <form [formGroup]="form" (ngSubmit)="save()" class="inline-form">

    <div class="field">
      <label for="fiberToml-{{ app?.name }}">{{ 'wallet.daemons.settings.fiber-toml' | translate }}</label>
      <input id="fiberToml-{{ app?.name }}" type="text" formControlName="fiberToml"
             placeholder="/etc/skywire/fibercoins/aix.toml">
      <div class="hint dim small">{{ 'wallet.daemons.settings.fiber-toml-hint' | translate }}</div>
    </div>

    <div class="field-row">
      <div class="field">
        <label for="port-{{ app?.name }}">{{ 'wallet.daemons.settings.port' | translate }}</label>
        <input id="port-{{ app?.name }}" type="text" formControlName="port" placeholder="6420">
      </div>
      <div class="field">
        <label for="apiSets-{{ app?.name }}">{{ 'wallet.daemons.settings.api-sets' | translate }}</label>
        <input id="apiSets-{{ app?.name }}" type="text" formControlName="apiSets" placeholder="READ,STATUS">
      </div>
    </div>

    <div class="field">
      <label for="dataDir-{{ app?.name }}">{{ 'wallet.daemons.settings.data-dir' | translate }}</label>
      <input id="dataDir-{{ app?.name }}" type="text" formControlName="dataDir" placeholder="/var/skycoin/aix">
      <div class="hint dim small">{{ 'wallet.daemons.settings.data-dir-hint' | translate }}</div>
    </div>

    @if (saveError) {
      <div class="save-error">
        <mat-icon [inline]="true">error_outline</mat-icon>
        {{ saveError }}
      </div>
    }

    <div class="inline-actions">
      <button type="button" mat-button (click)="cancel()" [disabled]="saving">
        {{ 'common.cancel' | translate }}
      </button>
      <button type="submit" mat-raised-button color="primary" [disabled]="saving">
        <mat-icon [inline]="true">save</mat-icon>
        {{ saving ? ('common.loading' | translate) : ('common.save' | translate) }}
      </button>
    </div>

  </form>
</div>
