<div class="header" mat-dialog-title>
  <span>{{ headline }}</span>
  @if (!disableDismiss) {
    <button mat-dialog-close mat-icon-button class="grey-button-background">
      <mat-icon>close</mat-icon>
    </button>
  }
</div>

<div class="header-separator"></div>

@if (includeScrollableArea) {
  <mat-dialog-content [ngClass]="{'content-margin': includeVerticalMargins}">
    <ng-container *ngTemplateOutlet="contentTemplate"></ng-container>
  </mat-dialog-content>
}
@if (!includeScrollableArea) {
  <div [ngClass]="{'content-margin': includeVerticalMargins}">
    <ng-container *ngTemplateOutlet="contentTemplate"></ng-container>
  </div>
}
<ng-template #contentTemplate><ng-content></ng-content></ng-template>
