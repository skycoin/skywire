<button
  mat-raised-button
  (click)="click()"
  [disabled]="disabled"
  [color]="color"
  [ngClass]="{'for-dark-background': forDarkBackground}"
  #button2
  >
  <div class="d-flex">
    @if (state === buttonStates.Loading) {
      <mat-spinner [diameter]="loadingSize"></mat-spinner>
    }
    @if (state === buttonStates.Error) {
      <mat-icon>error_outline</mat-icon>
    }
    <ng-content></ng-content>
  </div>
</button>
