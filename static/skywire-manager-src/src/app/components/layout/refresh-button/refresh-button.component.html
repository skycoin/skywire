<button
  mat-button
  class="time-button subtle-transparent-button white-theme"
  [disabled]="showLoading"
  [ngClass]="{'grey-button-background' : !showLoading}"
  [matTooltip]="showAlert ? ('refresh-button.error-tooltip' | translate:{time: refeshRate}) : ''"
  >
  <div class="internal-container">
    @if (showLoading) {
      <mat-spinner class="icon d-none d-md-inline-block" [diameter]="14"></mat-spinner>
    }
    @if (showLoading) {
      <mat-spinner class="icon d-md-none" [diameter]="18"></mat-spinner>
    }
    @if (!showLoading) {
      @if (!showAlert) {
        <mat-icon class="icon" [inline]="true">refresh</mat-icon>
      }
      @if (showAlert) {
        <mat-icon class="icon alert" [inline]="true">warning</mat-icon>
      }
    }
    @if (elapsedTime) {
      <span class="d-none d-md-inline">{{ ('refresh-button.' + elapsedTime.translationVarName) | translate:{time: elapsedTime.elapsedTime} }}</span>
    }
  </div>
</button>
