<!doctype html>
<!--
  cmd/wasm-visor dev harness — loads wasm_exec_tinygo.js + wasm-visor.wasm and
  exercises globalThis.skywireVisor (boot/status). Connects back to the
  cmd/dmsg-wasm serve.go control bridge (SSE /ctl/events) so a shell can drive
  the tab:  curl -s localhost:8085/ctl/tabs
            curl -s -XPOST 'localhost:8085/ctl/cmd?tab=<id>' \
                 -d '{"action":"boot","args":["","<seedPK>","<seedWS>","<discDmsgAddr>"]}'
            curl -s 'localhost:8085/ctl/log?tab=<id>'
  Serve it from the same dir as serve.go's -dir (drop this + wasm-visor.wasm +
  wasm_exec_tinygo.js into build/dmsg-wasm/, open http://localhost:8085/visor.html).
-->
<html>
<head><meta charset="utf-8"><title>wasm-visor</title></head>
<body style="font-family:monospace;background:#111;color:#ddd;padding:1em">
<h3>skywire wasm-visor (edge)</h3>
<div>
  sk <input id="sk" size="10" placeholder="(empty = ephemeral)">
  seedPK <input id="seedpk" size="20" value="0371ab4bcff7b121f4b91f6856d6740c6f9dc1fe716977850aeb5d84378b300a13">
  seedWS <input id="seedws" size="30" value="ws://45.79.213.251:30088/dmsg">
  disc <input id="disc" size="20" value="dmsg://022e607e0914d6e7ccda7587f95790c09e126bbd506cc476a1eda852325aadd1aa:80">
  <button onclick="doBoot()">boot</button>
  <button onclick="doStatus()">status</button>
</div>
<div style="margin-top:.6em">
  <b>browse</b> — pk <input id="browsepk" size="40" placeholder="&lt;site-pk&gt; or pk:port">
  path <input id="browsepath" size="12" value="/">
  <button onclick="doBrowse()">go</button>
  <span style="color:#888">(links inside the page route over dmsg too — no DNS, no IP)</span>
</div>
<div style="margin-top:.4em">
  <b>host</b> a page — path <input id="hostpath" size="12" value="/">
  type <input id="hostct" size="10" value="text/html">
  <button onclick="doHost()">host</button>
  <span style="color:#888">(others reach it by your PK, over dmsg)</span>
  <br><textarea id="hostbody" rows="3" style="width:100%;margin-top:.3em;font-family:monospace" placeholder="&lt;h1&gt;hi from my tab, served over dmsg&lt;/h1&gt;"></textarea>
</div>
<pre id="out" style="white-space:pre-wrap;max-height:22vh;overflow:auto"></pre>
<iframe id="browseframe" sandbox="allow-scripts allow-forms" style="width:100%;height:45vh;background:#fff;border:1px solid #444" title="dmsg site"></iframe>

<script src="wasm_exec.js"></script>
<script src="browse.js"></script>
<script>
  const out = document.getElementById("out");
  const log = (...a) => { out.textContent += a.join(" ") + "\n"; out.scrollTop = out.scrollHeight; };

  const go = new Go();
  // TinyGo's wasm_exec.js omits the gojs runtime.getRandomData import that the
  // crypto-using Go runtime needs to seed itself; inject it only when absent.
  if (go.importObject.gojs && !go.importObject.gojs["runtime.getRandomData"]) {
    go.importObject.gojs["runtime.getRandomData"] = (ptr, len) =>
      crypto.getRandomValues(new Uint8Array(go._inst.exports.memory.buffer, ptr >>> 0, len >>> 0));
  }
  fetch("wasm-visor.wasm").then(r => r.arrayBuffer())
    .then(buf => WebAssembly.instantiate(buf, go.importObject))
    .then(res => {
      go.run(res.instance);
      log("wasm loaded; skywireVisor ready: " + Object.keys(globalThis.skywireVisor || {}).join(", "));
    })
    .catch(e => log("wasm load error: " + e));

  async function doBoot() {
    try {
      const pk = await skywireVisor.boot(
        document.getElementById("sk").value.trim(),
        document.getElementById("seedpk").value.trim(),
        document.getElementById("seedws").value.trim(),
        document.getElementById("disc").value.trim());
      log("booted pk=" + pk);
      startRPC();
    } catch (e) { log("boot error: " + (e.message || e)); }
  }
  function doStatus() { log("status: " + JSON.stringify(skywireVisor.status())); }

  // startRPC dials the host RPC bridge (cmd/dmsg-wasm/serve.go's /ctl/rpc) so the
  // ordinary `skywire cli --rpc <addr>` can drive this tab. The host logs the addr
  // (also shown in /ctl/tabs). Best-effort — fine if the page is opened directly.
  function startRPC() {
    if (!skywireVisor.serveRPC) return;
    const tabId = sessionStorage.getItem("ctlTabId") || "tab";
    const url = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ctl/rpc?tab=" + tabId;
    skywireVisor.serveRPC(url)
      .then(() => log("rpc bridge serving — see serve.go log / curl /ctl/tabs for the skywire --rpc addr"))
      .catch(e => log("rpc bridge error: " + (e.message || e)));
  }

  // The dmsg virtual-browser engine lives in browse.js (shared verbatim with the
  // standalone hypervisor overlay). Wire an instance to this harness's browse
  // controls; createBrowser installs its own postMessage handler for in-iframe
  // navigation and the page's own fetch.
  const browser = SkywireBrowse.createBrowser({
    frame: document.getElementById("browseframe"),
    fetchDmsg: (...a) => skywireVisor.fetchDmsg(...a),
    log: log,
    setPK: (pk) => { document.getElementById("browsepk").value = pk; },
    setPath: (p) => { document.getElementById("browsepath").value = p; },
  });

  function doBrowse() {
    browser.browseTo(document.getElementById("browsepk").value, document.getElementById("browsepath").value.trim() || "/");
  }

  function doHost() {
    const path = document.getElementById("hostpath").value.trim() || "/";
    const ct = document.getElementById("hostct").value.trim() || "text/html";
    const body = document.getElementById("hostbody").value;
    const m = {}; m[path] = { ct: ct, body: body };
    skywireVisor.serveContent(m);
    let pk = "(boot first)";
    try { pk = skywireVisor.status().pk || pk; } catch (e) {}
    log("hosting " + path + " (" + body.length + "b, " + ct + ") — reach it: browse pk " + pk + " path " + path);
  }

  // ---- control bridge (drives this tab from a shell via serve.go) ----
  (function () {
    let tabId = sessionStorage.getItem("ctlTabId");
    if (!tabId) { tabId = "visor-" + Math.random().toString(36).slice(2, 8); sessionStorage.setItem("ctlTabId", tabId); }
    log("control tab id: " + tabId);
    const post = (path, body) =>
      fetch(path, { method: "POST", body: typeof body === "string" ? body : JSON.stringify(body) }).catch(() => {});
    const clog = (...a) => { log(...a); post("/ctl/log?tab=" + tabId, a.join(" ")); };
    window.__skylog = m => clog("[dmsg] " + m);

    async function exec(c) {
      const a = c.args || [];
      switch (c.action) {
        case "boot": {
          const pk = await skywireVisor.boot(a[0] || "", a[1] || "", a[2] || "", a[3] || "");
          startRPC(); // expose this tab's visor RPC to `skywire cli` over the bridge
          return pk;
        }
        case "hvApi": {
          const r = await skywireVisor.hvApi(a[0] || "GET", a[1] || "/api/visors", a[2] || null);
          return { status: r.status, body: new TextDecoder().decode(r.body) };
        }
        case "tpdEdge": {
          const j = await skywireVisor.tpdEdge(a[0]);
          const arr = JSON.parse(j);
          return { count: Array.isArray(arr) ? arr.length : 0, sample: Array.isArray(arr) ? arr.slice(0, 1) : arr };
        }
        case "dialTransport": {
          // a = [peerPK, netType("ws"|"wt"), url, certHash?]
          const id = await skywireVisor.dialTransport(a[0] || "", a[1] || "wt", a[2] || "", a[3] || "");
          return { transport: id };
        }
        case "dialRoute": {
          // a = [remotePK, port] — originate a route group via the router.
          return await skywireVisor.dialRoute(a[0] || "", a[1] || 80);
        }
        case "status":
          return skywireVisor.status();
        case "browse": {
          // a = [sitePK, path] — fetch a dmsg site, render it (nav-enabled).
          const res = await browser.browseTo(a[0] || "", a[1] || "/");
          return { status: res.status, bytes: res.bytes, preview: (res.html || "").slice(0, 2000) };
        }
        case "host": {
          // a = [path, contentType, body] — self-host a page over dmsg.
          const m = {}; m[a[0] || "/"] = { ct: a[1] || "text/html", body: a[2] || "" };
          skywireVisor.serveContent(m);
          return { hosting: a[0] || "/" };
        }
        case "reload":
          post("/ctl/log?tab=" + tabId, "reloading");
          setTimeout(() => location.reload(), 150);
          return "reloading";
        default: throw new Error("unknown action: " + c.action);
      }
    }

    const readyPoll = setInterval(() => {
      if (window.skywireVisor && skywireVisor.boot) { clearInterval(readyPoll); clog("skywireVisor READY " + tabId); }
    }, 200);

    const es = new EventSource("/ctl/events?tab=" + tabId);
    es.onmessage = async (ev) => {
      const c = JSON.parse(ev.data);
      try { const v = await exec(c); post("/ctl/result", { id: c.id, ok: true, value: v }); }
      catch (e) { post("/ctl/result", { id: c.id, ok: false, error: e.message || String(e) }); }
    };
    es.onerror = () => {};
  })();
</script>
</body>
</html>
